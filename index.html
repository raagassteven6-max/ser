<style>
/* ==========================================================
   S.E.R. — dot-matrix pixel UI
   One unit = 4px. Panels get a notched pixel border (4 offset
   shadows, no radius) and a hard offset shadow. Big headings
   are rendered as a lit dot lattice via a radial mask.
   Light / dark is driven by <html data-theme>.
   ========================================================== */

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
ul { padding: 0; list-style: none; }

/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --bg: #ecebf6; --bg2: #e1def2; --panel: #fbfaff; --panel2: #f0eefb;
  --ink: #17133b; --muted: #524f78; --line: #17133b; --shade: #b7b1dd; --dot: #cbc7e5; --edge: #8d86b8;
  --a1: #4b3fe0; --on-a1: #ffffff; --a2: #d6208f; --a3: #0a86ab; --link: #3731c9;
  --cyan: #8adcf2; --lime: #9ff0c8; --pink: #f6a9e2; --amber: #ffe08a; --lav: #cfc6fa; --on-led: #14102f;
  --screen: #ddd6f8; --code-bg: #14102f; --code-fg: #e9e6ff;

  --ui: "Pixelify Sans", "DotGothic16", ui-sans-serif, system-ui, sans-serif;
  --disp: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  --mono: "DotGothic16", ui-monospace, "Courier New", monospace;

  /* notched pixel border: four 2px bars, corners left empty */
  --bd: 0 -2px 0 0 var(--line), 0 2px 0 0 var(--line), -2px 0 0 0 var(--line), 2px 0 0 0 var(--line);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090820; --bg2: #0f0d2b; --panel: #14113a; --panel2: #1b1850;
  --ink: #ece9ff; --muted: #a8a3d8; --line: #8a82ff; --shade: #04030d; --dot: #26225e; --edge: #4a45a2;
  --a1: #6fe8ff; --on-a1: #07061a; --a2: #ff6fd0; --a3: #8cffc6; --link: #8fe0ff;
  --cyan: #6fe8ff; --lime: #8cffc6; --pink: #ff8fdc; --amber: #ffd36a; --lav: #b9acff; --on-led: #0a0820;
  --code-bg: #07061a;
}

/* ---------- base ---------- */
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.5px);
  background-size: 4px 4px;
  color: var(--ink); font: 400 1.0625rem/1.6 var(--ui);
  overflow: hidden; -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { line-height: 1.15; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: var(--link); text-underline-offset: .2em; text-decoration-thickness: 2px; }
:focus-visible { outline: 3px dashed var(--a2); outline-offset: 3px; }
main:focus, .desk:focus { outline: none; }
::selection { background: var(--a2); color: var(--on-a1); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: fixed; inset-inline-start: .5rem; inset-block-start: -5rem; z-index: 300; background: var(--ink); color: var(--panel); padding: .6rem 1rem; font: 700 .75rem var(--disp); letter-spacing: .1em; text-transform: uppercase; }
.skip:focus { inset-block-start: .5rem; }
.gl svg, [data-g] svg { fill: currentColor; shape-rendering: crispEdges; }
.gl { display: inline-grid; place-items: center; }
.flip svg { transform: scaleX(-1); }

/* ---------- app frame ---------- */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.top {
  position: relative; z-index: 30; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem;
  padding: .55rem clamp(.6rem, 2vw, 1.25rem); background: var(--panel); border-block-end: 2px solid var(--line);
}
.top::after {
  content: ""; position: absolute; inset-inline: 0; top: 100%; height: 8px; pointer-events: none;
  background:
    radial-gradient(circle at 2px 4px, var(--a1) 1.5px, transparent 2px) 0 0 / 8px 8px,
    radial-gradient(circle at 6px 4px, var(--a2) 1.5px, transparent 2px) 0 0 / 8px 8px;
}
.brand { display: flex; align-items: center; gap: .65rem; color: var(--ink); text-decoration: none; margin: 2px; }
.brand .logo { display: grid; place-items: center; inline-size: 2.2rem; block-size: 2.2rem; background: var(--ink); color: var(--panel); box-shadow: var(--bd); }
.brand .logo svg { inline-size: 1.15rem; block-size: 1.3rem; }
.brand b { font: 700 1.05rem var(--disp); letter-spacing: .1em; }
.brand-sub { font: .78rem var(--mono); color: var(--muted); }
.nav { display: flex; gap: .3rem; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  display: grid; place-items: center; min-height: 2.5rem; padding: 0 .8rem; white-space: nowrap;
  font: 700 .68rem/1 var(--disp); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); text-decoration: none; border: 2px solid transparent;
}
.nav a:hover { border-color: var(--line); background: var(--panel2); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--panel); }
.top-r { display: flex; align-items: center; gap: .8rem; margin-inline-start: auto; }
.clock { font: .8rem var(--mono); color: var(--muted); white-space: nowrap; }
.theme {
  position: relative; display: flex; align-items: center; justify-content: space-between; inline-size: 4.8rem; block-size: 2.4rem;
  padding: 0 .55rem; margin: 2px; background: var(--panel2); box-shadow: var(--bd); color: var(--muted);
}
.theme .gl { position: relative; z-index: 1; inline-size: 1.1rem; block-size: 1.1rem; }
.theme .gl svg { inline-size: 100%; block-size: 100%; }
.theme .sw-knob { position: absolute; inset-block: 3px; inset-inline-start: 3px; inline-size: calc(50% - 3px); background: var(--a1); transition: transform .14s steps(3); }
.theme[aria-checked="true"] .sw-knob { transform: translateX(100%); }
.theme[aria-checked="false"] .sun, .theme[aria-checked="true"] .moon { color: var(--on-a1); }

.desk { position: relative; flex: 1; min-height: 0; overflow: hidden; }
/* Wallpaper: only an image you upload to backgrounds/ shows here, under a dot-screen veil. Nothing is hardcoded. */
.backdrop { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.backdrop.on { background: var(--bg) var(--bgimg) center / cover no-repeat; }
.backdrop.on::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle, transparent 1.1px, color-mix(in srgb, var(--bg) 84%, transparent) 1.7px) 0 0 / 4px 4px;
}

/* ---------- shared surfaces ---------- */
.px, .raised { background: var(--panel); box-shadow: var(--bd), 6px 6px 0 0 var(--shade); }
.sunk { background: var(--bg2); border: 2px solid var(--line); }

/* ---------- home ---------- */
.home { position: absolute; inset: 0; z-index: 1; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--a1) var(--bg2); }
.home-in { max-inline-size: 72rem; margin-inline: auto; padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 3vw, 2rem) 3rem; display: grid; gap: clamp(1.5rem, 3.5vw, 2.5rem); }
.hero { display: grid; gap: 1.1rem; padding: clamp(1.1rem, 3.5vw, 2.25rem); }
.hero-k { display: flex; align-items: center; gap: .6rem; font: 700 .68rem var(--disp); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.led-dot { inline-size: .6rem; block-size: .6rem; background: var(--a2); animation: blink 1.2s steps(2) infinite; flex: none; }
@keyframes blink { 50% { opacity: .15; } }
.hero-d { max-inline-size: 38rem; color: var(--muted); font-size: 1.1rem; }

/* big headings: gradient text sampled through a 4px dot lattice */
.led, .pg-head h1 {
  font-family: var(--disp); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1; overflow-wrap: anywhere;
  background: linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-mask: radial-gradient(circle at 50% 50%, #000 1.55px, transparent 1.95px) 0 0 / 4px 4px;
  mask: radial-gradient(circle at 50% 50%, #000 1.55px, transparent 1.95px) 0 0 / 4px 4px;
  filter: drop-shadow(3px 3px 0 var(--shade));
}
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .led, .pg-head h1 { color: var(--ink); -webkit-text-fill-color: currentColor; background: none; }
}
.hero .led { font-size: clamp(2.2rem, 8.5vw, 5.8rem); padding-block-end: .25rem; }

.ticker { position: relative; overflow: hidden; background: #07051a; border: 2px solid var(--line); }
.ticker-t { display: flex; inline-size: max-content; animation: marq 40s linear infinite; }
.ticker-t span { padding-inline: 1.5rem; white-space: nowrap; font: 1.15rem/2.5rem var(--mono); color: #7ff0ff; text-shadow: 0 0 6px rgba(127, 240, 255, .7); }
.ticker::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 1px, rgba(7, 5, 26, .72) 1.6px) 0 0 / 3px 3px; }
@keyframes marq { to { transform: translateX(-50%); } }

.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.75rem), 1fr)); gap: 1.5rem; }
@media (max-width: 47.99rem) { .icons { gap: 1.1rem; } .icon { padding: .75rem; } .icon svg { inline-size: 3rem; block-size: 3rem; } .icon .n { inset: 1.1rem 1.1rem auto auto; } }
.icon {
  position: relative; display: grid; gap: .6rem; align-content: start; padding: 1rem; color: var(--ink); text-decoration: none;
  background: var(--panel); box-shadow: var(--bd), 6px 6px 0 0 var(--shade); transition: transform .08s steps(2), box-shadow .08s steps(2);
}
.icon:hover, .icon:focus-visible { transform: translate(-3px, -3px); box-shadow: var(--bd), 9px 9px 0 0 var(--a2); }
.icon:active { transform: translate(4px, 4px); box-shadow: var(--bd), 0 0 0 0 var(--shade); }
.icon .n { position: absolute; inset: 1.35rem 1.4rem auto auto; z-index: 2; font: .78rem var(--mono); color: #14102f; font-style: normal; }
.icon .ico { position: relative; display: grid; place-items: center; aspect-ratio: 1 / .8; background: var(--screen); border: 2px solid var(--line); overflow: hidden; }
.icon .ico::after, .art::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 1px, rgba(20, 16, 47, .16) 1.6px) 0 0 / 3px 3px; }
.icon svg { inline-size: 3.8rem; block-size: 3.8rem; image-rendering: pixelated; shape-rendering: crispEdges; }
.icon .nm { font: 700 .85rem var(--disp); letter-spacing: .1em; text-transform: uppercase; }
.icon .ds { font: .82rem/1.3 var(--mono); color: var(--muted); }
.home-foot { font: .78rem var(--mono); color: var(--muted); text-align: center; letter-spacing: .06em; }

/* ---------- page frame ---------- */
.win {
  position: absolute; z-index: 2; inset-block: .75rem; inset-inline: max(.75rem, calc((100% - 76rem) / 2));
  display: flex; flex-direction: column; min-height: 0; background: var(--panel); box-shadow: var(--bd), 8px 8px 0 0 var(--shade);
}
.win[hidden] { display: none; }
.pbar { flex: none; display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; background: var(--panel2); border-block-end: 2px solid var(--line); }
.pi { display: grid; place-items: center; flex: none; inline-size: 2.1rem; block-size: 2.1rem; background: var(--screen); border: 2px solid var(--line); }
.pi svg { inline-size: 1.2rem; block-size: 1.2rem; image-rendering: pixelated; }
.ttl { font: 700 .85rem var(--disp); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addr { flex: 1; min-width: 0; padding: .5rem .7rem; background: var(--bg2); border: 2px solid var(--line); font: .8rem/1 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb, .tbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 2.5rem; min-width: 2.5rem; padding: 0 .75rem; margin: 2px; flex: none;
  font: 700 .68rem/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; cursor: pointer;
  color: var(--ink); background: var(--panel); box-shadow: var(--bd), 3px 3px 0 0 var(--shade); transition: transform .06s steps(2), box-shadow .06s steps(2);
}
.tb:hover, .tbtn:hover { background: var(--lav); color: var(--on-led); }
.tb:active, .tbtn:active { transform: translate(3px, 3px); box-shadow: var(--bd); }
.tb svg, .tbtn svg { inline-size: 1rem; block-size: 1rem; fill: currentColor; }
.win-body { flex: 1; min-height: 0; overflow: auto; position: relative; background: var(--panel); scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--a1) var(--bg2); }
.win-body::-webkit-scrollbar { width: 12px; height: 12px; }
.win-body::-webkit-scrollbar-track { background: var(--bg2); }
.win-body::-webkit-scrollbar-thumb { background: var(--a1); border: 2px solid var(--bg2); }
.win-body.flush { overflow: hidden; display: flex; flex-direction: column; }
.win-body.flush > .zen { flex: 1; min-height: 0; }
.stat { flex: none; display: flex; justify-content: space-between; gap: 1rem; padding: .4rem .8rem; background: var(--panel2); border-block-start: 2px solid var(--line); font: .72rem/1.4 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.stat > span:first-child::before { content: ""; display: inline-block; inline-size: .5rem; block-size: .5rem; margin-inline-end: .5rem; background: var(--lime); box-shadow: 0 0 6px var(--lime); }
.win.busy iframe { pointer-events: none; }

/* ---------- page content ---------- */
.pg { padding: clamp(1rem, 3vw, 2rem); max-inline-size: 70rem; margin-inline: auto; }
.pg-head { position: relative; margin-block-end: 2rem; padding-block-end: 1.4rem; }
.pg-head::after { content: ""; position: absolute; inset: auto 0 0 0; height: 6px; background: radial-gradient(circle, var(--line) 1.2px, transparent 1.7px) 0 50% / 8px 6px repeat-x; }
.pg-head h1 { font-size: clamp(2rem, 1.2rem + 4.5vw, 4rem); margin-block: .7rem .6rem; }
.pg-head p { max-inline-size: 42rem; color: var(--muted); }
.label { display: inline-block; padding: .35rem .6rem; background: var(--ink); color: var(--panel); font: 700 .62rem/1 var(--disp); letter-spacing: .14em; text-transform: uppercase; }
.back { display: inline-flex; align-items: center; min-height: 2.25rem; font: 700 .68rem var(--disp); letter-spacing: .1em; text-transform: uppercase; color: var(--link); }
.meta { font: .8rem/1.4 var(--mono); color: var(--muted); letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { display: inline-block; padding: .15rem .5rem; border: 2px solid var(--line); background: var(--panel2); color: var(--ink); font: .78rem var(--mono); }
.status { display: inline-block; padding: .4rem .55rem; border: 2px solid var(--line); background: var(--pink); color: var(--on-led); font: 700 .6rem/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; }
.status[data-s="In Progress"]::before { content: ""; display: inline-block; inline-size: .45rem; block-size: .45rem; margin-inline-end: .45rem; background: var(--on-led); animation: blink 1.2s steps(2) infinite; }
.status[data-s="Concept"] { background: var(--lav); }
.status[data-s="Prototype"] { background: var(--cyan); }
.status[data-s="Completed"] { background: var(--lime); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 2.75rem; padding: .55rem 1.1rem; margin: 2px; text-decoration: none; cursor: pointer;
  font: 700 .72rem/1.2 var(--disp); letter-spacing: .1em; text-transform: uppercase;
  background: var(--a1); color: var(--on-a1); box-shadow: var(--bd), 4px 4px 0 0 var(--shade); transition: transform .06s steps(2), box-shadow .06s steps(2);
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: var(--bd), 6px 6px 0 0 var(--a2); }
.btn:active { transform: translate(4px, 4px); box-shadow: var(--bd); }
.btn.alt { background: var(--panel); color: var(--ink); }
.btn-row, .bar { display: flex; flex-wrap: wrap; gap: .9rem; }
.bar { margin-block-start: 1.5rem; }
.more { font: 700 .72rem var(--disp); letter-spacing: .08em; text-transform: uppercase; }
.sub { font: 700 .72rem var(--disp); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-block: 0 1rem; }
.sub::before { content: ""; display: inline-block; inline-size: .55em; block-size: .55em; margin-inline-end: .6em; background: var(--a2); }
.pg > .sub, .stuff-sec > .sub { font-size: 1.05rem; color: var(--ink); margin-block: 2rem 1rem; max-inline-size: none; }
.empty { padding: 2.5rem 1rem; border: 2px dashed var(--line); text-align: center; color: var(--muted); }
.empty b { color: var(--ink); }
.cols { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
.art { display: block; position: relative; overflow: hidden; background: var(--screen); }
.art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art svg { width: 100%; height: 100%; }

/* inputs and filters */
.bar-f { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-block-end: 1.1rem; }
.bar-f input[type="search"], .finder input, .finder select {
  font: 1rem var(--ui); min-height: 2.75rem; padding: .45rem .7rem; width: 100%; border-radius: 0;
  background: var(--bg2); color: var(--ink); border: 2px solid var(--line);
}
.bar-f input[type="search"] { flex: 1 1 12rem; width: auto; }
.bar-f input:focus-visible, .finder input:focus-visible, .finder select:focus-visible { outline-offset: 1px; background: var(--panel); }
.finder { display: grid; gap: .9rem; grid-template-columns: 1fr; margin-block-end: 2rem; }
@media (min-width: 40rem) { .finder { grid-template-columns: 2fr 1fr 1fr; } }
.finder label { display: grid; gap: .35rem; font: 700 .62rem var(--disp); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-block-end: 1.1rem; }
.pills button { min-height: 2.5rem; padding: .35rem .85rem; margin: 2px; font: .82rem var(--mono); color: var(--ink); background: var(--panel); box-shadow: var(--bd); }
.pills button:hover { background: var(--panel2); }
.pills button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

/* blog */
.post { display: grid; min-width: 0; background: var(--panel); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; box-shadow: var(--bd), 5px 5px 0 0 var(--shade); transition: transform .08s steps(2), box-shadow .08s steps(2); }
a.post:hover, a.card:hover, a.pick:hover, a.visit:hover, .tile:hover { transform: translate(-2px, -2px); box-shadow: var(--bd), 8px 8px 0 0 var(--a2); }
a.post:active, a.card:active, .tile:active { transform: translate(3px, 3px); box-shadow: var(--bd); }
.post .art { aspect-ratio: 16 / 7; border-block-end: 2px solid var(--line); }
.post-body { min-width: 0; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
.post h3, .card h3, .pick h2, .cred h3, .toolc h3 { font: 700 1.35rem/1.15 var(--ui); }
.post p, .card p, .pick p { color: var(--muted); }
.article-head h1 { font: 700 clamp(1.7rem, 1.2rem + 3vw, 3rem)/1.1 var(--disp); text-transform: uppercase; letter-spacing: .02em; margin-block: .7rem; overflow-wrap: anywhere; }
.pn { display: grid; gap: 1.25rem; margin-block-start: 3rem; }
@media (min-width: 40rem) { .pn { grid-template-columns: 1fr 1fr; } .pn a:last-child { text-align: end; } }
.pn a { display: block; padding: .85rem 1rem; background: var(--panel); color: var(--ink); text-decoration: none; box-shadow: var(--bd), 4px 4px 0 0 var(--shade); }
.pn a:hover { background: var(--panel2); }
.pn .label { display: block; margin-block-end: .5rem; padding: 0; background: none; color: var(--muted); }
.cover { aspect-ratio: 16 / 8; margin-block: 1rem 1.5rem; }
.cover.art, .shots .art { border: 2px solid var(--line); }

/* markdown */
.md { font-size: 1.1rem; line-height: 1.75; max-inline-size: 44rem; overflow-wrap: anywhere; }
.md > * + * { margin-block-start: 1.1em; }
.md > .md-h { margin-block-start: 1.9em; }
.md > .md-h:first-child { margin-block-start: 0; }
.md-h { font-family: var(--ui); font-weight: 700; line-height: 1.2; color: var(--ink); }
h1.md-h { font: 700 2.1rem/1.15 var(--disp); text-transform: uppercase; } h2.md-h { font-size: 1.75rem; } h3.md-h { font-size: 1.4rem; }
h4.md-h { font-size: 1.15rem; } h5.md-h, h6.md-h { font: 700 .8rem var(--disp); text-transform: uppercase; letter-spacing: .1em; }
.md h2::before { content: ""; display: inline-block; inline-size: .45em; block-size: .45em; margin-inline-end: .45em; background: var(--a2); box-shadow: .18em .18em 0 var(--shade); vertical-align: .1em; }
.md :is(ul, ol) { padding-inline-start: 1.5em; }
.md ul { list-style: square; } .md ol { list-style: decimal; }
.md li + li { margin-block-start: .3em; }
.md li::marker { color: var(--a2); }
.md-tasks { list-style: none !important; padding-inline-start: .2em !important; }
.md-task { display: flex; gap: .6em; align-items: baseline; }
.md blockquote { padding: .4em 1em; border-inline-start: 6px solid var(--a2); background: var(--panel2); color: var(--ink); }
.md hr { border: 0; block-size: 6px; background: radial-gradient(circle, var(--line) 1.2px, transparent 1.7px) 0 50% / 8px 6px repeat-x; }
.md code { font: .9em var(--mono); background: var(--panel2); border: 1px solid var(--edge); padding: .05em .35em; }
.md pre.md-code { overflow-x: auto; padding: 1rem; background: var(--code-bg); color: var(--code-fg); line-height: 1.5; max-inline-size: 100%; border: 2px solid var(--line); }
.md pre.md-code code { background: none; border: 0; padding: 0; font-size: .9rem; color: inherit; }
.md img { max-inline-size: 100%; height: auto; border: 2px solid var(--line); }
.md mark { background: var(--amber); color: var(--on-led); padding: 0 .15em; }
.md a { font-weight: 600; }
.t-sm { font-size: .85em; } .t-lg { font-size: 1.25em; } .t-xl { font-size: 1.6em; line-height: 1.3; }
.t-secondary { color: var(--muted); } .t-accent { color: var(--a1); } .t-blue { color: var(--link); } .t-pink { color: var(--a2); }
.md-tablewrap { overflow-x: auto; }
.md-table { border-collapse: collapse; min-inline-size: 60%; font-size: .98rem; }
.md-table :is(th, td) { border: 2px solid var(--line); padding: .4rem .7rem; text-align: start; overflow-wrap: normal; }
.md-table th { background: var(--ink); color: var(--panel); font: 700 .72rem var(--disp); letter-spacing: .08em; text-transform: uppercase; }
.md-fig { text-align: center; }
.md-fig img { margin-inline: auto; }
.md-fig figcaption { font: .8rem/1.5 var(--mono); color: var(--muted); margin-block-start: .5rem; }
.md-fig.md-left { float: left; max-inline-size: 50%; margin: .3em 1.2em .6em 0; }
.md-fig.md-right { float: right; max-inline-size: 50%; margin: .3em 0 .6em 1.2em; }
.md::after { content: ""; display: table; clear: both; }
.md-center { text-align: center; } .md-right { text-align: end; } .md-left { text-align: start; }
.md-big { font-size: 1.5em; line-height: 1.4; } .md-small { font-size: .85em; color: var(--muted); }
.md-center .md-h, .md-right .md-h { text-align: inherit; }
.md-box { --c: var(--a3); padding: .85rem 1rem; border: 2px solid var(--line); border-inline-start: 8px solid var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
.md-box-t { display: inline-block; margin-block-end: .5rem; padding: .25rem .5rem; background: var(--c); color: var(--on-led); font: 700 .6rem/1.2 var(--disp); letter-spacing: .12em; text-transform: uppercase; }
.md-box > * + * { margin-block-start: .6em; }
.md-tip { --c: var(--lime); } .md-important { --c: var(--lav); } .md-warning { --c: var(--amber); } .md-caution { --c: var(--pink); } .md-note { --c: var(--cyan); }
@media (max-width: 40rem) { .md-fig.md-left, .md-fig.md-right { float: none; max-inline-size: 100%; margin: 0; } }

/* gallery + lightbox */
.tiles { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 11rem), 1fr)); }
.tile { display: block; width: 100%; text-align: start; padding: .4rem; background: var(--panel); color: var(--ink); box-shadow: var(--bd), 4px 4px 0 0 var(--shade); transition: transform .08s steps(2), box-shadow .08s steps(2); }
.tile img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--screen); }
.tile span { display: block; padding: .4rem .2rem .1rem; font: .8rem/1.35 var(--mono); overflow-wrap: anywhere; }
dialog.lb {
  border: 0; padding: .5rem; margin: auto; inline-size: min(70rem, calc(100vw - 1.5rem)); block-size: min(46rem, calc(100dvh - 1.5rem));
  max-width: 100vw; max-height: 100dvh; overflow: hidden; background: var(--panel); color: var(--ink); box-shadow: var(--bd), 8px 8px 0 0 var(--shade);
}
dialog.lb::backdrop { background: radial-gradient(circle, rgba(0, 0, 0, .55) 1px, transparent 1.6px) 0 0 / 4px 4px, rgba(7, 5, 26, .72); }
.lb-in { height: 100%; display: flex; flex-direction: column; }
.tbar { display: flex; align-items: center; gap: .6rem; padding: 0 0 .5rem; }
.tbar .ttl { flex: 1; }
.lb-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); border: 2px solid var(--line); }
.lb-stage { position: relative; min-height: 0; overflow: hidden; background: #07051a; }
.lb-stage img { position: absolute; inset: .5rem; width: calc(100% - 1rem); height: calc(100% - 1rem); object-fit: contain; }
.lb-info { overflow: auto; padding: 1rem 1.2rem; background: var(--panel); border-inline-start: 2px solid var(--line); }
.lb-info h2 { font: 700 1.5rem/1.15 var(--ui); margin-block-end: .4rem; }
.lb-info .md { font-size: 1rem; margin-block-start: 1rem; }
.lb-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .6rem 0 .2rem; }
.lb-foot .meta { flex: 1; text-align: center; }
@media (max-width: 47.99rem) { .lb-grid { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); } .lb-info { border-inline-start: 0; border-block-start: 2px solid var(--line); } dialog.lb { inline-size: 100vw; block-size: 100dvh; } }

/* about */
.about { display: flow-root; }
.about > img { display: block; inline-size: min(14rem, 60%); max-inline-size: 100%; height: auto; aspect-ratio: 1; object-fit: cover; margin: 0 auto 1.5rem; border: 2px solid var(--line); box-shadow: 6px 6px 0 0 var(--shade); }
.about .md { max-inline-size: none; }
@media (min-width: 48rem) { .about.has-photo > img { float: left; inline-size: 14rem; margin: .25rem 1.5rem 1rem 0; } }

/* projects */
.prose { font-size: 1.1rem; line-height: 1.75; max-inline-size: 44rem; }
.prose > * + * { margin-block-start: 1.1em; }
.prose h2 { font: 700 1.6rem var(--ui); margin-block-start: 1.8em; }
.prose ul { list-style: square; padding-inline-start: 1.4em; }
.prose li + li { margin-block-start: .3em; }
.prose blockquote { border-inline-start: 6px solid var(--a2); padding: .3em 1em; background: var(--panel2); }
.shots { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
.story { display: grid; gap: 1.5rem; align-items: center; }
.story + .story { margin-block-start: clamp(2.5rem, 6vw, 4.5rem); }
.story .art { aspect-ratio: 16 / 10; border: 2px solid var(--line); box-shadow: 6px 6px 0 0 var(--shade); }
.story h2, .story h3 { font: 700 clamp(1.6rem, 1.2rem + 1.5vw, 2.4rem)/1.1 var(--ui); margin-block: .7rem; }
.story p { color: var(--muted); }
@media (min-width: 52rem) { .story { grid-template-columns: 1.1fr .9fr; gap: 3rem; } .story:nth-child(even) .art { order: 2; } }
a.plain { text-decoration: none; color: inherit; }
a.plain:hover h2, a.plain:hover h3 { text-decoration: underline; text-decoration-color: var(--a2); text-decoration-thickness: 3px; }
.visit { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-block-start: 2.5rem; padding: 1rem; background: var(--panel); color: var(--ink); box-shadow: var(--bd), 5px 5px 0 0 var(--shade); }
.visit > img, .visit > svg { inline-size: 3rem; block-size: 3rem; flex: none; image-rendering: pixelated; }
.visit p { flex: 1 1 14rem; margin: 0; }

/* cards, picks, tags */
.card { display: grid; height: 100%; background: var(--panel); color: var(--ink); text-decoration: none; box-shadow: var(--bd), 5px 5px 0 0 var(--shade); transition: transform .08s steps(2), box-shadow .08s steps(2); }
.card .art { aspect-ratio: 16 / 10; border-block-end: 2px solid var(--line); }
.card-body { padding: 1rem 1rem 1.25rem; display: flex; flex-direction: column; gap: .5rem; }
.picks { display: grid; gap: 1.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); }
.pick { position: relative; display: block; background: var(--panel); color: var(--ink); text-decoration: none; box-shadow: var(--bd), 6px 6px 0 0 var(--shade); transition: transform .08s steps(2), box-shadow .08s steps(2); }
.pick .art { aspect-ratio: 16 / 9; border-block-end: 2px solid var(--line); }
.pick-body { padding: 1rem 1rem 1.25rem; display: flex; flex-direction: column; gap: .5rem; }
.pick.soon .art { filter: grayscale(.85) brightness(.85); }
.tag { display: inline-block; align-self: start; padding: .4rem .5rem; border: 2px solid var(--line); background: var(--lime); color: var(--on-led); font: 700 .58rem/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; }
.tag.soon { background: var(--pink); } .tag.warn { background: var(--amber); } .tag.dim { background: transparent; color: var(--muted); }
.gtags { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.facts { display: grid; gap: .9rem 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); margin-block: 1.5rem; }
.facts dt { font: 700 .6rem var(--disp); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.facts dd { margin: 0; }
.note { border-inline-start: 6px solid var(--a2); padding: .8rem 1rem; background: var(--panel2); color: var(--ink); max-inline-size: 46rem; }

/* game player */
.stage { position: relative; background: #000; border: 2px solid var(--line); box-shadow: 8px 8px 0 0 var(--shade); aspect-ratio: var(--ar, 4 / 3); max-block-size: 80dvh; margin-inline: auto; inline-size: min(100%, calc(80dvh * var(--arn, 1.3333))); }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
.stage:fullscreen { inline-size: 100%; max-block-size: none; aspect-ratio: auto; border: 0; box-shadow: none; }
.stage:-webkit-full-screen { inline-size: 100%; max-block-size: none; aspect-ratio: auto; border: 0; box-shadow: none; }
.stage > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.stage-ui { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: .75rem; text-align: center; padding: 1rem; color: #fff; }
.stage-ui .btn { font-size: .85rem; padding: 1rem 1.6rem; }
.stage-ui p { max-inline-size: 28rem; background: rgba(7, 5, 26, .9); padding: .5rem .75rem; border: 2px solid var(--line); }
.rotate { display: none; }
@media (orientation: portrait) and (max-width: 40rem) { .rotate.on { display: block; } }
.spin { inline-size: 2rem; block-size: 2rem; background: var(--a1); animation: spin .9s steps(4) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* credits */
.fav { inline-size: 1em; block-size: 1em; margin-inline-end: .3em; vertical-align: -.14em; display: inline-block; }
.stuff-sec + .stuff-sec { margin-block-start: 3.5rem; }
.stuff-sec > p { max-inline-size: 44rem; margin-block-end: 1.25rem; }
.cred { display: grid; gap: 1rem; padding: 1.25rem; background: var(--panel); color: var(--ink); box-shadow: var(--bd), 5px 5px 0 0 var(--shade); min-width: 0; }
.cred h3 { margin: 0; }
.cred p { color: var(--muted); margin: 0; }
.cred .who { display: flex; align-items: center; gap: 1rem; }
.cred .who img { inline-size: 4.5rem; block-size: 4.5rem; flex: none; border: 2px solid var(--line); background: #fff; object-fit: cover; }
.code { font: .85rem var(--mono); color: var(--link); overflow-wrap: anywhere; }
.cred-list { display: grid; gap: 1.5rem; }
@media (min-width: 52rem) { .cred-list.two { grid-template-columns: 1fr 1fr; } }
.plat { display: inline-flex; align-items: center; gap: .5rem; min-block-size: 44px; padding: .4rem .8rem; border: 2px solid var(--line); color: var(--ink); text-decoration: none; font: .82rem var(--mono); }
.plat:hover { background: var(--lav); color: var(--on-led); }
.plat img { inline-size: 1.5rem; block-size: 1.5rem; }

/* tools */
.tool-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); }
a.toolc { display: grid; gap: .5rem; align-content: start; padding: 1rem; color: var(--ink); text-decoration: none; min-width: 0; height: auto; }
.toolc p { margin: 0; color: var(--muted); font-size: .98rem; }
.tag-t { justify-self: start; padding: .3rem .5rem; background: var(--ink); color: var(--panel); font: 700 .6rem/1.1 var(--disp); letter-spacing: .08em; text-transform: uppercase; }
.tool-switch { display: flex; flex-wrap: wrap; gap: .45rem; margin-block-end: 1.25rem; }
.tool-switch .chip { text-decoration: none; color: var(--ink); }
.tool-switch .chip:hover { background: var(--lav); color: var(--on-led); }
.tool-switch .chip[aria-current="page"] { background: var(--ink); color: var(--panel); }
.tool-frame { margin: 0; display: grid; gap: .6rem; }
.tool-frame iframe { display: block; inline-size: 100%; border: 2px solid var(--line); background: #fff; box-shadow: 6px 6px 0 0 var(--shade); }
.tool-frame figcaption { font: .78rem/1.5 var(--mono); color: var(--muted); }

/* "what's new": a little LED display */
.glass-stage { margin-block: 0 2rem; }
.glass { position: relative; display: grid; gap: .9rem; padding: 1.1rem 1.3rem 1.25rem; background: #07051a; color: #e9e6ff; box-shadow: var(--bd), 6px 6px 0 0 var(--shade); }
.glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 1px, rgba(7, 5, 26, .3) 1.6px) 0 0 / 3px 3px; }
.glass-head { display: flex; align-items: center; gap: .65rem; }
.glass h2 { margin: 0; font: 700 .7rem/1 var(--disp); letter-spacing: .16em; text-transform: uppercase; color: #7ff0ff; }
.bulb { display: grid; place-items: center; inline-size: 2rem; block-size: 2rem; color: #ffe08a; border: 2px solid #8a82ff; }
.bulb svg { inline-size: 1.1rem; block-size: 1.1rem; }
.upd { display: grid; gap: .4rem; justify-items: start; }
.upd + .upd { padding-block-start: .9rem; border-block-start: 2px dotted #4a45a2; }
.upd time { padding: .15rem .55rem; border: 2px solid #8a82ff; font: .74rem/1.2 var(--mono); color: #cfc9ff; }
.upd h3 { margin: 0; font: 700 1.15rem var(--ui); color: #fff; }
.glass .md, .glass .meta { color: #e9e6ff; font-size: 1rem; line-height: 1.6; }
.glass .md > :first-child { margin-block-start: 0; }
.glass a { color: #7ff0ff; }
.glass .md :is(h1, h2, h3) { color: #fff; font-size: 1.05rem; }
.glass .md code { background: rgba(255, 255, 255, .12); color: #fff; border-color: #4a45a2; }

/* ---------- zen corner (immersive: scene area stays dark in both themes) ---------- */
.zen-stage { position: relative; block-size: 100%; min-block-size: 0; overflow: hidden; background: #07051a center / cover no-repeat; }
.zen-scene { position: absolute; inset: 0 0 var(--bar, 0px) 0; inline-size: 100%; block-size: calc(100% - var(--bar, 0px)); object-fit: contain; image-rendering: pixelated; }
.zen-scene[hidden], .zen-msg[hidden] { display: none; }
.zen-msg { position: absolute; inset-inline: 1rem; inset-block-start: 50%; transform: translateY(-50%); margin-inline: auto; max-inline-size: 26rem; text-align: center; padding: 1rem; background: rgba(7, 5, 26, .92); color: #e9e6ff; border: 2px dashed #7ff0ff; }
.zen-top { position: absolute; inset-block-start: .75rem; inset-inline-start: .75rem; display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: .4rem .75rem; background: rgba(7, 5, 26, .88); border: 2px solid #8a82ff; max-inline-size: calc(100% - 6rem); color: #e9e6ff; }
.zen-top .label { background: none; padding: 0; color: #e9e6ff; }
.zen-top .back { color: #7ff0ff; }
.zen-bar { position: absolute; inset-inline: 0; inset-block-end: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; padding: .75rem; background: rgba(7, 5, 26, .92); border-block-start: 2px solid #8a82ff; color: #e9e6ff; }
.zen-scenes { display: flex; flex: 1 1 12rem; min-inline-size: 0; gap: .5rem; overflow-x: auto; scrollbar-width: thin; }
.zs { flex: none; padding: .5rem .8rem; min-block-size: 44px; border: 2px solid #8a82ff; color: #e9e6ff; background: transparent; white-space: nowrap; font: .82rem var(--mono); }
.zs:hover { border-color: #7ff0ff; }
.zs[aria-pressed="true"] { background: #7ff0ff; border-color: #7ff0ff; color: #07051a; }
.zen-master { display: flex; align-items: center; gap: .75rem; color: #e9e6ff; font: .82rem var(--mono); }
.zen-master label { display: flex; align-items: center; gap: .5rem; }
.zen-master input { inline-size: 8rem; accent-color: #7ff0ff; }

.zen-ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.zen-ui > * { pointer-events: auto; }
.zb { position: absolute; z-index: 5; display: grid; justify-items: center; gap: 4px; }
.zb[data-k="lofi"] { --c: var(--a1); --ci: var(--on-a1); }
.zb[data-k="asmr"] { --c: var(--cyan); --ci: var(--on-led); }
.zb[data-k="shelf"] { --c: var(--lime); --ci: var(--on-led); }
.zb-btn { position: relative; inline-size: 56px; block-size: 56px; margin: 2px; background: var(--c); color: var(--ci); display: grid; place-items: center; touch-action: none; cursor: grab; box-shadow: var(--bd), 4px 4px 0 0 #000; }
.zb-btn svg { inline-size: 26px; block-size: auto; fill: currentColor; shape-rendering: crispEdges; }
.zb-l { font: 700 .55rem/1 var(--disp); letter-spacing: .1em; color: #e9e6ff; background: rgba(7, 5, 26, .9); padding: .3rem .4rem; }
.zb.on .zb-btn::after { content: ""; position: absolute; inset-block-start: -5px; inset-inline-end: -5px; inline-size: 12px; block-size: 12px; background: var(--lime); border: 2px solid #07051a; }

.zwin { position: absolute; display: flex; flex-direction: column; inline-size: min(21rem, calc(100% - 1rem)); max-block-size: calc(100% - 1rem); background: var(--panel); color: var(--ink); box-shadow: var(--bd), 6px 6px 0 0 #000; margin: 2px; }
.zwin[hidden], .zb[hidden] { display: none; }
.zwin:focus { outline: none; }
.zw-head { display: flex; align-items: center; gap: .5rem; padding: .3rem .4rem .3rem .75rem; background: var(--a1); color: var(--on-a1); cursor: grab; touch-action: none; user-select: none; }
.zw-title { flex: 1; font: 700 .65rem/1.4 var(--disp); letter-spacing: .1em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zw-b { inline-size: 44px; block-size: 44px; border: 2px solid currentColor; font: 700 1rem var(--mono); color: inherit; }
.zw-b:hover { background: var(--on-a1); color: var(--a1); }
.zw-body { flex: 1; min-block-size: 0; overflow: auto; padding: 1rem; }
.zwin.min .zw-body { display: none; }
.za { display: grid; gap: .75rem; }
.za-top { display: flex; align-items: center; gap: .75rem; }
.za-art { flex: none; inline-size: 56px; block-size: 56px; overflow: hidden; border: 2px solid var(--line); background: var(--screen); }
.za-art img { inline-size: 100%; block-size: 100%; object-fit: cover; }
.za-top > div { display: grid; min-inline-size: 0; }
.za-title { line-height: 1.25; }
.za-row { display: flex; align-items: center; gap: .75rem; }
.za-times { display: flex; justify-content: space-between; }
.za-vol { flex: 1; display: flex; align-items: center; gap: .5rem; font: .8rem var(--mono); min-inline-size: 0; }
.za input[type="range"] { flex: 1; min-inline-size: 0; min-block-size: 44px; accent-color: var(--a2); }
.za-list { display: grid; gap: .5rem; max-block-size: 10rem; overflow-y: auto; margin: 0; padding-block-start: .75rem; border-block-start: 2px dotted var(--line); }
.za-item { inline-size: 100%; min-block-size: 44px; padding: .4rem .7rem; text-align: start; border: 2px solid var(--line); color: var(--ink); font: .85rem var(--mono); }
.za-item:hover { background: var(--panel2); }
.za-item[aria-current="true"] { background: var(--ink); color: var(--panel); }
.za-item[aria-current="true"]::before { content: "> "; color: var(--a2); }
.zbtn { min-block-size: 44px; padding: .4rem .9rem; border: 2px solid var(--line); color: var(--ink); background: var(--panel); font: 700 .68rem var(--disp); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.zbtn:hover { background: var(--lav); color: var(--on-led); }
.zbtn[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

function renderBlocks(lines, base = "", depth = 0) {
  if (depth > 8) return `<p>${esc(lines.join("\n"))}</p>`;
  let out = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    let m = line.match(RE.fence);
    if (m) {
      const f = m[1], lang = m[2], code = []; i++;
      while (i < lines.length && !(new RegExp(`^ {0,3}${f[0]}{${f.length},}\\s*$`).test(lines[i]))) code.push(lines[i++]);
      i++;
      out += `<pre class="md-code"${lang ? ` data-lang="${esc(lang)}"` : ""}><code>${esc(code.join("\n"))}</code></pre>`;
      continue;
    }
    if (RE.comment.test(line)) {
      while (i < lines.length && !/-->/.test(lines[i])) i++;
      i++; continue;
    }
    m = line.match(RE.box);
    if (m) {
      let d = 1, j = i + 1;
      for (; j < lines.length; j++) {
        if (RE.box.test(lines[j])) d++;
        else if (RE.boxEnd.test(lines[j]) && --d === 0) break;
      }
      const name = m[1].toLowerCase(), inner = renderBlocks(lines.slice(i + 1, j), base, depth + 1);
      out += MD_BOXES[name] ? `<aside class="md-box md-${name === "warn" ? "warning" : name}"><b class="md-box-t">${MD_BOXES[name]}</b>${inner}</aside>`
        : `<div class="md-${MD_ALIGN.has(name) ? name : "plain"}">${inner}</div>`;
      i = j + 1; continue;
    }
    m = line.match(RE.head);
    if (m) { out += `<h${m[1].length} class="md-h">${inline(m[2], base)}</h${m[1].length}>`; i++; continue; }
    if (RE.hr.test(line)) { out += "<hr>"; i++; continue; }
    if (RE.quote.test(line)) {
      const q = [];
      while (i < lines.length && RE.quote.test(lines[i])) q.push(lines[i++].replace(/^ {0,3}> ?/, ""));
      const co = q[0].match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*$/i);
      if (co) { const k = co[1].toLowerCase(); out += `<aside class="md-box md-${k}"><b class="md-box-t">${MD_BOXES[k]}</b>${renderBlocks(q.slice(1), base, depth + 1)}</aside>`; }
      else out += `<blockquote>${renderBlocks(q, base, depth + 1)}</blockquote>`;
      continue;
    }
    if (RE.item.test(line)) { const r = renderList(lines, i, base, depth); out += r.html; i = r.next; continue; }
    if (line.includes("|") && i + 1 < lines.length && lines[i + 1].includes("|") && RE.sep.test(lines[i + 1])) {
      const head = cells(line), al = cells(lines[i + 1]).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : /^:-/.test(c) ? "left" : "");
      const cell = (t, k, tag) => `<${tag}${al[k] ? ` style="text-align:${al[k]}"` : ""}>${inline(t, base)}</${tag}>`;
      let rows = ""; i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) { rows += `<tr>${head.map((_, k) => cell(cells(lines[i])[k] ?? "", k, "td")).join("")}</tr>`; i++; }
      out += `<div class="md-tablewrap"><table class="md-table"><thead><tr>${head.map((t, k) => cell(t, k, "th")).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim()) {
      const sm = para.length && lines[i].match(/^ {0,3}(=+|-+)[ \t]*$/);
      if (sm) { const lv = sm[1][0] === "=" ? 1 : 2; out += `<h${lv} class="md-h">${inline(para.join("\n"), base)}</h${lv}>`; para.length = 0; i++; break; }
      if (para.length && startsBlock(lines[i])) break;
      para.push(lines[i].replace(/\s+$/, "")); i++;
    }
    if (para.length) {
      const t = para.join("\n").trim();
      out += figure(t, base) || `<p>${inline(t, base)}</p>`;
    }
  }
  return out;
}

const md = (src, base = "") => renderBlocks(String(src).replace(/^﻿/, "").replace(/\r\n?/g, "\n").split("\n"), base);
const plain = s => String(s).replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/[`*_~=>#|]/g, "").replace(/\s+/g, " ").trim();


/* ---------- content (files in /content/) ---------- */
const CONFIG = { repo: "" };
const CONTENT = "content", BLOG = "content/blog/", STUFF = "content/stuff/", GAL = "content/gallery/", MEDIA = /\.(png|jpe?g|gif|webp|avif)$/i;
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const isDraft = p => p.split("/").some(s => s.startsWith("_"));
const lsGet = k => { try { return JSON.parse(localStorage.getItem("ser." + k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem("ser." + k, JSON.stringify(v)); } catch {} };

function repoInfo() {
  if (CONFIG.repo.includes("/")) { const [owner, repo] = CONFIG.repo.split("/"); return { owner, repo }; }
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return null;
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return { owner: m[1], repo: seg && !/\.html?$/i.test(seg) ? seg : location.hostname };
}

async function fromGithub() {
  const info = repoInfo();
  if (!info) throw new Error("not on GitHub Pages");
  const key = `tree.${info.owner}/${info.repo}`, hit = lsGet(key);
  if (hit && Date.now() - hit.t < 30e3) return hit.paths;
  let j;
  try {
    const r = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/HEAD?recursive=1`, { headers: { Accept: "application/vnd.github+json" }, signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error(r.status === 403 || r.status === 429 ? "GitHub says I've asked too many times (HTTP " + r.status + ")" : "GitHub answered HTTP " + r.status);
    j = await r.json();
  } catch (e) {
    if (hit) return hit.paths;
    throw e;
  }
  if (j.truncated) console.warn("[ser] GitHub cut the file list short; use content/index.json");
  const paths = j.tree.filter(x => x.type === "blob" && x.path.startsWith(CONTENT + "/")).map(x => x.path);
  lsSet(key, { t: Date.now(), paths });
  return paths;
}

async function fromManifest() {
  const r = await fetch(`${CONTENT}/index.json`, { signal: AbortSignal.timeout(6000) });
  if (!r.ok) throw new Error("no manifest");
  const j = await r.json(), list = Array.isArray(j) ? j : j.files;
  if (!Array.isArray(list)) throw new Error("bad manifest");
  return list.filter(x => typeof x === "string").map(x => x.replace(/^\.?\//, "")).map(x => x.startsWith(CONTENT + "/") ? x : CONTENT + "/" + x);
}

async function fromListing() {
  const out = [], queue = [CONTENT + "/"];
  for (let n = 0; queue.length && n < 400; n++) {
    const dir = queue.shift(), r = await fetch(encPath(dir.slice(0, -1)) + "/", { signal: AbortSignal.timeout(6000) });
    if (!r.ok) { if (n === 0) throw new Error("no folder listing"); continue; }
    const html = await r.text();
    if (n === 0 && !/<title>\s*Directory listing/i.test(html)) throw new Error("not a folder listing");
    for (const m of html.matchAll(/<a\s[^>]*href=["']([^"'?#]+)["']/gi)) {
      const h = m[1];
      if (h.startsWith("/") || h.startsWith("..") || /^[a-z][a-z0-9+.-]*:/i.test(h)) continue;
      const name = decodeURIComponent(h);
      (name.endsWith("/") ? queue : out).push(dir + name);
    }
  }
  return out;
}

let filesP = null;
const contentFiles = () => filesP ??= (async () => {
  const order = repoInfo() ? [fromGithub, fromManifest, fromListing] : [fromManifest, fromListing], why = [];
  for (const src of order) {
    try { const paths = await src(); console.info(`[ser] ${paths.length} content files via ${src.name}`); return { paths, ok: true, via: src.name, why }; }
    catch (e) { why.push(`${src.name.replace("from", "").toLowerCase()}: ${e.message}`); console.info(`[ser] ${src.name} skipped: ${e.message}`); }
  }
  return { paths: [], ok: false, via: "", why };
})();

const textCache = new Map();
function getText(path) {
  if (!textCache.has(path)) textCache.set(path, fetch(encPath(path), { signal: AbortSignal.timeout(10000) }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).catch(e => { textCache.delete(path); throw e; }));
  return textCache.get(path);
}

async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; try { out[k] = await fn(items[k]); } catch { out[k] = null; } }
  }));
  return out;
}

const pretty = s => s.replace(/[-_]+/g, " ").trim().replace(/^\w/, c => c.toUpperCase());
function nameInfo(slug) {
  const file = slug.split("/").pop(), m = file.match(/^(\d{4}-\d{2}-\d{2})[-_ ]*(.*)$/);
  return { date: m ? m[1] : "", title: pretty((m && m[2]) || file) };
}
const goodDate = d => /^\d{4}-\d{2}-\d{2}/.test(String(d ?? "")) && !isNaN(Date.parse(String(d).slice(0, 10))) ? String(d).slice(0, 10) : "";

function summaryOf(body) {
  for (const block of body.split(/\n\s*\n/)) {
    const lines = block.trim().split("\n");
    if (/^\s*(>|```|~~~|:::|\||-{3,}|!\[|<!--|[-*+] |\d+[.)] )/.test(lines[0])) continue;
    const t = lines.filter(l => !/^\s*#/.test(l)).join("\n").trim();
    if (!t) continue;
    const s = plain(t);
    if (s.length > 2) return s.length > 170 ? s.slice(0, 167).replace(/\s+\S*$/, "") + "…" : s;
  }
  return "";
}

const blogPaths = paths => paths.filter(p => p.startsWith(BLOG) && /\.md$/i.test(p) && !isDraft(p) && !/\/readme\.md$/i.test(p)).sort();
async function loadPost(slug) {
  const path = BLOG + slug + ".md", ni = nameInfo(slug), { meta, body: raw } = parseFront(await getText(path));
  let body = raw, h1 = null;
  const m = raw.match(/^\s*#[ \t]+(.+?)[ \t]*#*[ \t]*(?:\n|$)/);
  if (m && !meta.title) { h1 = plain(m[1]); body = raw.slice(m[0].length); }
  const base = path.slice(0, path.lastIndexOf("/") + 1);
  return {
    slug, path, base, body, folder: slug.includes("/") ? slug.slice(0, slug.lastIndexOf("/")) : "",
    title: meta.title || h1 || ni.title, date: goodDate(meta.date) || ni.date, tags: toList(meta.tags),
    cover: meta.cover ? safeUrl(meta.cover, base) : "", summary: meta.summary || meta.description || summaryOf(body),
    draft: /^(true|yes|1)$/i.test(String(meta.draft ?? "")), words: (body.match(/\S+/g) || []).length
  };
}
const byNewest = (a, b) => (b.date || "").localeCompare(a.date || "") || a.title.localeCompare(b.title, undefined, { numeric: true });

let postsP = null;
const loadPosts = () => postsP ??= (async () => {
  const { paths, ok, via, why } = await contentFiles();
  const slugs = blogPaths(paths).map(p => p.slice(BLOG.length).replace(/\.md$/i, ""));
  const list = await pool(slugs, 8, loadPost);
  return { posts: list.filter(p => p && !p.draft).sort(byNewest), ok, found: slugs.length, seen: paths.length, via, why };
})();

const galleryItems = paths => {
  const set = new Set(paths);
  return paths.filter(p => p.startsWith(GAL) && MEDIA.test(p) && !isDraft(p)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(p => {
    const rel = p.slice(GAL.length), parts = rel.split("/"), side = p.replace(/\.[^./]+$/, ".md");
    return { path: p, album: parts.length > 1 ? parts.slice(0, -1).join("/") : "", title: pretty(parts.pop().replace(/\.[^.]+$/, "")), md: set.has(side) ? side : "" };
  });
};

let stuffP = null;
const stuffPaths = paths => paths.filter(p => p.startsWith(STUFF) && /\.md$/i.test(p) && !isDraft(p) && !/\/readme\.md$/i.test(p));
const loadStuff = () => stuffP ??= (async () => {
  const { paths, ok } = await contentFiles(), list = stuffPaths(paths);
  const files = (await pool(list, 6, async p => {
    const { meta, body } = parseFront(await getText(p));
    return { path: p, base: p.slice(0, p.lastIndexOf("/") + 1), meta, body, order: parseFloat(meta.order) };
  })).filter(f => f && !/^(true|yes|1)$/i.test(String(f.meta.draft ?? "")));
  files.sort((a, b) => (isNaN(a.order) ? 1e9 : a.order) - (isNaN(b.order) ? 1e9 : b.order) || a.path.localeCompare(b.path, undefined, { numeric: true }));
  return { files, ok };
})();

const pix = (name, small) => {
  const rows = ICONSET[small ? "i16" : "i32"][name], n = rows.length, paths = {};
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length;) {
      const c = row[x]; let w = 1;
      while (row[x + w] === c) w++;
      if (c !== ".") (paths[c] ||= []).push(`M${x} ${y}h${w}v1h-${w}z`);
      x += w;
    }
  });
  const body = Object.entries(paths).map(([c, d]) => `<path fill="${ICONSET.pal[c]}" d="${d.join("")}"/>`).join("");

function creditHtml(block, base) {
  const f = {}, lines = block.split("\n"); let i = 0;
  for (; i < lines.length; i++) {
    const kv = lines[i].match(/^(title|name|by|url|link|image|license|code)\s*:\s*(.*)$/i);
    if (!kv) break;
    f[kv[1].toLowerCase()] = kv[2].trim();
  }
  const body = lines.slice(i).join("\n").trim(), url = f.url ? safeUrl(f.url, base) : "", title = f.title || f.name || hostOf(url) || "Untitled";
  const img = f.image ? safeUrl(f.image, base) : url ? fav(hostOf(url)) : "";
  const code = f.license || f.code, label = f.link || hostOf(url);
  return `<article class="cred">
    <div class="who">${img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ""}<div><h3>${esc(title)}</h3>${f.by ? `<span class="meta">${esc(f.by)}</span>` : ""}${url && !body ? plat(label, url) : ""}</div></div>
    ${body ? md(body, base) : ""}
    ${code ? `<p class="code">License code: ${esc(code)}</p>` : ""}
    ${url && body ? `<div>${plat(label, url)}</div>` : ""}
  </article>`;
}

function stuffSection(file) {
  const { meta, body } = file, out = [], cols = String(meta.columns || "");
  let prose = [], cards = [], cur = null;
  const flushProse = () => { const t = prose.join("\n").trim(); if (t) out.push(md(t, file.base)); prose = []; };
  const flushCards = () => {
    if (!cards.length) return;
    const two = cols === "2" || (cols !== "1" && !cards.some(c => c.length > 260));
    out.push(`<div class="cred-list${two ? " two" : ""}">${cards.map(c => creditHtml(c, file.base)).join("")}</div>`);
    cards = [];
  };
  for (const line of body.split("\n")) {
    if (cur === null && /^:::[ \t]*credit[ \t]*$/i.test(line)) { flushProse(); cur = []; }
    else if (cur !== null && /^:::[ \t]*$/.test(line)) { cards.push(cur.join("\n")); cur = null; }
    else if (cur !== null) cur.push(line);
    else { if (cards.length && line.trim()) flushCards(); if (!cards.length) prose.push(line); }
  }
  if (cur !== null) cards.push(cur.join("\n"));
  flushProse(); flushCards();
  return `<section class="stuff-sec">${meta.title ? `<p class="sub">${esc(meta.title)}</p>` : ""}${out.join("\n")}</section>`;
}

    root.classList.toggle("dark", dark); themeBtn.setAttribute("aria-pressed", dark);
  };
  const show = loc => {
    last = loc;
    prog.textContent = ready ? Math.round(book.locations.percentageFromCfi(loc.start.cfi) * 100) + "%" : "Section " + (loc.start.index + 1) + " of " + book.spine.length;
  };
  apply();
  rend.on("relocated", loc => { zs.set(key, loc.start.cfi); show(loc); });
  await rend.display(zs.get(key, null) || undefined);
  book.ready.then(() => book.locations.generate(1600)).then(() => { ready = true; if (last) show(last); }).catch(() => {});
  return {
    prev: () => rend.prev(), next: () => rend.next(),
    fup: () => { size = Math.min(200, size + 10); zs.set("zen.rfont", size); apply(); },
    fdn: () => { size = Math.max(70, size - 10); zs.set("zen.rfont", size); apply(); },
    theme: () => { dark = !dark; zs.set("zen.rdark", dark); apply(); },
    destroy: () => { try { rend.destroy(); book.destroy(); } catch {} }
  };
}

async function zPdf(b, view, root, prog) {
  await zLoadAll(ZLIB.pdf);
  const lib = window.pdfjsLib; if (!lib) throw new Error("lib");
  lib.GlobalWorkerOptions.workerSrc = ZLIB.pdfWorker;
  const pdf = await lib.getDocument({ url: b.src }).promise;
  view.textContent = "";
  const key = "zen.pos.book." + b.id, themeBtn = root.querySelector('[data-r="theme"]');
  let page = Math.min(pdf.numPages, Math.max(1, Number(zs.get(key, 1)) || 1)), zoom = zs.get("zen.rzoom", 1), dark = zs.get("zen.rdark", false), tok = 0, task = null, dead = false;
  root.classList.toggle("dark", dark); themeBtn.setAttribute("aria-pressed", dark);
  const render = async () => {
    const my = ++tok;
    if (task) { try { task.cancel(); } catch {} }
    const p = await pdf.getPage(page);
    if (dead || my !== tok) return;
    const fit = Math.max(120, view.clientWidth - 16) / p.getViewport({ scale: 1 }).width, vp = p.getViewport({ scale: fit * zoom });
    const dpr = Math.min(2, window.devicePixelRatio || 1), c = document.createElement("canvas");
    c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
    c.style.width = Math.floor(vp.width) + "px"; c.style.height = Math.floor(vp.height) + "px";
    c.setAttribute("role", "img"); c.setAttribute("aria-label", "Page " + page + " of " + pdf.numPages);
    task = p.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
    try { await task.promise; } catch { return; }
    if (dead || my !== tok) return;
    view.textContent = ""; view.appendChild(c); view.scrollTop = 0;
    prog.textContent = "Page " + page + " of " + pdf.numPages; zs.set(key, page);
  };
  await render();
  return {
    prev: () => { if (page > 1) { page--; render(); } },
    next: () => { if (page < pdf.numPages) { page++; render(); } },
    zup: () => { zoom = Math.min(3, +(zoom + .25).toFixed(2)); zs.set("zen.rzoom", zoom); render(); },
    zdn: () => { zoom = Math.max(.5, +(zoom - .25).toFixed(2)); zs.set("zen.rzoom", zoom); render(); },
    theme: () => { dark = !dark; zs.set("zen.rdark", dark); root.classList.toggle("dark", dark); themeBtn.setAttribute("aria-pressed", dark); },
    destroy: () => { dead = true; try { if (task) task.cancel(); pdf.destroy(); } catch {} }
  };
}

function zenSetup() {
  zenLeave();
  const ui = document.createElement("div");
  ui.className = "zen-ui"; $("#main").appendChild(ui); zen.ui = ui;
  const tok = zen.tok;
  zDiscover().then(found => { if (tok !== zen.tok || !zen.ui) return; zen.lists = found; zenBuild(); });
}

function zenBuild() {
  const ui = zen.ui;
  zAudioInit();

  const stage = $("#zstage"), img = $("#zscene"), msg = $("#zmsg"), nm = $("#zname"), row = $("#zscenes");
  const bar = stage.querySelector(".zen-bar"), fit = () => stage.style.setProperty("--bar", bar.offsetHeight + "px");
  fit(); new ResizeObserver(fit).observe(bar);
  const scenes = zen.lists.scenes;
  if (!scenes.length) { msg.textContent = "I haven't added a scene yet."; }
  else {
    row.innerHTML = scenes.map(x => `<button class="zs" data-id="${esc(x.id)}" aria-pressed="false">${esc(x.name)}</button>`).join("");
    const show = sc => {
      zs.set("zen.scene", sc.id); nm.textContent = sc.name;
      stage.style.backgroundImage = sc.poster ? `url("${sc.poster}")` : "";
      msg.textContent = "Loading the scene…"; msg.hidden = false; img.hidden = false;
      img.alt = sc.name + (sc.description ? ". " + sc.description : "") + " (animated scene)";
      img.src = sc.src;
      [...row.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.id === sc.id));
      const cur = [...row.children].find(b => b.dataset.id === sc.id);
      if (cur) row.scrollLeft += cur.getBoundingClientRect().left - row.getBoundingClientRect().left - 8;
    };
    img.onload = () => { msg.hidden = true; };
    img.onerror = () => { img.hidden = true; msg.textContent = "I can't load this scene right now. Try another one."; msg.hidden = false; };
    row.onclick = e => { const b = e.target.closest("[data-id]"); if (b) show(scenes.find(x => x.id === b.dataset.id)); };
    show(scenes.find(x => x.id === zs.get("zen.scene", "")) || scenes[0]);
  }

  zBuildAudio("lofi"); zBuildAudio("asmr"); zBuildShelf();
  const W = ui.clientWidth;
  zBubble("lofi", "Lo-fi player", "LO-FI", { x: 16, y: 130 });
  zBubble("asmr", "ASMR player", "ASMR", { x: 16, y: 214 });
  zBubble("shelf", "The Shelf", "SHELF", { x: W - 72, y: 84 });
  Object.values(zen.wins).forEach(w => { if (w._sync) w._sync(); });

  const m = zen.audio.master, mr = $("#zmaster"), mb = $("#zmute");
  const paintMaster = () => { mb.textContent = m.muted ? "Unmute" : "Mute"; mb.setAttribute("aria-pressed", m.muted); };
  const applyMaster = () => { zs.set("zen.master", m); Object.values(zen.audio.kinds).forEach(zApplyVol); paintMaster(); };
  mr.value = Math.round(m.vol * 100); paintMaster();
  mr.oninput = () => { m.vol = mr.value / 100; applyMaster(); };
  mb.onclick = () => { m.muted = !m.muted; applyMaster(); };

  zen.onresize = () => { [...ui.children].forEach(el => { if (!el.hidden) zMove(el, el.offsetLeft, el.offsetTop); }); };
  addEventListener("resize", zen.onresize);
}

function zenLeave() {
  zen.tok++;
  if (!zen.ui) return;
  removeEventListener("resize", zen.onresize);
  zCloseBook();
  if (zen.audio) Object.values(zen.audio.kinds).forEach(st => { st.a.pause(); st.a.removeAttribute("src"); st.a.load(); });
  zen.ui.remove();
  zen.ui = null; zen.lists = null; zen.audio = null; zen.wins = {}; zen.bub = {}; zen.reader = null; zen.repaintShelf = null;
}

/* ---------- site shell (header, home, page frame, theme) ---------- */
const desk = $("#desk"), home = $("#home"), win = $("#win"), main = $("#main"), icons = $("#icons"), nav = $("#nav");
const fitText = () => { document.documentElement.style.fontSize = screen.width < 700 && innerWidth >= 700 ? Math.round(Math.min(1.9, innerWidth / 640) * 100) + "%" : ""; };
fitText(); addEventListener("resize", fitText);
const appOf = key => APPS.find(a => a.id === key);

/* tiny pixel glyphs ('X' = lit pixel), drawn in currentColor */
const GLYPH = {
  logo: [".XXXXX.", "XXXXXXX", "XX.....", "XXXXXX.", ".XXXXXX", ".....XX", "XXXXXXX", ".XXXXX."],
  back: ["....X....", "...XX....", "..XXX....", ".XXXXXXXX", "XXXXXXXXX", ".XXXXXXXX", "..XXX....", "...XX....", "....X...."],
  close: ["XX.....XX", "XXX...XXX", ".XXX.XXX.", "..XXXXX..", "...XXX...", "..XXXXX..", ".XXX.XXX.", "XXX...XXX", "XX.....XX"],
  sun: ["....X....", ".X.....X.", "..XXXXX..", "..XXXXX..", "X.XXXXX.X", "..XXXXX..", "..XXXXX..", ".X.....X.", "....X...."],
  moon: ["...XXXX..", "..XXX....", ".XXX.....", ".XXX.....", ".XXX.....", ".XXXX....", "..XXXXXX.", "...XXXXX.", "........."]
};
const glyph = name => {
  const rows = GLYPH[name], d = [];
  rows.forEach((row, y) => { for (let x = 0; x < row.length;) { if (row[x] !== "X") { x++; continue; } let w = 1; while (row[x + w] === "X") w++; d.push(`M${x} ${y}h${w}v1h-${w}z`); x += w; } });
  return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d.join("")}"/></svg>`;
};
document.querySelectorAll("[data-g]").forEach(el => { el.classList.add("gl"); el.innerHTML = glyph(el.dataset.g); });
$("#lb-close").innerHTML = glyph("close");
$("#lb-prev").innerHTML = glyph("back");
$("#lb-next").innerHTML = `<span class="gl flip">${glyph("back")}</span>`;

/* light / dark: the first value is set in <head> before paint; this wires the switch */
const themeBtn = $("#theme"), metaTheme = document.querySelector('meta[name="theme-color"]');
const applyTheme = (t, save) => {
  document.documentElement.dataset.theme = t;
  themeBtn.setAttribute("aria-checked", String(t === "dark"));
  themeBtn.title = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
  if (metaTheme) metaTheme.content = t === "dark" ? "#090820" : "#ecebf6";
  if (save) lsSet("theme", t);
};
applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light", false);
themeBtn.onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => { if (lsGet("theme") === null) applyTheme(e.matches ? "dark" : "light", false); });

/* header nav, home hero and tiles */
const BLURB = { blog: "Things I write", gallery: "My artworks", about: "Who I am", projects: "Things I'm building", tools: "Small useful tools", "chill-zone": "Games and lo-fi", "stuff-in-here": "Credits and sources" };
nav.innerHTML = APPS.map(a => `<a href="${a.href}" data-app="${a.id}">${esc(a.name)}</a>`).join("");
icons.innerHTML = APPS.map((a, i) => `<a class="icon" href="${a.href}" data-app="${a.id}"><i class="n" aria-hidden="true">${pad(i + 1)}</i><span class="ico">${pix(a.icon)}</span><span class="nm">${esc(a.name)}</span><span class="ds">${esc(BLURB[a.id] || "")}</span></a>`).join("");
$("#hero-t").textContent = site.title;
$("#hero-d").textContent = site.desc;
const tickerMsg = ["MY LITTLE CORNER OF THE INTERNET", ...APPS.map(a => a.name.toUpperCase())].join("  ::  ") + "  ::  ";
$("#ticker").innerHTML = [0, 1].map(() => `<span>${esc(tickerMsg.repeat(2))}</span>`).join("");
const syncNav = key => nav.querySelectorAll("a").forEach(el => el.dataset.app === key ? el.setAttribute("aria-current", "page") : el.removeAttribute("aria-current"));

const clock = $("#clock");
const tickClock = () => { clock.textContent = new Date().toLocaleString("en-PH", { hour: "numeric", minute: "2-digit", month: "short", day: "numeric" }); };
tickClock(); setInterval(tickClock, 15000);

const setTitle = t => { $("#ttl").textContent = t; };
const setStatus = t => { $("#stat-l").textContent = t || ""; };
const setPath = p => { $("#addr").textContent = "ser://" + (p || ""); };

let RID = 0;
function route() {
  const parts = (location.hash.slice(1) || "/").split("/").filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch { return s; } });
  const [a, b, c] = parts, rest = parts.slice(1).join("/");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  zenLeave();
  const rid = ++RID, stale = () => rid !== RID;

  if (a === "journal") { location.replace("#/blog" + (rest ? "/" + slugHref(rest) : "")); return; }
  if (a === "videos") { location.replace("#/"); return; }

  let v = null;
  if (!a) v = null;
  else if (a === "blog") v = rest ? views.post(rest) : views.blog();
  else if (a === "gallery") v = views.gallery();
  else if (a === "about") v = views.about();
  else if (a === "projects") v = b ? views.project(b) : views.projects();
  else if (a === "stuff-in-here") v = views.stuff();
  else if (a === "tools") v = !b ? views.tools() : !c ? views.toolSet(b) : views.tool(b, c);
  else if (a === "chill-zone") v = !b ? views.chill() : b === "game-zone" ? (c ? views.game(c) : views.gameZone()) : b === "zen-corner" ? views.zen() : views.missing();
  else v = views.missing();

  const key = !a ? "home" : a === "chill-zone" ? (b === "game-zone" ? "game-zone" : b === "zen-corner" ? "zen-corner" : "chill-zone")
    : a === "projects" ? (b ? "projects/" + b : "projects") : ["blog", "gallery", "about", "stuff-in-here", "tools"].includes(a) ? a : "";
  setBackdrop(key);
  syncNav(a || "");

  const md_ = document.querySelector('meta[name="description"]');
  if (!v) {
    home.hidden = false; win.hidden = true; main.innerHTML = "";
    document.title = site.title;
    if (md_) md_.content = site.desc;
    desk.focus({ preventScroll: true });
    return;
  }

  home.hidden = true; win.hidden = false;
  const app = appOf(a);
  $("#ttl-i").innerHTML = pix(app ? app.icon : "about", true);
  setTitle(v.title); setStatus(v.status); setPath(v.path);
  $("#up").href = v.up || "#/";
  main.classList.toggle("flush", !!v.flush);
  main.innerHTML = v.html;
  document.title = v.title === site.title ? site.title : `${v.title} — ${site.title}`;
  if (md_ && v.desc) md_.content = v.desc;
  if (v.after) v.after(stale);
  hydrateProj();
  main.scrollTop = 0;
  main.focus({ preventScroll: true });
}
$("#skip").onclick = e => { e.preventDefault(); (win.hidden ? icons.querySelector(".icon") : main).focus(); };
addEventListener("hashchange", route);
route();

/* ---------- boot sequence ---------- */
(function boot() {
  const el = $("#boot"); if (!el) return;
  const seen = (() => { try { return sessionStorage.getItem("ser.booted"); } catch { return null; } })();
  const done = () => { el.remove(); };
  if (seen || location.hash.length > 2) { done(); return; }
  const log = $("#boot-log"), bar = $("#boot-bar"), pct = $("#boot-pct"), msg = $("#boot-msg");
  const SEG = 28; bar.innerHTML = "<i></i>".repeat(SEG);
  const segs = [...bar.children];
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let shown = 0, target = 0, over = false;
  const line = (t, kind = "ok", tag = "OK") => {
    const li = document.createElement("li"); li.className = kind;
    li.innerHTML = `${esc(t)} ${tag ? `<b>[${tag}]</b>` : ""}`;
    log.append(li); while (log.children.length > 8) log.firstChild.remove();
  };
  const paint = () => {
    const n = Math.round(shown / 100 * SEG);
    segs.forEach((s, i) => { s.classList.toggle("on", i < n); s.style.setProperty("--k", i); });
    pct.textContent = Math.round(shown) + "%";
  };
  const finish = () => {
    if (over) return; over = true;
    try { sessionStorage.setItem("ser.booted", "1"); } catch {}
    shown = 100; paint(); msg.textContent = "Ready";
    el.classList.add("out"); setTimeout(done, calm ? 280 : 580);
  };
  el.addEventListener("pointerdown", finish);
  addEventListener("keydown", finish, { once: true });
  setTimeout(finish, 4500);

  const step = (to, text, kind, tag) => { target = to; msg.textContent = text; if (text) line(text, kind, tag); };
  const wait = ms => new Promise(r => setTimeout(r, calm ? ms / 3 : ms));
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  (async () => {
    const t0 = performance.now();
    line("S.E.R. OS 0.1 · boot loader", "dim", "");
    await wait(200); step(14, "Mounting virtual desktop");
    await withTimeout(document.fonts ? document.fonts.ready : null, 1400);
    step(34, "Loading pixel fonts");
    await wait(160);
    let found = null;
    try { found = await withTimeout(contentFiles(), 2200); } catch {}
    if (found && found.ok) {
      const md = found.paths.filter(p => /^content\/.*\.md$/i.test(p) && !p.split("/").some(s => s.startsWith("_"))).length;
      step(66, `Reading content folder · ${md} file${md === 1 ? "" : "s"}`);
    } else { step(66, "Content folder not reachable, using what's here", "warn", "SKIP"); }
    await wait(180); step(84, "Painting wallpaper");
    await wait(160); step(96, "Starting desktop");
    const rest = 1500 - (performance.now() - t0);
    if (rest > 0) await wait(rest);
    finish();
  })().catch(finish);

  (function loop() {
    if (over) return;
    shown += (target - shown) * (calm ? 1 : .09) + .08;
    shown = Math.min(shown, 99); paint(); requestAnimationFrame(loop);
  })();
})();
