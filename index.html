<!doctype html>
<html lang="en">

<meta name="description" content="My little corner of the internet. Writing, artworks and projects.">
<meta property="og:title" content="Steven Edward Raagas">
<meta property="og:description" content="My little corner of the internet. Writing, artworks and projects.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#c9bef5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%235b4fa8'/%3E%3Cpath fill='%23fbf9ff' d='M2 1h4v2H3v1h3v3H2V5h3V4H2z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@layer reset, tokens, base, layout, components, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ul { padding: 0; list-style: none; }
}

@layer tokens {
  :root {
    --ink: #2f2a5c; --lav-700: #5b4fa8; --lav-500: #8f7fe0; --lav-300: #c9bef5; --lav-200: #ddd6f8;
    --blue-500: #5b8def; --blue-300: #a9c8ff; --ice: #e6f1ff;
    --pearl: #fbf9ff; --pearl-2: #f1eefa; --edge: #8d86b8;

    --midnight: var(--ink); --paper: var(--pearl); --orange: var(--lav-300); --cyan: #8fc4ff;
    --purple: var(--lav-500); --pink: #f0a8e6; --lime: #a6ecd0;

    --bg: var(--pearl); --fg: var(--ink); --muted: #5a5486; --line: var(--edge);
    --card: #fff; --shadow: var(--lav-300); --link: #3555c8;

    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --head: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
    --pixel: "Press Start 2P", monospace;
    --mono: "IBM Plex Mono", ui-monospace, monospace;

    --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2.5rem; --s7: 4rem;
    --tb: 2.9rem;
  }
}

@layer base {
  html, body { height: 100%; }
  body { background: var(--lav-300); color: var(--fg); font: 400 1rem/1.6 var(--sans); overflow: hidden; -webkit-text-size-adjust: 100%; }
  h1, h2, h3 { font-family: var(--head); line-height: 1.15; text-wrap: balance; }
  p { text-wrap: pretty; }
  a { color: var(--link); text-underline-offset: .2em; }
  :focus-visible { outline: 3px solid var(--blue-500); outline-offset: 2px; }
  main:focus { outline: none; }
}

@layer components {
  .skip { position: fixed; inset-inline-start: .5rem; inset-block-start: -4rem; z-index: 100; background: var(--pearl); color: var(--ink); padding: .5rem 1rem; font-weight: 700; border: 2px solid var(--ink); }
  .skip:focus { inset-block-start: .5rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* bevel language: light edge top-left, dark edge bottom-right, 1px ink outline */
  .raised { border: 2px solid; border-color: #fff var(--edge) var(--edge) #fff; outline: 1px solid var(--ink); outline-offset: 0; background: var(--pearl-2); }
  .sunk { border: 2px solid; border-color: var(--edge) #fff #fff var(--edge); background: #fff; }

  /* desktop */
  .desk { position: fixed; inset: 0 0 var(--tb) 0; overflow: hidden; }
  .desk::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; background: repeating-linear-gradient(0deg, rgba(47,42,92,.045) 0 1px, transparent 1px 3px); }
  .backdrop { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #9d8fe8 0%, #c3b6f7 36%, #dde0ff 60%, #eaf3ff 100%); }
  .backdrop::before { content: ""; position: absolute; inset: 58% -60% -30% -60%; background-image: linear-gradient(rgba(91,79,168,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(91,79,168,.5) 1px, transparent 1px); background-size: 56px 56px; transform: perspective(340px) rotateX(62deg); transform-origin: top; -webkit-mask-image: linear-gradient(#000 20%, transparent); mask-image: linear-gradient(#000 20%, transparent); }
  .backdrop::after { content: ""; position: absolute; inset-inline: 0; inset-block-start: 36%; margin-inline: auto; width: min(22rem, 54vw); aspect-ratio: 2 / 1; border-radius: 22rem 22rem 0 0; background: repeating-linear-gradient(0deg, #fbf9ff 0 10px, transparent 10px 14px); opacity: .8; }
  .backdrop.on { background-color: var(--lav-300); background-image: var(--bgimg); background-size: cover; background-position: center; }
  .backdrop.on::before, .backdrop.on::after { display: none; }

  .icons { position: absolute; inset: 0; z-index: 2; padding: .75rem; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 6.9rem); grid-auto-columns: 6.6rem; justify-content: start; align-content: start; gap: .15rem; }
  .icon { display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: .45rem .15rem; text-decoration: none; color: #fff; font: 500 .78rem/1.2 var(--sans); text-align: center; border: 1px dotted transparent; -webkit-tap-highlight-color: transparent; }
  .icon svg { width: 2.9rem; height: 2.9rem; shape-rendering: crispEdges; filter: drop-shadow(2px 2px 0 rgba(47,42,92,.4)); }
  .icon span { padding: .1rem .35rem; background: rgba(47,42,92,.72); max-width: 100%; overflow-wrap: anywhere; }
  .icon:hover { border-color: rgba(255,255,255,.7); }
  .icon[aria-selected="true"] { border-color: #fff; }
  .icon[aria-selected="true"] span { background: var(--lav-700); }
  .mark { position: absolute; inset-inline-end: 1rem; inset-block-end: .9rem; z-index: 2; text-align: end; color: var(--ink); font: 500 .8rem/1.4 var(--mono); pointer-events: none; }
  .mark b { display: block; font: .875rem/1.2 var(--pixel); color: var(--lav-700); margin-block-end: .35rem; }

  /* window */
  .win { position: absolute; z-index: 5; display: flex; flex-direction: column; left: 0; top: 0; width: min(62rem, calc(100% - 1.5rem)); height: min(calc(100% - 1.5rem), 46rem); box-shadow: 6px 6px 0 rgba(47,42,92,.32); }
  .win[hidden] { display: none; }
  .win[data-max] { inset: 0 !important; width: auto; height: auto; box-shadow: none; outline: 0; }
  .tbar { position: relative; display: flex; align-items: center; gap: .5rem; padding: .22rem .25rem .3rem .5rem; background: linear-gradient(90deg, var(--lav-700), var(--blue-500) 72%, var(--blue-300)); color: #fff; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .tbar::after { content: ""; position: absolute; inset: auto 0 0 0; height: 2px; background: linear-gradient(90deg, #f0a8e6, #8fc4ff, #a6ecd0, #f0a8e6); }
  .tbar svg { width: 1.15rem; height: 1.15rem; flex: none; shape-rendering: crispEdges; }
  .ttl { flex: 1; min-width: 0; font: .5625rem/1.5 var(--pixel); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbtn, .tool button, .tool a.tb { display: inline-grid; place-items: center; min-width: 1.75rem; height: 1.55rem; padding-inline: .45rem; color: var(--ink); background: var(--pearl-2); border: 2px solid; border-color: #fff var(--edge) var(--edge) #fff; font: 700 .8rem/1 var(--mono); text-decoration: none; cursor: pointer; }
  .tbtn:active, .tool button:active, .tool a.tb:active { border-color: var(--edge) #fff #fff var(--edge); }
  .tool { display: flex; align-items: center; gap: .35rem; padding: .35rem .3rem; background: var(--pearl-2); }
  .tool button, .tool a.tb { height: 1.9rem; min-width: 2.2rem; }
  .tool [disabled], .tool [aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .addr { flex: 1; min-width: 0; font: .8rem/1.5 var(--mono); padding: .2rem .55rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .win-body { flex: 1; min-height: 0; overflow: auto; margin-inline: .25rem; background: var(--bg); color: var(--fg); scroll-behavior: smooth; }
  .win-body.flush { overflow: hidden; }
  .stat { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem .5rem .3rem; font: .72rem/1.4 var(--mono); color: var(--muted); }
  .win.busy iframe { pointer-events: none; }

  .pg { padding: clamp(1rem, 3.5vw, 2rem); max-inline-size: 58rem; margin-inline: auto; }
  .pg-head { margin-block-end: var(--s5); padding-block-end: var(--s4); border-block-end: 2px dotted var(--edge); }
  .pg-head h1 { font-size: clamp(1.8rem, 1.2rem + 2.6vw, 2.9rem); font-weight: 600; margin-block: .5rem; letter-spacing: -.01em; }
  .pg-head p { max-inline-size: 40rem; color: var(--muted); }
  .back { font: 500 .85rem var(--mono); }

  /* taskbar */
  .task { position: fixed; inset: auto 0 0 0; height: var(--tb); z-index: 50; display: flex; align-items: stretch; gap: .35rem; padding: .25rem; background: var(--pearl-2); border-block-start: 2px solid #fff; box-shadow: 0 -1px 0 var(--edge); }
  .start, .tk { display: flex; align-items: center; gap: .5rem; padding-inline: .8rem; background: var(--pearl-2); color: var(--ink); border: 2px solid; border-color: #fff var(--edge) var(--edge) #fff; outline: 1px solid var(--ink); font: 600 .85rem var(--head); min-width: 0; }
  .start { font: .5625rem/1 var(--pixel); }
  .start svg { width: 1rem; height: 1rem; shape-rendering: crispEdges; }
  .start[aria-expanded="true"], .tk[aria-pressed="true"] { border-color: var(--edge) #fff #fff var(--edge); background: var(--lav-200); }
  .tk { max-inline-size: 14rem; }
  .tk svg { width: 1.15rem; height: 1.15rem; flex: none; }
  .tk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray { margin-inline-start: auto; display: flex; align-items: center; gap: .6rem; padding-inline: .7rem; font: .78rem/1 var(--mono); color: var(--ink); }
  .led { width: .55rem; height: .55rem; background: #4fd6a0; box-shadow: 0 0 6px #4fd6a0; flex: none; }
  .smenu { position: fixed; inset-inline-start: .25rem; inset-block-end: var(--tb); z-index: 60; inline-size: min(17rem, calc(100% - .5rem)); display: flex; box-shadow: 5px 5px 0 rgba(47,42,92,.3); }
  .smenu[hidden] { display: none; }
  .srail { writing-mode: vertical-rl; transform: rotate(180deg); padding: .9rem .45rem; background: linear-gradient(0deg, var(--lav-700), var(--blue-500)); color: #fff; font: .625rem/1 var(--pixel); letter-spacing: .08em; }
  .sitems { flex: 1; padding: .25rem; }
  .sitems a { display: flex; align-items: center; gap: .75rem; min-height: 2.75rem; padding: .3rem .6rem; color: var(--ink); text-decoration: none; font: 500 .95rem var(--head); }
  .sitems a:hover, .sitems a:focus-visible { background: var(--lav-700); color: #fff; }
  .sitems svg { width: 1.65rem; height: 1.65rem; flex: none; shape-rendering: crispEdges; }
  .sitems hr { border: 0; border-block-start: 1px solid var(--edge); border-block-end: 1px solid #fff; margin-block: .25rem; }

  @media (max-width: 47.99rem) {
    .win { inset: 0 !important; width: auto; height: auto; box-shadow: none; outline: 0; }
    .tbar { cursor: default; }
    [data-act="max"] { display: none; }
    .tbtn { min-width: 2.75rem; height: 2.4rem; }
    .tool button, .tool a.tb { height: 2.4rem; min-width: 2.75rem; }
    .tk #tk-t { display: none; }
    .icons { grid-auto-columns: 6rem; padding: .5rem; }
  }

  /* shared bits */
  .label { font: .5625rem/1.6 var(--pixel); text-transform: uppercase; letter-spacing: .04em; color: var(--lav-700); }
  .meta { font: 400 .78rem/1.4 var(--mono); color: var(--muted); letter-spacing: .02em; }
  .chip { display: inline-block; font: 500 .72rem var(--mono); border: 1px solid var(--edge); background: var(--pearl-2); padding: .15rem .5rem; color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .status { display: inline-block; font: .5625rem/1 var(--pixel); padding: .45rem .5rem .4rem; background: var(--pink); color: var(--ink); text-transform: uppercase; }
  .status[data-s="Concept"] { background: var(--lav-300); }
  .status[data-s="Prototype"] { background: var(--cyan); }
  .status[data-s="Completed"] { background: var(--lime); }
  .btn { display: inline-block; font: 600 .95rem var(--head); text-decoration: none; padding: .6rem 1.1rem; min-height: 2.75rem; display: inline-flex; align-items: center; background: var(--lav-300); color: var(--ink); border: 2px solid; border-color: #fff var(--edge) var(--edge) #fff; outline: 1px solid var(--ink); }
  .btn:hover { background: var(--lav-200); }
  .btn:active { border-color: var(--edge) #fff #fff var(--edge); }
  .btn.alt { background: var(--pearl-2); }
  .btn-row { display: flex; flex-wrap: wrap; gap: var(--s3); }
  .more { font: 500 .85rem var(--mono); }
  .sub { font: 500 .8rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-block: 0 var(--s4); }
  .empty { padding: var(--s6) var(--s4); border: 2px dotted var(--edge); text-align: center; color: var(--muted); }
  .empty b { color: var(--ink); }
  .live { display: inline-flex; align-items: center; gap: .5rem; font: 500 .75rem var(--mono); }
  .cols { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .art { display: block; position: relative; overflow: hidden; background: var(--lav-200); }
  .art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* finder / filter bar */
  .bar-f { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-block-end: var(--s4); }
  .bar-f input[type="search"], .finder input, .finder select { font: 400 1rem var(--sans); min-height: 2.75rem; padding: .45rem .7rem; background: #fff; color: var(--ink); border: 2px solid; border-color: var(--edge) #fff #fff var(--edge); border-radius: 0; width: 100%; }
  .bar-f input[type="search"] { flex: 1 1 12rem; width: auto; }
  .pills { display: flex; flex-wrap: wrap; gap: var(--s2); margin-block-end: var(--s4); }
  .pills button { font: 500 .8rem var(--mono); padding: .4rem .8rem; min-height: 40px; background: var(--pearl-2); border: 2px solid; border-color: #fff var(--edge) var(--edge) #fff; color: var(--ink); }
  .pills button[aria-pressed="true"] { background: var(--lav-700); color: #fff; border-color: var(--edge) #fff #fff var(--edge); }

  /* blog */
  .post { display: grid; min-width: 0; background: var(--card); color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
  .post .art { aspect-ratio: 16 / 7; }
  .post-body { min-width: 0; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
  .post h3 { font-size: 1.35rem; font-weight: 600; }
  .post p { color: var(--muted); }
  a.post:hover h3 { text-decoration: underline; text-decoration-color: var(--blue-500); text-decoration-thickness: 3px; }
  .article-head h1 { font-size: clamp(2rem, 1.2rem + 3.5vw, 3.2rem); font-weight: 600; margin-block: .5rem; }
  .pn { display: grid; gap: var(--s3); margin-block-start: var(--s6); }
  @media (min-width: 40rem) { .pn { grid-template-columns: 1fr 1fr; } .pn a:last-child { text-align: end; } }
  .pn a { padding: var(--s3) var(--s4); text-decoration: none; color: var(--ink); }
  .pn a:hover { background: var(--lav-200); }
  .pn .label { display: block; margin-block-end: var(--s2); }
  .cover { aspect-ratio: 16 / 8; margin-block: var(--s4) var(--s5); }

  /* markdown */
  .md { font-size: 1.06rem; line-height: 1.75; max-inline-size: 44rem; overflow-wrap: anywhere; }
  .md > * + * { margin-block-start: 1.1em; }
  .md > .md-h { margin-block-start: 1.8em; }
  .md > .md-h:first-child { margin-block-start: 0; }
  .md-h { font-family: var(--head); font-weight: 600; line-height: 1.2; color: var(--ink); }
  h1.md-h { font-size: 2.1rem; } h2.md-h { font-size: 1.65rem; } h3.md-h { font-size: 1.35rem; }
  h4.md-h { font-size: 1.15rem; } h5.md-h, h6.md-h { font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; }
  .md :is(ul, ol) { padding-inline-start: 1.5em; }
  .md ul { list-style: square; } .md ol { list-style: decimal; }
  .md li + li { margin-block-start: .3em; }
  .md-tasks { list-style: none !important; padding-inline-start: .2em !important; }
  .md-task { display: flex; gap: .6em; align-items: baseline; }
  .md blockquote { border-inline-start: 5px solid var(--lav-500); padding: .2em 1em; background: var(--pearl-2); color: var(--ink); }
  .md hr { border: 0; border-block-start: 2px dotted var(--edge); }
  .md code { font: .9em var(--mono); background: var(--lav-200); padding: .1em .35em; }
  .md pre.md-code { overflow-x: auto; padding: 1rem; background: var(--ink); color: #f3efff; line-height: 1.5; max-inline-size: 100%; }
  .md pre.md-code code { background: none; padding: 0; font-size: .88rem; }
  .md img { max-inline-size: 100%; height: auto; border: 2px solid var(--ink); }
  .md mark { background: #f6e58d; padding: 0 .15em; }
  .t-sm { font-size: .85em; } .t-lg { font-size: 1.25em; } .t-xl { font-size: 1.6em; line-height: 1.3; }
  .t-secondary { color: var(--muted); } .t-accent { color: var(--lav-700); } .t-blue { color: var(--link); } .t-pink { color: #a93a89; }
  .md-tablewrap { overflow-x: auto; }
  .md-table { border-collapse: collapse; min-inline-size: 60%; font-size: .95rem; }
  .md-table :is(th, td) { border: 1px solid var(--edge); padding: .4rem .7rem; text-align: start; overflow-wrap: normal; }
  .md-table th { background: var(--lav-200); }
  .md-fig { text-align: center; }
  .md-fig img { margin-inline: auto; }
  .md-fig figcaption { font: .8rem/1.5 var(--mono); color: var(--muted); margin-block-start: .5rem; }
  .md-fig.md-left { float: left; max-inline-size: 50%; margin: .3em 1.2em .6em 0; }
  .md-fig.md-right { float: right; max-inline-size: 50%; margin: .3em 0 .6em 1.2em; }
  .md::after { content: ""; display: table; clear: both; }
  .md-center { text-align: center; } .md-right { text-align: end; } .md-left { text-align: start; }
  .md-big { font-size: 1.5em; line-height: 1.4; } .md-small { font-size: .85em; color: var(--muted); }
  .md-center .md-h, .md-right .md-h { text-align: inherit; }
  .md-box { padding: .8rem 1rem; border: 2px solid var(--ink); background: var(--ice); }
  .md-box-t { display: block; font: .5625rem/1.4 var(--pixel); text-transform: uppercase; margin-block-end: .5rem; color: var(--lav-700); }
  .md-box > * + * { margin-block-start: .6em; }
  .md-tip { background: #e8fbf2; } .md-important { background: #efe9ff; } .md-warning { background: #fff6dc; } .md-caution { background: #ffe9ee; }
  @media (max-width: 40rem) { .md-fig.md-left, .md-fig.md-right { float: none; max-inline-size: 100%; margin: 0; } }

  /* gallery */
  .tiles { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 11rem), 1fr)); }
  .tile { display: block; width: 100%; text-align: start; background: var(--card); color: var(--ink); padding: .35rem; }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--lav-200); }
  .tile span { display: block; padding: .4rem .2rem .1rem; font: 500 .78rem/1.35 var(--mono); overflow-wrap: anywhere; }
  .tile:hover { background: var(--lav-200); }
  dialog.lb { border: 0; padding: 0; margin: auto; inline-size: min(70rem, 100vw); block-size: min(46rem, 100dvh); max-width: 100vw; max-height: 100dvh; background: var(--pearl-2); color: var(--ink); box-shadow: 8px 8px 0 rgba(47,42,92,.4); }
  dialog.lb::backdrop { background: rgba(47,42,92,.7); }
  .lb-in { height: 100%; display: flex; flex-direction: column; }
  .lb-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); margin: .25rem; gap: 0; }
  .lb-stage { position: relative; min-height: 0; overflow: hidden; background: #1d1940; }
  .lb-stage img { position: absolute; inset: .5rem; width: calc(100% - 1rem); height: calc(100% - 1rem); object-fit: contain; }
  .lb-info { overflow: auto; padding: 1rem 1.2rem; background: var(--bg); }
  .lb-info h2 { font-size: 1.5rem; font-weight: 600; margin-block-end: .4rem; }
  .lb-info .md { font-size: 1rem; margin-block-start: 1rem; }
  .lb-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .35rem .4rem; }
  .lb-foot .meta { flex: 1; text-align: center; }
  .lb-foot button { min-width: 44px; min-height: 40px; padding-inline: .8rem; }
  @media (max-width: 47.99rem) { .lb-grid { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); } dialog.lb { block-size: 100dvh; } }

  /* about */

function scene(seed, w, h) {
  const r = rng(seed * 7919 + 13), p = SKY[seed % SKY.length];
  const hz = Math.round(h * .62), bh = Math.ceil(hz / 5);
  let s = "";
  const R = (x, y, a, b, f) => { s += `<rect x="${x}" y="${y}" width="${a}" height="${b}" fill="${f}"/>`; };
  p.forEach((c, i) => R(0, i * bh, w, bh + 1, c));
  for (let i = 0; i < w / 4; i++) R(Math.floor(r() * w), Math.floor(r() * bh * 2), 1, 1, "#fbf9ff");
  const rad = Math.max(3, Math.round(Math.min(w, h) / 7)), sx = Math.floor(w * (.25 + r() * .5)), sy = hz - rad - Math.floor(r() * bh * 1.5);
  for (let y = -rad; y <= rad; y++) {
    const half = Math.floor(Math.sqrt(rad * rad - y * y));
    if (sy + y < hz) R(sx - half, sy + y, half * 2 + 1, 1, "#fbf9ff");
  }
  [["#6a5fbf", .9], ["#4a4398", .35], ["#2f2a5c", -.45]].forEach(([col, lift]) => {
    let y = hz - bh * lift;
    for (let x = 0; x < w; x++) {
      y = Math.min(h - 2, Math.max(hz - bh * 2, y + (r() - .5) * 2.4));
      const yy = Math.round(y);
      R(x, yy, 1, h - yy, col);
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
}

function checkEmbed(g) {
  const pr = providerOf(g);
  if (!pr) return { ok: false, msg: "The provider for this game isn't registered." };
  if (!pr.active) return { ok: false, msg: "This provider is switched off." };
  if (pr.embedMethod !== "iframe") return { ok: false, msg: "This provider doesn't allow embedding here." };
  let u;
  try { u = new URL(g.embedUrl); } catch { return { ok: false, msg: "The embed link isn't a valid URL." }; }
  if (u.protocol !== "https:") return { ok: false, msg: "The embed link isn't HTTPS." };
  if (!pr.allowedOrigins.includes(u.origin)) return { ok: false, msg: "The embed link points to a site I haven't approved." };
  if (!pr.allowedPathPrefixes.some(x => u.pathname.startsWith(x))) return { ok: false, msg: "The embed link has an unexpected path." };
  return { ok: true, url: u.href };
}

  let body = raw, h1 = null;
  const m = raw.match(/^\s*#[ \t]+(.+?)[ \t]*#*[ \t]*(?:\n|$)/);
  if (m && !meta.title) { h1 = plain(m[1]); body = raw.slice(m[0].length); }
  const base = path.slice(0, path.lastIndexOf("/") + 1);
  return {
    slug, path, base, body, folder: slug.includes("/") ? slug.slice(0, slug.lastIndexOf("/")) : "",
    title: meta.title || h1 || ni.title, date: goodDate(meta.date) || ni.date, tags: toList(meta.tags),
    cover: meta.cover ? safeUrl(meta.cover, base) : "", summary: meta.summary || meta.description || summaryOf(body),
    draft: /^(true|yes|1)$/i.test(String(meta.draft ?? "")), words: (body.match(/\S+/g) || []).length
  };
}
const byNewest = (a, b) => (b.date || "").localeCompare(a.date || "") || a.title.localeCompare(b.title, undefined, { numeric: true });

let postsP = null;
const loadPosts = () => postsP ??= (async () => {
  const { paths, ok, via, why } = await contentFiles();
  const slugs = blogPaths(paths).map(p => p.slice(BLOG.length).replace(/\.md$/i, ""));
  const list = await pool(slugs, 8, loadPost);
  return { posts: list.filter(p => p && !p.draft).sort(byNewest), ok, found: slugs.length, seen: paths.length, via, why };
})();

const galleryItems = paths => {
  const set = new Set(paths);
  return paths.filter(p => p.startsWith(GAL) && MEDIA.test(p) && !isDraft(p)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(p => {
    const rel = p.slice(GAL.length), parts = rel.split("/"), side = p.replace(/\.[^./]+$/, ".md");

  });
};

async function setupBlog(stale) {
  const { posts, ok, found, seen, via, why } = await loadPosts();
  if (stale()) return;
  const slot = $("#slot");
  if (!posts.length) {
    slot.innerHTML = `<div class="empty">${
      !ok ? "<b>My posts aren't loading right now.</b><br>Try again in a minute."
      : found ? `<b>I found ${found} post file${found === 1 ? "" : "s"} but couldn't open ${found === 1 ? "it" : "them"}.</b><br>GitHub Pages may still be publishing, or my repo is missing an empty file called <code>.nojekyll</code> in its top folder.`
      : "<b>I haven't posted anything yet.</b>"}
      <p class="meta" style="margin-block-start:.75rem">${esc(ok ? `Looked via ${via.replace("from", "").toLowerCase()}: ${seen} files in content/, ${found} posts.` : why.join(" · "))}</p></div>`;
    return;
  }
  setStatus(`${posts.length} post${posts.length === 1 ? "" : "s"}`);
  const folders = [...new Set(posts.map(p => p.folder).filter(Boolean))].sort(), tags = [...new Set(posts.flatMap(p => p.tags))].sort();
  const st = { q: "", folder: "", tag: "", n: PAGE };
  slot.innerHTML = `
    <div class="bar-f"><input type="search" id="bq" placeholder="Search my posts" aria-label="Search my posts" autocomplete="off"></div>
    <div class="pills" id="bf" role="group" aria-label="Folders"></div>
    <div class="pills" id="bt" role="group" aria-label="Tags"></div>
    <div class="list" id="bl"></div><div id="bm" style="margin-block-start:1.5rem"></div>`;
  const pills = (el, items, cur, key, fmtL, all) => {
    el.hidden = !items.length;
    el.innerHTML = items.length ? [["", all], ...items.map(x => [x, fmtL(x)])].map(([v, l]) => `<button aria-pressed="${cur === v}" data-v="${esc(v)}">${esc(l)}</button>`).join("") : "";
    el.onclick = e => { const b = e.target.closest("[data-v]"); if (b) { st[key] = b.dataset.v; st.n = PAGE; draw(); } };
  };
  const draw = () => {
    const t = st.q.toLowerCase();
    const hits = posts.filter(p => (!st.folder || p.folder === st.folder || p.folder.startsWith(st.folder + "/")) && (!st.tag || p.tags.includes(st.tag))
      && (!t || (p.title + " " + p.summary + " " + p.tags.join(" ") + " " + p.folder).toLowerCase().includes(t)));
    pills($("#bf"), folders, st.folder, "folder", x => x + "/", "All folders");
    pills($("#bt"), tags, st.tag, "tag", x => "#" + x, "All tags");
    $("#bl").innerHTML = hits.length ? hits.slice(0, st.n).map(postCard).join("") : `<div class="empty">Nothing matches that.</div>`;
    $("#bm").innerHTML = hits.length > st.n ? `<button class="btn alt" id="more">Show more (${hits.length - st.n} left)</button>` : "";
    const m = $("#more"); if (m) m.onclick = () => { st.n += PAGE; draw(); };
    setStatus(`${hits.length} of ${posts.length} posts`);
  };
  $("#bq").oninput = e => { st.q = e.target.value.trim(); st.n = PAGE; draw(); };
  draw();
}
