const cover = (seed, alt, cls = "") => art(seed, 48, 30, alt, cls);


const BGALIAS = { blog: "journal" };
const BG = { dir: "backgrounds", files: ["bg.webp", "bg.jpg", "bg.jpeg", "bg.png", "bg.gif"] };
const canLoad = url => new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = url; });
const bgCache = {};
function findBg(key) {
  return bgCache[key] ??= (async () => {
    for (const k of new Set([key, key.split("/")[0], BGALIAS[key] || key, "home"])) for (const f of BG.files) {
      const url = `${BG.dir}/${k}/${f}`;
      if (await canLoad(url)) return url;
    }
    return "";
  })();
}

const THUMB = { dir: "thumbnails", files: ["webp", "jpg", "jpeg", "png"] };
const thumbCache = {};
const thumbWord = g => g.title.split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g, "");
function findThumb(word) {
  return thumbCache[word] ??= (async () => {
    for (const f of THUMB.files) {
      const url = `${THUMB.dir}/${word}.${f}`;
      if (await canLoad(url)) return url;
    }
    return "";
  })();
}
function hydrateThumbs() {
  document.querySelectorAll("#main img[data-thumb]").forEach(img =>
    findThumb(img.dataset.thumb).then(u => { if (u) img.src = u; else img.remove(); }));
}
let curKey = "", bdKey = null;
const bd = document.getElementById("backdrop");
function setBackdrop(key) {
  if (key === bdKey) return;
  curKey = key;
  (key ? findBg(key) : Promise.resolve("")).then(u => {
    if (curKey !== key) return;
    bdKey = key;
    if (u) bd.style.setProperty("--bgimg", `url("${u}")`);
    bd.classList.toggle("on", !!u);
  });
}

function blocks(list) {
  return list.map(b =>
    b.t === "h" ? `<h2>${esc(b.x)}</h2>` :
    b.t === "q" ? `<blockquote>${esc(b.x)}</blockquote>` :
    b.t === "ul" ? `<ul>${b.x.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` :
    `<p>${esc(b.x)}</p>`).join("");
}

const GICO = '<svg class="gico" viewBox="0 0 11 7" aria-hidden="true"><path d="M2 0h7v1h2v4h-2v1H8V5H3v1H2V5H0V1h2zM3 2v1H2v1h1v1h1V4h1V3H4V2zm5 0v1h1V2zm1 1v1h1V3z" fill-rule="evenodd"/></svg>';

const providerOf = g => providers.find(p => p.id === g.providerId);

function checkEmbed(g) {
  const pr = providerOf(g);
  if (!pr) return { ok: false, msg: "The provider for this game isn't registered." };
  if (!pr.active) return { ok: false, msg: "This provider is switched off." };
  if (pr.embedMethod !== "iframe") return { ok: false, msg: "This provider doesn't allow embedding here." };
  let u;
  try { u = new URL(g.embedUrl); } catch { return { ok: false, msg: "The embed link isn't a valid URL." }; }
  if (u.protocol !== "https:") return { ok: false, msg: "The embed link isn't HTTPS." };
  if (!pr.allowedOrigins.includes(u.origin)) return { ok: false, msg: "The embed link points to a site I haven't approved." };
  if (!pr.allowedPathPrefixes.some(x => u.pathname.startsWith(x))) return { ok: false, msg: "The embed link has an unexpected path." };
  return { ok: true, url: u.href };
}

function safeLink(url) {
  try { const u = new URL(url); return u.protocol === "https:" ? u.href : ""; } catch { return ""; }
}

const liveGames = () => games.filter(g => g.published).sort((a, b) => a.order - b.order);

function gstatus(g) {
  if (g.embedType !== "iframe") return { t: "Link only", c: "warn" };
  return checkEmbed(g).ok ? { t: "Playable", c: "" } : { t: "Unavailable", c: "soon" };
}

const pickCard = e => {
  const inner = `${cover(e.seed, "Pixel art for " + e.title)}
    <div class="pick-body"><span class="tag ${e.live ? "" : "soon"}">${esc(e.status)}</span><h2>${esc(e.title)}</h2><p>${esc(e.desc)}</p></div>`;
  return e.live
    ? `<a class="pick" href="#/chill-zone/${e.slug}">${inner}</a>`

};

const gameCard = g => {
  const st = gstatus(g);
  const thumb = `<span class="art" style="aspect-ratio:16/10"><img data-thumb="${thumbWord(g)}" alt="" style="width:100%;height:100%;object-fit:cover"></span>`;
  return `<a class="card" href="#/chill-zone/game-zone/${g.slug}">
    ${thumb}
    <div class="card-body">
      <div class="gtags"><span class="tag ${st.c}">${st.t}</span>${g.featured ? '<span class="tag" style="background:var(--cyan)">Featured</span>' : ""}</div>
      <h3>${esc(g.title)}</h3>
      <span class="meta">${esc(g.platform)} · ${esc(g.genre)}</span>
      ${g.description ? `<p>${esc(g.description)}</p>` : ""}
    </div></a>`;
};

function setupLibrary() {
  const box = $("#glib"), q = $("#q"), fp = $("#fp"), fg = $("#fg");
  const draw = () => {
    const term = q.value.trim().toLowerCase(), filtering = term || fp.value || fg.value;
    const hits = liveGames().filter(g => (!term || g.title.toLowerCase().includes(term)) && (!fp.value || g.platform === fp.value) && (!fg.value || g.genre === fg.value));
    const feat = hits.filter(g => g.featured);
    if (!hits.length) { box.innerHTML = `<div class="empty">${liveGames().length ? "Nothing matches that. Try fewer filters." : "I haven't added any games yet."}</div>`; return; }
    const showFeat = !filtering && feat.length, rest = showFeat ? hits.filter(g => !g.featured) : hits;
    box.innerHTML = (showFeat ? `<p class="sub">Featured</p><div class="cols" style="margin-block-end:2.5rem">${feat.map(gameCard).join("")}</div>${rest.length ? '<p class="sub">More games</p>' : ""}` : "")
      + (rest.length ? `<div class="cols">${rest.map(gameCard).join("")}</div>` : "");
    hydrateThumbs();
  };
  [q, fp, fg].forEach(el => el.addEventListener("input", draw));
  draw();
}

function setupPlayer(g, pr) {
  const play = $("#play"); if (!play) return;
  const stage = $("#stage"), ui = $("#stage-ui"), fs = $("#fs");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const go = () => {
    const chk = checkEmbed(g);
    if (!chk.ok) { ui.innerHTML = `<p>${esc(chk.msg)}</p>`; return; }
    ui.innerHTML = `<div class="spin" role="status" aria-label="Loading game"></div><p>Loading the game from ${esc(pr.name)}. If nothing shows up, use the Open button below.</p>`;
    const f = document.createElement("iframe");
    f.src = chk.url;
    f.title = g.title;
    f.setAttribute("allow", pr.allow);
    f.setAttribute("allowfullscreen", "");
    f.setAttribute("scrolling", "no");
    f.addEventListener("load", () => ui.remove());
    stage.appendChild(f);
    f.focus();
  };
  play.onclick = go;
  if (fs) fs.onclick = async () => {
    try {
      if (fsEl()) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      await (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
      if (g.orientation === "Landscape" && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
    } catch { fs.textContent = "Fullscreen isn't available here"; }
  };
  document.addEventListener("fullscreenchange", () => { if (fs) fs.textContent = fsEl() ? "Exit fullscreen" : "Fullscreen"; });
}

/* ---------- page blocks ---------- */
/*
  A block looks like this:

    ::: name
    key: value
    key: value

    Optional text (normal Markdown).
    :::

  Keys are the lines at the top, up to the first blank line. A line that
  starts with an indent continues the key above it. Everything after the
  blank line is the block's text. Blocks nest two levels deep at most.
*/
class BlockError extends Error {}
const BLK = { depth: 0, max: 2, n: 0 };

const lev = (a, b) => {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
};
const toArr = v => String(v ?? "").split("\n").flatMap((l, _, all) => all.length > 1 ? [l] : l.split(",")).map(s => s.trim().replace(/^-\s+/, "")).filter(Boolean);

function readConfig(lines, spec) {
  const keys = spec.keys || {}, cfg = {}, warn = [];
  let i = 0, last = null, seen = false;
  for (; i < lines.length; i++) {
    const l = lines[i];
    if (!l.trim()) break;
    if (seen && /^[ \t]+\S/.test(l)) { if (last) cfg[last] += "\n" + l.trim(); continue; }
    const m = l.match(/^([A-Za-z][\w-]*)[ \t]*:[ \t]*(.*)$/);
    if (!m) break;
    const k = m[1].toLowerCase();
    if (!(k in keys)) {
      const near = Object.keys(keys).find(x => lev(x, k) <= 2);
      if (!near) break;
      warn.push(`unknown key "${k}", did you mean "${near}"?`); seen = true; last = null; continue;
    }
    seen = true;
    if (k in cfg) { warn.push(`"${k}" is listed twice, so I used the first one`); last = null; continue; }
    cfg[k] = m[2].trim(); last = k;
  }
  while (i < lines.length && !lines[i].trim()) i++;
  for (const [k, t] of Object.entries(keys)) {
    if (!(k in cfg) || !Array.isArray(t)) continue;
    const v = cfg[k].toLowerCase();
    if (t.includes(v)) cfg[k] = v;
    else { warn.push(`"${cfg[k]}" isn't a valid ${k} (use ${t.join(", ")}), so I used the default`); delete cfg[k]; }
  }

}

function kids(lines, names) {
  const out = [], stray = [];
  let i = 0;
  while (i < lines.length) {
    const m = lines[i].match(RE.box);
    if (m && names.includes(m[1].toLowerCase())) {
      let d = 1, j = i + 1;
      for (; j < lines.length; j++) {
        if (RE.box.test(lines[j])) d++;
        else if (RE.boxEnd.test(lines[j]) && --d === 0) break;
      }
      out.push({ name: m[1].toLowerCase(), lines: lines.slice(i + 1, j) });
      i = j + 1;
    } else { if (lines[i].trim()) stray.push(lines[i]); i++; }
  }
  return { out, stray };
}

const blkBox = (name, bad, warn) =>
  (bad.length ? `<div class="blk-err" role="note"><b>${esc(name)}</b> ${bad.map(esc).join("; ")}</div>` : "") +
  (warn.length ? `<p class="blk-warn" role="note">${esc(name)}: ${warn.map(esc).join("; ")}</p>` : "");

function runBlock(name, inner, base, unclosed) {
  const spec = BLOCKS[name];
  if (BLK.depth >= BLK.max) return blkBox(name, ["blocks can only nest two levels deep"], []);
  const { cfg, body, warn } = readConfig(inner, spec), bad = [];
  if (unclosed) warn.push("I couldn't find the closing ::: so this block ran to the end of the page");
  for (const k of spec.req || []) if (!cfg[k]) bad.push(`needs "${k}"`);
  if (spec.body === "none" && body.some(l => l.trim())) warn.push("this block has no text area, so the text was ignored");
  if (spec.body === "req" && !body.some(l => l.trim())) bad.push("needs some text inside it");
  let html = "";
  if (!bad.length) {
    BLK.depth++;
    try { html = spec.render(cfg, body, { base, warn }); }
    catch (e) { bad.push(e instanceof BlockError ? e.message : "could not be drawn (" + e.message + ")"); }
    finally { BLK.depth--; }
  }
  if (bad.length) html = "";
  return html + blkBox(name, bad, warn);
}

const parseCsv = text => {
  text = String(text).replace(/^﻿/, "").replace(/\r\n?/g, "\n").trim();
  const first = text.split("\n", 1)[0], sep = !first.includes(",") && first.includes("\t") ? "\t" : !first.includes(",") && first.includes(";") ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  row.push(cur); rows.push(row);
  return rows.map(r => r.map(s => s.trim())).filter(r => r.some(Boolean));
};

function chartData(rows, cfg) {
  const head = rows[0] || [], body = rows.slice(1);
  if (!head.length || !body.length) throw new Error("the data needs a header row and at least one row of numbers");
  const find = n => head.findIndex(h => h.toLowerCase() === String(n).toLowerCase());
  const num = s => { const v = s === undefined || s === "" ? NaN : Number(s); return Number.isFinite(v) ? v : null; };
  const xi = cfg.x ? find(cfg.x) : 0;
  if (xi < 0) throw new Error(`there is no column called "${cfg.x}" (columns: ${head.join(", ")})`);
  let ycols = cfg.y.length ? cfg.y.map(n => { const k = find(n); if (k < 0) throw new Error(`there is no column called "${n}" (columns: ${head.join(", ")})`); return k; })
    : head.map((_, k) => k).filter(k => k !== xi && body.some(r => num(r[k]) !== null));
  if (!ycols.length) throw new Error("I found no numeric column to plot");
  const dropped = Math.max(0, ycols.length - 5); ycols = ycols.slice(0, 5);
  let pick = body.map((_, i) => i);
  if (cfg.type === "line" && body.length > 1200) { const step = Math.ceil(body.length / 1200); pick = pick.filter(i => i % step === 0 || i === body.length - 1); }
  const rowsP = pick.map(i => body[i]), cats = rowsP.map(r => r[xi] ?? ""), xn = cats.map(num);
  const numericX = cfg.type === "line" && xn.every(v => v !== null);
  return {
    head, body, cats, numericX, dropped, xname: head[xi], total: body.length,
    xs: numericX ? xn : cats.map((_, i) => i),
    series: ycols.map((k, s) => ({ s, name: head[k] || "column " + (k + 1), vals: rowsP.map(r => num(r[k])) }))
  };
}

const fnum = v => {
  const a = Math.abs(v);

  if (a >= 1e6) return +(v / 1e6).toPrecision(3) + "M";
  if (a >= 1e4) return +(v / 1e3).toPrecision(3) + "K";

const niceTicks = (lo, hi, n = 5) => {

  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), r = raw / mag, step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  const out = [];

function barPath(x, w, y0, y1, r) {
  const up = y1 <= y0, h = Math.abs(y1 - y0);

  const top = Math.min(y0, y1), bot = Math.max(y0, y1);

    : `M${x} ${top}V${bot - r}a${r} ${r} 0 0 0 ${r} ${r}H${x + w - r}a${r} ${r} 0 0 0 ${r} ${-r}V${top}Z`;

  const table = `<details class="ch-table"><summary>View as table</summary><div class="md-tablewrap"><table class="md-table"><thead><tr>${D.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${shown.map(r => `<tr>${D.head.map((_, k) => `<td>${esc(r[k] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${D.total > shown.length ? `<p class="ch-more">Showing the first ${shown.length} of ${D.total} rows.</p>` : ""}</details>`;
  const note = [cfg.note, D.dropped ? `Showing the first 5 of ${D.series.length + D.dropped} columns. Use "y:" to choose which.` : ""].filter(Boolean).join(" ");
  fig.innerHTML = `${cfg.title ? `<figcaption class="ch-title">${esc(cfg.title)}</figcaption>` : ""}${legend}<div class="ch-plot"></div>${note ? `<p class="ch-note">${esc(note)}</p>` : ""}${table}`;
  const plot = fig.querySelector(".ch-plot");
  plot.insertAdjacentHTML("beforeend", '<div class="ch-tip" hidden></div>');
  return plot;
}

function drawChart(fig) {
  const D = fig.__d, cfg = fig.__cfg;
  if (!D) return;
  const W = Math.max(260, Math.round(fig.clientWidth || 600)), keep = fig.querySelector("details.ch-table")?.open;
  const plot = chartFrame(fig, D, cfg);
  if (keep) fig.querySelector("details.ch-table").open = true;
  (cfg.type === "line" ? drawLine : drawBars)(fig, plot, D, cfg, W);
  fig.__w = W;
}

function drawLine(fig, plot, D, cfg, W) {
  const H = cfg.h;
  const all = D.series.flatMap(s => s.vals).filter(v => v !== null && (!cfg.log || v > 0));
  if (!all.length) { plot.innerHTML = '<p class="ch-state">There is nothing to plot in these columns.</p>'; return; }
  let ticks = cfg.log ? logTicks(Math.min(...all), Math.max(...all)) : niceTicks(Math.min(...all), Math.max(...all));
  const yf = cfg.log ? Math.log10 : v => v, lo = yf(ticks[0]), hi = yf(ticks[ticks.length - 1]);
  const labW = Math.max(...ticks.map(t => fnum(t).length)) * 6.6 + 12, L = Math.max(36, labW) + (cfg.ylabel ? 14 : 0), R = 16, T = 10, B = cfg.xlabel ? 44 : 28;
  const pw = W - L - R, ph = H - T - B, X0 = Math.min(...D.xs), X1 = Math.max(...D.xs), span = X1 - X0 || 1;
  const px = x => L + (D.numericX ? (x - X0) / span : D.xs.length > 1 ? x / (D.xs.length - 1) : 0.5) * pw;
  const py = v => T + (1 - (yf(v) - lo) / (hi - lo || 1)) * ph;
  const xt = D.numericX ? niceTicks(X0, X1, Math.max(2, Math.floor(pw / 90))).filter(v => v >= X0 - 1e-9 && v <= X1 + 1e-9) : D.xs.filter((_, i) => i % Math.ceil(D.xs.length / Math.max(2, Math.floor(pw / 90))) === 0);
  const xlab = v => D.numericX ? fnum(v) : clip(D.cats[v], 14);
  let g = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${py(t).toFixed(1)}" y2="${py(t).toFixed(1)}"/><text class="tx" x="${L - 8}" y="${(py(t) + 4).toFixed(1)}" text-anchor="end">${fnum(t)}</text>`).join("");
  g += xt.map(v => `<text class="tx" x="${px(v).toFixed(1)}" y="${H - B + 18}" text-anchor="middle">${esc(xlab(v))}</text>`).join("");
  if (cfg.xlabel) g += `<text class="tx ax" x="${L + pw / 2}" y="${H - 6}" text-anchor="middle">${esc(cfg.xlabel)}</text>`;
  if (cfg.ylabel) g += `<text class="tx ax" transform="translate(11 ${T + ph / 2}) rotate(-90)" text-anchor="middle">${esc(cfg.ylabel)}</text>`;
  const single = D.series.length === 1;
  const lines = D.series.map(s => {
    const sm = cfg.smooth ? ema(s.vals, cfg.smooth) : s.vals;
    const path = vals => { let d = "", pen = false; vals.forEach((v, i) => { if (v === null || (cfg.log && v <= 0)) { pen = false; return; } d += (pen ? "L" : "M") + px(D.xs[i]).toFixed(1) + " " + py(v).toFixed(1); pen = true; }); return d; };
    const idx = sm.reduce((a, v, i) => v === null ? a : i, -1);
    let out = "";
    if (single && !cfg.smooth) { const d = path(sm); if (d) out += `<path class="ar s${s.s + 1}" d="${d}L${px(D.xs[idx]).toFixed(1)} ${T + ph}L${px(D.xs[sm.findIndex(v => v !== null)]).toFixed(1)} ${T + ph}Z"/>`; }
    if (cfg.smooth) out += `<path class="ln raw s${s.s + 1}" d="${path(s.vals)}"/>`;
    out += `<path class="ln s${s.s + 1}" d="${path(sm)}"/>`;
    if (idx >= 0 && sm[idx] > 0 || idx >= 0 && !cfg.log) out += `<circle class="dot s${s.s + 1}" cx="${px(D.xs[idx]).toFixed(1)}" cy="${py(sm[idx]).toFixed(1)}" r="4"/>`;
    return out;
  }).join("");
  const dots = D.series.map(s => `<circle class="fd s${s.s + 1}" r="4" hidden/>`).join("");
  plot.insertAdjacentHTML("afterbegin", `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((cfg.title || "Line chart") + ". " + D.series.map(s => s.name).join(", ") + ". The table below has the numbers.")}" tabindex="0">${g}${lines}<line class="xh" y1="${T}" y2="${T + ph}" hidden/>${dots}<rect class="hit" x="${L}" y="${T}" width="${pw}" height="${ph}"/></svg>`);
  const svg = plot.querySelector("svg"), xh = svg.querySelector(".xh"), fds = [...svg.querySelectorAll(".fd")];
  const at = i => {
    const x = px(D.xs[i]);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.hidden = false;
    const rows = [];
    D.series.forEach((s, k) => { const v = s.vals[i]; if (v === null || (cfg.log && v <= 0)) { fds[k].hidden = true; return; } fds[k].setAttribute("cx", x); fds[k].setAttribute("cy", py(cfg.smooth ? ema(s.vals, cfg.smooth)[i] ?? v : v)); fds[k].hidden = false; rows.push({ s: s.s, name: s.name, v: fnum(v) }); });
    chartTip(fig, x, (D.xname ? D.xname + " " : "") + D.cats[i], rows);
    svg.dataset.i = i;
  };
  const off = () => { xh.hidden = true; fds.forEach(f => f.hidden = true); chartTipOff(fig); };
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) * (W / r.width);
    let best = 0, bd = Infinity;
    D.xs.forEach((v, i) => { const d = Math.abs(px(v) - vx); if (d < bd) { bd = d; best = i; } });
    at(best);
  });
  svg.addEventListener("pointerleave", off);
  svg.addEventListener("blur", off);
  svg.addEventListener("keydown", e => {
    if (e.key === "Escape") return off();
    const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    at(Math.min(D.xs.length - 1, Math.max(0, (+svg.dataset.i || 0) + d)));
  });
}

function drawBars(fig, plot, D, cfg, W) {
  const horiz = cfg.type === "hbar", S = D.series.length, n = D.cats.length, GAP = 2;
  const all = D.series.flatMap(s => s.vals).filter(v => v !== null);
  if (!all.length) { plot.innerHTML = '<p class="ch-state">There is nothing to plot in these columns.</p>'; return; }
  const ticks = niceTicks(Math.min(0, ...all), Math.max(0, ...all), horiz ? 4 : 5), lo = ticks[0], hi = ticks[ticks.length - 1];
  const barT = Math.min(24, 18);
  let H, L, R, T = 8, B, g = "", bars = "", hits = "";
  if (horiz) {
    const labN = Math.min(26, Math.max(...D.cats.map(c => c.length), 4)), lw = Math.min(W * 0.4, labN * 6.4 + 12);
    L = lw + 8; R = 46; B = 26;
    const rowH = Math.max(26, S * (barT + GAP) + 10); H = T + n * rowH + B;
    const pw = W - L - R, vx = v => L + (v - lo) / (hi - lo || 1) * pw, base = vx(0);
    g += ticks.map(t => `<line class="gl" x1="${vx(t).toFixed(1)}" x2="${vx(t).toFixed(1)}" y1="${T}" y2="${H - B}"/><text class="tx" x="${vx(t).toFixed(1)}" y="${H - B + 16}" text-anchor="middle">${fnum(t)}</text>`).join("");
    D.cats.forEach((c, i) => {
      const y = T + i * rowH, gh = S * barT + (S - 1) * GAP, y0 = y + (rowH - gh) / 2;
      g += `<text class="tx" x="${L - 8}" y="${(y + rowH / 2 + 4).toFixed(1)}" text-anchor="end">${esc(clip(c, labN))}</text>`;
      D.series.forEach((s, k) => {
        const v = s.vals[i]; if (v === null) return;
        const by = y0 + k * (barT + GAP);
        bars += `<path class="bar s${s.s + 1}" d="${barPathH(by, barT, base, vx(v), 4)}"/>`;
        if (S === 1 && n <= 12) bars += `<text class="vl" x="${(vx(v) + (v >= 0 ? 6 : -6)).toFixed(1)}" y="${(by + barT / 2 + 4).toFixed(1)}" text-anchor="${v >= 0 ? "start" : "end"}">${fnum(v)}</text>`;
      });
      hits += `<rect class="hit" data-i="${i}" tabindex="0" x="0" y="${y}" width="${W}" height="${rowH}"/>`;
    });
    g += `<line class="ax0" x1="${base.toFixed(1)}" x2="${base.toFixed(1)}" y1="${T}" y2="${H - B}"/>`;
  } else {
    H = cfg.h; L = Math.max(36, Math.max(...ticks.map(t => fnum(t).length)) * 6.6 + 12); R = 12; B = 30;
    const pw = W - L - R, ph = H - T - B, gw = pw / n, bw = Math.max(3, Math.min(barT, (gw * 0.8 - GAP * (S - 1)) / S));
    const vy = v => T + (1 - (v - lo) / (hi - lo || 1)) * ph, base = vy(0), step = Math.ceil(n / Math.max(1, Math.floor(pw / 70))), cap = Math.max(3, Math.floor(gw * step / 6.6));
    g += ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${vy(t).toFixed(1)}" y2="${vy(t).toFixed(1)}"/><text class="tx" x="${L - 8}" y="${(vy(t) + 4).toFixed(1)}" text-anchor="end">${fnum(t)}</text>`).join("");
    D.cats.forEach((c, i) => {
      const cx = L + gw * i + gw / 2, x0 = cx - (S * bw + (S - 1) * GAP) / 2;
      if (i % step === 0) g += `<text class="tx" x="${cx.toFixed(1)}" y="${H - B + 18}" text-anchor="middle">${esc(clip(c, cap))}</text>`;
      D.series.forEach((s, k) => {
        const v = s.vals[i]; if (v === null) return;
        const bx = x0 + k * (bw + GAP);
        bars += `<path class="bar s${s.s + 1}" d="${barPath(bx, bw, base, vy(v), 4)}"/>`;
        if (S === 1 && n <= 8) bars += `<text class="vl" x="${(bx + bw / 2).toFixed(1)}" y="${(v >= 0 ? vy(v) - 6 : vy(v) + 14).toFixed(1)}" text-anchor="middle">${fnum(v)}</text>`;
      });
      hits += `<rect class="hit" data-i="${i}" tabindex="0" x="${(L + gw * i).toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${ph}"/>`;
    });
    g += `<line class="ax0" x1="${L}" x2="${W - R}" y1="${base.toFixed(1)}" y2="${base.toFixed(1)}"/>`;
  }
  plot.insertAdjacentHTML("afterbegin", `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((cfg.title || "Bar chart") + ". The table below has the numbers.")}">${g}${bars}${hits}</svg>`);
  const svg = plot.querySelector("svg");
  const show = (el, x) => {
    const i = +el.dataset.i;
    chartTip(fig, x, D.cats[i], D.series.filter(s => s.vals[i] !== null).map(s => ({ s: s.s, name: s.name, v: fnum(s.vals[i]) })));
  };
  svg.querySelectorAll(".hit").forEach(h => {
    h.addEventListener("pointermove", e => show(h, e.clientX - svg.getBoundingClientRect().left));
    h.addEventListener("focus", () => show(h, +(h.getAttribute("x") || 0) + (+h.getAttribute("width") || 0) / 2 - (horiz ? W / 2 : 0)));
    h.addEventListener("pointerleave", () => chartTipOff(fig));
    h.addEventListener("blur", () => chartTipOff(fig));
  });
}

const csvCache = new Map();
function loadCsv(src, base) {
  const u = new URL(src, new URL(base || "./", location.href)).href;
  if (!csvCache.has(u)) csvCache.set(u, fetch(u, { signal: AbortSignal.timeout(10000) }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).catch(e => { csvCache.delete(u); throw e; }));
  return csvCache.get(u);
}

function hydrateBlocks(root) {
  for (const fig of root.querySelectorAll("figure.blk-chart:not([data-ready])")) {
    fig.setAttribute("data-ready", "1");
    (async () => {
      try {
        const cfg = JSON.parse(fig.dataset.chart);
        const text = cfg.src ? await loadCsv(cfg.src, cfg.base) : cfg.csv;
        fig.__cfg = cfg; fig.__d = chartData(parseCsv(text), cfg);
        drawChart(fig);
        if (typeof ResizeObserver === "function") {
          let t = 0;
          new ResizeObserver(() => { clearTimeout(t); t = setTimeout(() => { const w = Math.round(fig.clientWidth); if (w && Math.abs(w - (fig.__w || 0)) > 6 && fig.isConnected) drawChart(fig); }, 120); }).observe(fig);
        }
      } catch (e) {
        fig.innerHTML = `<div class="blk-err" role="note"><b>chart</b> ${esc(e.message || "could not load")}${fig.dataset.chart && /"src":"[^"]/.test(fig.dataset.chart) ? " (check the file name and that it is uploaded)" : ""}</div>`;
      }
    })();
  }
}


/* ---------- content (files in /content/) ---------- */
const CONFIG = { repo: "" };
const CONTENT = "content", BLOG = "content/blog/", STUFF = "content/stuff/", GAL = "content/gallery/", MEDIA = /\.(png|jpe?g|gif|webp|avif)$/i;
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const isDraft = p => p.split("/").some(s => s.startsWith("_"));
const lsGet = k => { try { return JSON.parse(localStorage.getItem("ser." + k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem("ser." + k, JSON.stringify(v)); } catch {} };

function repoInfo() {
  if (CONFIG.repo.includes("/")) { const [owner, repo] = CONFIG.repo.split("/"); return { owner, repo }; }
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return null;
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return { owner: m[1], repo: seg && !/\.html?$/i.test(seg) ? seg : location.hostname };
}

async function fromGithub() {
  const info = repoInfo();
  if (!info) throw new Error("not on GitHub Pages");
  const key = `tree.${info.owner}/${info.repo}`, hit = lsGet(key);
  if (hit && Date.now() - hit.t < 30e3) return hit.paths;
  let j;
  try {
    const r = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/HEAD?recursive=1`, { headers: { Accept: "application/vnd.github+json" }, signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error(r.status === 403 || r.status === 429 ? "GitHub says I've asked too many times (HTTP " + r.status + ")" : "GitHub answered HTTP " + r.status);
    j = await r.json();
  } catch (e) {
    if (hit) return hit.paths;
    throw e;
  }
  if (j.truncated) console.warn("[ser] GitHub cut the file list short; use content/index.json");
  const paths = j.tree.filter(x => x.type === "blob" && x.path.startsWith(CONTENT + "/")).map(x => x.path);
  lsSet(key, { t: Date.now(), paths });
  return paths;
}

async function fromManifest() {
  const r = await fetch(`${CONTENT}/index.json`, { signal: AbortSignal.timeout(6000) });
  if (!r.ok) throw new Error("no manifest");
  const j = await r.json(), list = Array.isArray(j) ? j : j.files;
  if (!Array.isArray(list)) throw new Error("bad manifest");
  return list.filter(x => typeof x === "string").map(x => x.replace(/^\.?\//, "")).map(x => x.startsWith(CONTENT + "/") ? x : CONTENT + "/" + x);
}

async function fromListing() {
  const out = [], queue = [CONTENT + "/"];
  for (let n = 0; queue.length && n < 400; n++) {
    const dir = queue.shift(), r = await fetch(encPath(dir.slice(0, -1)) + "/", { signal: AbortSignal.timeout(6000) });
    if (!r.ok) { if (n === 0) throw new Error("no folder listing"); continue; }
    const html = await r.text();
    if (n === 0 && !/<title>\s*Directory listing/i.test(html)) throw new Error("not a folder listing");
    for (const m of html.matchAll(/<a\s[^>]*href=["']([^"'?#]+)["']/gi)) {
      const h = m[1];
      if (h.startsWith("/") || h.startsWith("..") || /^[a-z][a-z0-9+.-]*:/i.test(h)) continue;
      const name = decodeURIComponent(h);
      (name.endsWith("/") ? queue : out).push(dir + name);
    }
  }
  return out;
}

let filesP = null;
const contentFiles = () => filesP ??= (async () => {
  const order = repoInfo() ? [fromGithub, fromManifest, fromListing] : [fromManifest, fromListing], why = [];
  for (const src of order) {
    try { const paths = await src(); console.info(`[ser] ${paths.length} content files via ${src.name}`); return { paths, ok: true, via: src.name, why }; }
    catch (e) { why.push(`${src.name.replace("from", "").toLowerCase()}: ${e.message}`); console.info(`[ser] ${src.name} skipped: ${e.message}`); }
  }
  return { paths: [], ok: false, via: "", why };
})();

const textCache = new Map();
function getText(path) {
  if (!textCache.has(path)) textCache.set(path, fetch(encPath(path), { signal: AbortSignal.timeout(10000) }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).catch(e => { textCache.delete(path); throw e; }));
  return textCache.get(path);
}

async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; try { out[k] = await fn(items[k]); } catch { out[k] = null; } }
  }));
  return out;
}

const pretty = s => s.replace(/[-_]+/g, " ").trim().replace(/^\w/, c => c.toUpperCase());
function nameInfo(slug) {
  const file = slug.split("/").pop(), m = file.match(/^(\d{4}-\d{2}-\d{2})[-_ ]*(.*)$/);
  return { date: m ? m[1] : "", title: pretty((m && m[2]) || file) };
}
const goodDate = d => /^\d{4}-\d{2}-\d{2}/.test(String(d ?? "")) && !isNaN(Date.parse(String(d).slice(0, 10))) ? String(d).slice(0, 10) : "";

function summaryOf(body) {
  for (const block of body.split(/\n\s*\n/)) {
    const lines = block.trim().split("\n");
    if (/^\s*(>|```|~~~|:::|\||-{3,}|!\[|<!--|[-*+] |\d+[.)] )/.test(lines[0])) continue;
    const t = lines.filter(l => !/^\s*#/.test(l)).join("\n").trim();
    if (!t) continue;
    const s = plain(t);
    if (s.length > 2) return s.length > 170 ? s.slice(0, 167).replace(/\s+\S*$/, "") + "…" : s;
  }
  return "";
}

const blogPaths = paths => paths.filter(p => p.startsWith(BLOG) && /\.md$/i.test(p) && !isDraft(p) && !/\/readme\.md$/i.test(p)).sort();
async function loadPost(slug) {
  const path = BLOG + slug + ".md", ni = nameInfo(slug), { meta, body: raw } = parseFront(await getText(path));
  let body = raw, h1 = null;
  const m = raw.match(/^\s*#[ \t]+(.+?)[ \t]*#*[ \t]*(?:\n|$)/);
  if (m && !meta.title) { h1 = plain(m[1]); body = raw.slice(m[0].length); }
  const base = path.slice(0, path.lastIndexOf("/") + 1);
  return {
    slug, path, base, body, folder: slug.includes("/") ? slug.slice(0, slug.lastIndexOf("/")) : "",
    title: meta.title || h1 || ni.title, date: goodDate(meta.date) || ni.date, tags: toList(meta.tags),
    cover: meta.cover ? safeUrl(meta.cover, base) : "", summary: meta.summary || meta.description || summaryOf(body),
    draft: /^(true|yes|1)$/i.test(String(meta.draft ?? "")), words: (body.match(/\S+/g) || []).length
  };
}
const byNewest = (a, b) => (b.date || "").localeCompare(a.date || "") || a.title.localeCompare(b.title, undefined, { numeric: true });

let postsP = null;
const loadPosts = () => postsP ??= (async () => {
  const { paths, ok, via, why } = await contentFiles();
  const slugs = blogPaths(paths).map(p => p.slice(BLOG.length).replace(/\.md$/i, ""));
  const list = await pool(slugs, 8, loadPost);
  return { posts: list.filter(p => p && !p.draft).sort(byNewest), ok, found: slugs.length, seen: paths.length, via, why };
})();

const galleryItems = paths => {
  const set = new Set(paths);
  return paths.filter(p => p.startsWith(GAL) && MEDIA.test(p) && !isDraft(p)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(p => {
    const rel = p.slice(GAL.length), parts = rel.split("/"), side = p.replace(/\.[^./]+$/, ".md");
    return { path: p, album: parts.length > 1 ? parts.slice(0, -1).join("/") : "", title: pretty(parts.pop().replace(/\.[^.]+$/, "")), md: set.has(side) ? side : "" };
  });
};

let stuffP = null;
const stuffPaths = paths => paths.filter(p => p.startsWith(STUFF) && /\.md$/i.test(p) && !isDraft(p) && !/\/readme\.md$/i.test(p));
const loadStuff = () => stuffP ??= (async () => {
  const { paths, ok } = await contentFiles(), list = stuffPaths(paths);
  const files = (await pool(list, 6, async p => {
    const { meta, body } = parseFront(await getText(p));
    return { path: p, base: p.slice(0, p.lastIndexOf("/") + 1), meta, body, order: parseFloat(meta.order) };
  })).filter(f => f && !/^(true|yes|1)$/i.test(String(f.meta.draft ?? "")));
  files.sort((a, b) => (isNaN(a.order) ? 1e9 : a.order) - (isNaN(b.order) ? 1e9 : b.order) || a.path.localeCompare(b.path, undefined, { numeric: true }));
  return { files, ok };

const pix = (name, small) => {
  const rows = ICONSET[small ? "i16" : "i32"][name], n = rows.length, paths = {};
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length;) {
      const c = row[x]; let w = 1;
      while (row[x + w] === c) w++;
      if (c !== ".") (paths[c] ||= []).push(`M${x} ${y}h${w}v1h-${w}z`);
      x += w;
    }
  });
  const body = Object.entries(paths).map(([c, d]) => `<path fill="${ICONSET.pal[c]}" d="${d.join("")}"/>`).join("");
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true">${body}</svg>`;
};

const slugHref = s => s.split("/").map(encodeURIComponent).join("/");

const lab = t => `<span class="label">${esc(t)}</span>`;
const dayOf = d => (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) ? time(d) : "";

const postCard = p => `

      <span class="meta">${dayOf(p.date) || "No date"}${p.folder ? " · " + esc(p.folder) : ""}</span>

const STUFF_INTRO = `<p>Here are some assets that are in here. The arts and the tracks. Although, I couldn't keep track of others, because I just found them on a random site, and they didn't really have any titles aside from "Lo-fi" 😭 But these are the other assets' sources.</p><p style="margin-block-start:.75rem">I doubt anybody would see this site, but I'm putting it here anyway since it's still public.</p>`;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
const plat = (name, url) => `<a class="plat" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(name)} (opens in a new tab)"><img src="${fav(hostOf(url))}" alt="" onerror="this.remove()"><span>${esc(name)}</span></a>`;

function creditHtml(block, base) {
  const f = {}, lines = block.split("\n"); let i = 0;
  for (; i < lines.length; i++) {
    const kv = lines[i].match(/^(title|name|by|url|link|image|license|code)\s*:\s*(.*)$/i);
    if (!kv) break;
    f[kv[1].toLowerCase()] = kv[2].trim();
  }
  const body = lines.slice(i).join("\n").trim(), url = f.url ? safeUrl(f.url, base) : "", title = f.title || f.name || hostOf(url) || "Untitled";
  const img = f.image ? safeUrl(f.image, base) : url ? fav(hostOf(url)) : "";
  const code = f.license || f.code, label = f.link || hostOf(url);
  return `<article class="cred">
    <div class="who">${img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ""}<div><h3>${esc(title)}</h3>${f.by ? `<span class="meta">${esc(f.by)}</span>` : ""}${url && !body ? plat(label, url) : ""}</div></div>
    ${body ? md(body, base) : ""}
    ${code ? `<p class="code">License code: ${esc(code)}</p>` : ""}
    ${url && body ? `<div>${plat(label, url)}</div>` : ""}
  </article>`;
}

function stuffSection(file) {
  const { meta, body } = file, out = [], cols = String(meta.columns || "");
  let prose = [], cards = [], cur = null;
  const flushProse = () => { const t = prose.join("\n").trim(); if (t) out.push(md(t, file.base)); prose = []; };
  const flushCards = () => {
    if (!cards.length) return;
    const two = cols === "2" || (cols !== "1" && !cards.some(c => c.length > 260));
    out.push(`<div class="cred-list${two ? " two" : ""}">${cards.map(c => creditHtml(c, file.base)).join("")}</div>`);
    cards = [];
  };
  for (const line of body.split("\n")) {
    if (cur === null && /^:::[ \t]*credit[ \t]*$/i.test(line)) { flushProse(); cur = []; }
    else if (cur !== null && /^:::[ \t]*$/.test(line)) { cards.push(cur.join("\n")); cur = null; }
    else if (cur !== null) cur.push(line);
    else { if (cards.length && line.trim()) flushCards(); if (!cards.length) prose.push(line); }
  }
  if (cur !== null) cards.push(cur.join("\n"));
  flushProse(); flushCards();
  return `<section class="stuff-sec">${meta.title ? `<p class="sub">${esc(meta.title)}</p>` : ""}${out.join("\n")}</section>`;
}

    el.onclick = e => { const b = e.target.closest("[data-v]"); if (b) { st[key] = b.dataset.v; st.n = PAGE; draw(); } };

      && (!t || (p.title + " " + p.summary + " " + p.tags.join(" ") + " " + p.folder).toLowerCase().includes(t)));
    pills($("#bf"), folders, st.folder, "folder", x => x + "/", "All folders");

const lb = $("#lb"), LB = { list: [], i: 0, token: 0 };
async function showLb(i) {
  const L = LB.list; if (!L.length) return;
  LB.i = (i + L.length) % L.length;
  const it = L[LB.i], t = ++LB.token, info = $("#lb-info");
  $("#lb-title").textContent = it.title;
  $("#lb-stage").innerHTML = `<img src="${esc(it.url || encPath(it.path))}" alt="${esc(it.title)}">`;
  $("#lb-count").textContent = `${LB.i + 1} / ${L.length}`;
  info.scrollTop = 0;
  info.innerHTML = `<h2>${esc(it.title)}</h2>${it.md ? '<p class="meta">Loading notes…</p>' : ""}`;
  if (!it.md) return;
  try {
    const { meta, body } = parseFront(await getText(it.md));
    if (t !== LB.token) return;
    const title = meta.title || it.title, d = goodDate(meta.date);
    const facts = [d ? fmt(d) : meta.date, meta.medium, toList(meta.tags).map(x => "#" + x).join(" ")].filter(Boolean);
    info.innerHTML = `<h2>${esc(title)}</h2>${facts.length ? `<p class="meta">${facts.map(esc).join(" · ")}</p>` : ""}<div class="md">${md(body, it.md.slice(0, it.md.lastIndexOf("/") + 1))}</div>`;
    $("#lb-title").textContent = title;
  } catch { if (t === LB.token) info.innerHTML = `<h2>${esc(it.title)}</h2>`; }
}
function openLb(i) { showLb(i); lb.showModal(); }
$("#lb-close").onclick = () => lb.close();
$("#lb-prev").onclick = () => showLb(LB.i - 1);
$("#lb-next").onclick = () => showLb(LB.i + 1);
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") showLb(LB.i - 1); if (e.key === "ArrowRight") showLb(LB.i + 1); });

  Folders or files that start with _ are drafts. Two apps with the same order are sorted by title.
*/
const APP_RESERVED = new Set(["blog", "gallery", "about", "projects", "tools", "chill-zone", "stuff-in-here", "stuff", "tools-updates", "backgrounds", "journal", "videos"]);
const LAYOUTS = ["list", "grid", "cards", "single", "models"];
const SORTS = ["date", "order", "title"];
const slugOf = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const isYes = v => /^(true|yes|1)$/i.test(String(v ?? ""));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 1e9 : n; };
const byName = (a, b) => a.localeCompare(b, undefined, { numeric: true });

function mdx(src, base) {
  BLK_STRICT = true;
  try { return md(src, base); } finally { BLK_STRICT = false; }
}

let appsP = null;
const loadApps = () => appsP ??= (async () => {
  const { paths } = await contentFiles(), problems = [];
  const files = paths.filter(p => /^content\/[^/]+\/_app\.md$/i.test(p) && !p.split("/")[1].startsWith("_")).sort(byName);
  const read = await pool(files, 6, async p => ({ p, ...parseFront(await getText(p)) }));
  const apps = [], seen = new Set();
  for (const f of read) {
    if (!f) continue;
    const folder = f.p.split("/")[1], id = slugOf(folder), probs = [], meta = f.meta, base = `${CONTENT}/${folder}/`;
    if (!id) continue;
    if (APP_RESERVED.has(id)) { problems.push(`"${folder}" is a name the site already uses, so rename the folder`); continue; }
    if (seen.has(id)) { problems.push(`two folders both become "${id}", so I skipped "${folder}"`); continue; }
    seen.add(id);
    const layout = String(meta.layout || "list").toLowerCase(), sort = String(meta.sort || "date").toLowerCase();
    if (meta.layout && !LAYOUTS.includes(layout)) probs.push(`layout "${meta.layout}" isn't one of ${LAYOUTS.join(", ")}, so I used list`);
    if (meta.sort && !SORTS.includes(sort)) probs.push(`sort "${meta.sort}" isn't one of ${SORTS.join(", ")}, so I used date`);
    const iconName = String(meta.icon || "").trim();
    let icon = "folder", img = "";
    if (ICONSET.i32[iconName]) icon = iconName;
    else if (iconName && /\.(png|jpe?g|gif|webp|svg|avif)$/i.test(iconName) && paths.includes(base + iconName)) img = base + iconName;
    else if (iconName) probs.push(`icon "${iconName}" isn't a built-in icon (${Object.keys(ICONSET.i32).join(", ")}) or an image in the folder, so I used the folder icon`);
    apps.push({
      id, name: meta.title || pretty(folder), href: "#/" + id, icon, img, dyn: true, folder, base,
      layout: LAYOUTS.includes(layout) ? layout : "list", sort: SORTS.includes(sort) ? sort : "date",
      order: num(meta.order), hidden: isYes(meta.hidden), desc: meta.description || "", intro: f.body.trim(), problems: probs
    });
  }
  apps.sort((a, b) => a.order - b.order || byName(a.name, b.name));
  for (const a of apps) for (const p of a.problems) console.warn(`[ser] ${a.folder}/_app.md: ${p}`);
  for (const p of problems) console.warn("[ser] " + p);
  return { apps, problems };
})();

function makeEntry(app, p, text) {
  const rel = p.slice(app.base.length).replace(/\.md$/i, ""), ni = nameInfo(rel), { meta, body: all } = parseFront(text);
  let body = all, h1 = null;
  const m = all.match(/^\s*#[ \t]+(.+?)[ \t]*#*[ \t]*(?:\n|$)/);
  if (m && (!meta.title || plain(m[1]).toLowerCase() === String(meta.title).toLowerCase())) { h1 = plain(m[1]); body = all.slice(m[0].length); }
  const base = p.slice(0, p.lastIndexOf("/") + 1);
  return {
    path: p, base, rel, slug: rel.split("/").map(slugOf).join("/").replace(/\/index$/, ""), meta, body, order: num(meta.order),
    title: meta.title || h1 || ni.title, date: goodDate(meta.date) || ni.date, tags: toList(meta.tags),
    summary: meta.summary || meta.description || summaryOf(body), cover: meta.cover ? safeUrl(meta.cover, base) : "", draft: isYes(meta.draft)
  };
}

const loadEntries = app => app.entriesP ??= (async () => {
  const { paths } = await contentFiles(), problems = [];
  const list = paths.filter(p => {
    const rel = p.slice(app.base.length);
    return p.startsWith(app.base) && /\.md$/i.test(p) && !isDraft(rel) && !/(^|\/)readme\.md$/i.test(rel);
  }).sort(byName);
  const raw = await pool(list, 8, async p => makeEntry(app, p, await getText(p)));
  const seen = new Set(), entries = [];
  for (const e of raw) {
    if (!e || e.draft) continue;
    if (seen.has(e.slug)) { problems.push(`two pages both become "${e.slug}", so I skipped ${e.path}`); continue; }
    seen.add(e.slug); entries.push(e);
  }
  const cmp = { date: byNewest, order: (a, b) => a.order - b.order || byName(a.title, b.title), title: (a, b) => byName(a.title, b.title) }[app.sort];
  entries.sort(cmp);
  for (const p of problems) console.warn("[ser] " + p);
  return { entries, problems };
})();

const problemsHtml = list => list.length ? `<details class="blk-problems"><summary>${list.length} thing${list.length === 1 ? "" : "s"} to fix in this page type</summary><ul>${list.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>` : "";
const entryHref = (app, e) => `#/${app.id}/${slugHref(e.slug)}`;
const iconOf = (a, small) => a.img ? `<img class="ico-img" src="${esc(encPath(a.img))}" alt="" onerror="this.remove()">` : pix(a.icon, small);
const nice = s => s ? pretty(String(s)) : "";

const HF = "https://huggingface.co/";
const hfId = v => /^[\w.-]+\/[\w.-]+$/.test(String(v ?? "").trim()) ? String(v).trim() : "";
const linkOut = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;

function modelHtml(app, e) {
  const m = e.meta, id = hfId(m.hf || m.repo), langs = toList(m.language), sets = toList(m.datasets), metrics = toList(m.metrics);
  const tags = e.tags.filter(t => t !== m.pipeline_tag);
  const extra = [["github", "Code"], ["paper", "Paper"], ["demo", "Demo"], ["website", "Website"]].map(([k, t]) => { const u = m[k] ? safeUrl(m[k], e.base) : ""; return u ? `<a class="btn alt" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t} ↗</a>` : ""; }).join("");
  const facts = [
    ["Task", nice(m.pipeline_tag)], ["Library", m.library_name], ["Parameters", m.params], ["Version", m.version],
    ["License", m.license], ["Language", langs.join(", ")], ["Released", e.date ? time(e.date) : ""]
  ].filter(f => f[1]);
  const base = m.base_model ? hfLink("models", String(m.base_model)) : "";
  const chips = [nice(m.pipeline_tag), m.library_name, m.params, m.license].filter(Boolean);
  const side = `<aside class="model-side" aria-label="Model details">
    <section><h2>Details</h2><dl>${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${String(v).startsWith("<time") ? v : esc(v)}</dd></div>`).join("")}${base ? `<div><dt>Base model</dt><dd>${base}</dd></div>` : ""}</dl></section>

    ${sets.length ? `<section><h2>Datasets</h2><ul class="plain">${sets.map(s => `<li>${hfLink("datasets", s)}</li>`).join("")}</ul></section>` : ""}
    ${metrics.length ? `<section><h2>Metrics</h2>${chipsOf(metrics)}</section>` : ""}
    ${tags.length ? `<section><h2>Tags</h2>${chipsOf(tags)}</section>` : ""}
  </aside>`;
  return `<article class="model">
    <header class="model-head">
      <a class="back" href="#/${app.id}">← ${esc(app.name)}</a>
      <h1>${esc(e.title)}</h1>
      ${id ? `<p class="model-id"><code>${esc(id)}</code><button type="button" class="copy" data-copy="${esc(id)}" aria-label="Copy ${esc(id)}">Copy</button></p>` : ""}
      ${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}
      <div class="btn-row">${id ? `<a class="btn" href="${HF + esc(id)}" target="_blank" rel="noopener noreferrer">Open on Hugging Face ↗</a>` : ""}${extra}</div>
    </header>
    ${e.cover ? `<span class="art cover raised"><img src="${esc(e.cover)}" alt="" onerror="this.parentNode.remove()"></span>` : ""}
    <div class="model-grid"><div class="model-card md">${mdx(e.body, e.base)}</div>${side}</div>
  </article>`;
}

function entryHtml(app, e) {
  if (app.layout === "models") return modelHtml(app, e);
  return `<article>
    <header class="article-head">
      <a class="back" href="#/${app.id}">← ${esc(app.name)}</a>
      <h1>${esc(e.title)}</h1>

    </header>

    <div class="md">${mdx(e.body, e.base)}</div>
  </article>`;
}

const hfStats = new Map();
async function fillHfStats(id, stale) {
  const box = $("#hfstats"); if (!box || !id) return;
  try {
    if (!hfStats.has(id)) hfStats.set(id, fetch(`https://huggingface.co/api/models/${id}`, { signal: AbortSignal.timeout(6000) }).then(r => { if (!r.ok) throw new Error(); return r.json(); }));
    const j = await hfStats.get(id);
    if (stale() || !box.isConnected) return;
    const rows = [["Downloads (30 days)", j.downloads], ["Likes", j.likes]].filter(r => Number.isFinite(r[1]));
    if (!rows.length) return;
    const dl = box.querySelector("dl");
    for (const [k, v] of rows) {
      const d = document.createElement("div"), a = document.createElement("dt"), b = document.createElement("dd");
      a.textContent = k; b.textContent = v.toLocaleString("en-US"); d.append(a, b); dl.append(d);
    }
    box.hidden = false;
  } catch { hfStats.delete(id); }
}

  const slot = $("#slot"), app = apps.find(a => a.id === id);

  paintAppIcon(app);

  if (stale()) return;
  const all = [...app.problems, ...problems];
  document.title = `${app.name} — ${site.title}`;

  if (app.layout === "single" && !rest) {
    const e = entries.find(x => x.slug === "index") || entries[0];
    setTitle(app.name); setStatus("");
    slot.innerHTML = e ? problemsHtml(all) + entryHtml({ ...app, layout: "list" }, e).replace(/<a class="back"[^>]*>.*?<\/a>/, "") : `<div class="empty"><b>There's nothing in ${esc(app.name)} yet.</b></div>`;
    return;
  }
  if (rest) {
    const e = entries.find(x => x.slug === rest.split("/").map(slugOf).join("/"));
    if (!e) { setTitle(app.name); slot.innerHTML = `<div class="empty"><b>I can't find that page in ${esc(app.name)}.</b><br><a href="#/${app.id}">Back to ${esc(app.name)}</a></div>`; return; }
    setTitle(e.title); setStatus(app.layout === "models" ? "Model" : `${(e.body.match(/\S+/g) || []).length} words`);
    document.title = `${e.title} — ${site.title}`;
    slot.innerHTML = problemsHtml(all) + entryHtml(app, e);
    const copy = slot.querySelector("[data-copy]");
    if (copy) copy.onclick = async () => { try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy"; }, 1500); } catch { copy.textContent = "Select it instead"; } };
    if (app.layout === "models") fillHfStats(hfId(e.meta.hf || e.meta.repo), stale);
    return;
  }
  setTitle(app.name);
  setStatus(`${entries.length} page${entries.length === 1 ? "" : "s"}`);
  slot.innerHTML = pgHead(lab(app.name), esc(app.name), app.intro ? `<div class="md">${mdx(app.intro, app.base)}</div>` : "") + problemsHtml(all) + (entries.length ? LISTINGS[app.layout === "single" ? "list" : app.layout](app, entries) : `<div class="empty"><b>There's nothing in ${esc(app.name)} yet.</b></div>`);
}

/* ---------- admin: add pages, page types and files, then publish them in one commit ---------- */
/*
  Everything here talks to GitHub with a fine-grained token that is saved in this browser only.
  The admin can only touch content/ and .nojekyll, so a slip can't break index.html.
*/
const TOKEN_KEY = "ser.admin.token", REPO_KEY = "admin.repo";
const tokGet = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } };
const tokSet = t => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} };
const MAX_UPLOAD = 20 * 1024 * 1024;
const TOKEN_URL = "https://github.com/settings/personal-access-tokens/new";
const todayIso = () => new Date().toISOString().slice(0, 10);

APPS.push({ id: "admin", name: "Admin", href: "#/admin", icon: "key", hidden: !tokGet() });

/* ---- bytes and text ---- */
const toB64 = buf => {
  const a = new Uint8Array(buf); let s = "";
  for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
  return btoa(s);
};
const fromB64 = s => { const bin = atob(s.replace(/\s/g, "")), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
const kindOf = p => /\.(md|markdown)$/i.test(p) ? "md" : /\.(csv|txt|json|ya?ml)$/i.test(p) ? "text" : /\.(png|jpe?g|gif|webp|avif|svg)$/i.test(p) ? "img" : "file";
const fileName = p => p.split("/").pop();
const dirOf = p => p.slice(0, p.lastIndexOf("/"));
const cleanName = n => n.normalize("NFKD").replace(/[^\w.\- ]+/g, "").trim().replace(/\s+/g, "-").replace(/^\.+/, "") || "file";
const sizeText = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";

/* ---- GitHub ---- */
class GhError extends Error { constructor(msg, status) { super(msg); this.status = status; } }
const ghWhy = (status, msg = "") => {
  if (status === 401) return "GitHub didn't accept the token. It may be wrong, expired or revoked. Make a new one and paste it again.";
  if (status === 403) return /rate limit/i.test(msg) ? "GitHub says I've asked too many times. Wait a minute and try again." : "GitHub refused. The token needs “Contents: Read and write” on this repo.";
  if (status === 404) return "GitHub can't find that repo with this token. Check the repo name, and that the token was made for this repo.";
  if (status === 409 || status === 422 && /fast.?forward|reference/i.test(msg)) return "GitHub has newer changes than the ones I loaded. Press Reload, then publish again. Your edits are kept.";
  if (status === 422) return "GitHub refused the change: " + (msg || "unknown reason");
  return `GitHub answered HTTP ${status}${msg ? ": " + msg : ""}`;
};
async function gh(path, { method = "GET", body } = {}) {
  let r;
  try {
    r = await fetch("https://api.github.com" + path, {
      method, signal: AbortSignal.timeout(60000), body: body ? JSON.stringify(body) : undefined,
      headers: { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", Authorization: "Bearer " + tokGet(), ...(body ? { "Content-Type": "application/json" } : {}) }
    });
  } catch { throw new GhError("I couldn't reach GitHub. Check your connection and try again."); }
  if (r.ok) return r.status === 204 ? null : r.json();
  const j = await r.json().catch(() => ({}));
  throw new GhError(ghWhy(r.status, j.message), r.status);
}

/* ---- state ---- */
const A = { repo: null, head: "", tree: new Map(), pend: new Map(), blobs: new Map(), urls: new Map(), open: "", cwd: "content", mode: "edit", collapsed: new Set(), screen: "list", note: null, csvKeys: new Set() };
const rp = () => `/repos/${A.repo.owner}/${A.repo.repo}`;
const draftKey = () => "admin.drafts." + A.repo.owner + "/" + A.repo.repo;
const allowed = p => /^content\/[^/].*[^/]$/.test(p) && !p.includes("..") && !p.includes("//") || p === ".nojekyll";

function merged() {
  const m = new Map();
  for (const [p, f] of A.tree) m.set(p, { path: p, size: f.size, sha: f.sha, state: "" });
  for (const [p, c] of A.pend) {
    if (c.op === "del") m.delete(p);
    else m.set(p, { path: p, size: c.size ?? A.tree.get(p)?.size ?? 0, sha: c.sha || A.tree.get(p)?.sha, state: A.tree.has(p) && !c.sha ? "edit" : "new" });
  }
  return m;
}

let saveT = 0;
function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    if (!A.repo) return;
    const out = {};
    for (const [p, c] of A.pend) {
      if (c.op === "del") out[p] = { op: "del" };
      else if (c.text != null) out[p] = { op: "put", text: c.text, size: c.size };
      else if (c.sha) out[p] = { op: "put", sha: c.sha, size: c.size };
    }
    lsSet(draftKey(), out);
  }, 350);
}
function restoreDrafts() {
  const d = lsGet(draftKey()) || {};
  for (const [p, c] of Object.entries(d)) if (allowed(p) && (c.op === "del" ? A.tree.has(p) : true)) A.pend.set(p, c);
}

async function origText(sha) {
  if (!A.blobs.has(sha)) { const j = await gh(`${rp()}/git/blobs/${sha}`); A.blobs.set(sha, new TextDecoder().decode(fromB64(j.content))); }
  return A.blobs.get(sha);
}
async function readFile(path) {
  const p = A.pend.get(path);
  if (p?.op === "put" && p.text != null) return p.text;
  const sha = p?.sha || A.tree.get(path)?.sha;
  return sha ? origText(sha) : "";
}
async function imageUrl(path) {
  const p = A.pend.get(path);
  if (p?.blobUrl) return p.blobUrl;
  const sha = p?.sha || A.tree.get(path)?.sha;
  if (!sha) return "";
  if (!A.urls.has(sha)) {
    const j = await gh(`${rp()}/git/blobs/${sha}`), type = /\.svg$/i.test(path) ? "image/svg+xml" : "image/" + (path.match(/\.(\w+)$/)?.[1] || "png").toLowerCase().replace("jpg", "jpeg");
    A.urls.set(sha, URL.createObjectURL(new Blob([fromB64(j.content)], { type })));
  }
  return A.urls.get(sha);
}

/* ---- changes ---- */
function setText(path, text) {
  const f = A.tree.get(path), orig = f ? A.blobs.get(f.sha) : undefined;
  if (f && orig === text) A.pend.delete(path);
  else A.pend.set(path, { op: "put", text, size: new Blob([text]).size });
  persist();
}
const stagePut = (path, c) => { A.pend.set(path, { op: "put", ...c }); persist(); };
function stageDel(path) {
  if (A.tree.has(path)) A.pend.set(path, { op: "del" }); else A.pend.delete(path);
  if (A.open === path) A.open = "";
  persist();
}
function stageDelDir(prefix) { for (const p of merged().keys()) if (p.startsWith(prefix + "/")) stageDel(p); }
function stageMove(from, to) {
  const m = merged(), cur = A.pend.get(from), base = A.tree.get(from);
  if (m.has(to)) throw new Error(`"${to}" already exists`);
  if (cur?.op === "put") A.pend.set(to, { ...cur }); else A.pend.set(to, { op: "put", sha: base.sha, size: base.size });
  if (base) A.pend.set(from, { op: "del" }); else A.pend.delete(from);
  if (A.open === from) A.open = to;
  persist();
}
const uniquePath = (dir, name) => {
  const m = merged(); let p = `${dir}/${name}`, n = 2;
  const [stem, ext] = name.match(/^(.*?)(\.[^.]*)?$/).slice(1);
  while (m.has(p)) p = `${dir}/${stem}-${n++}${ext || ""}`;
  return p;
};

async function loadTree() {
  const ref = await gh(`${rp()}/git/ref/heads/${A.repo.branch}`);
  const t = await gh(`${rp()}/git/trees/${ref.object.sha}?recursive=1`);
  A.head = ref.object.sha;
  A.truncated = !!t.truncated;
  A.tree = new Map(t.tree.filter(x => x.type === "blob" && (x.path.startsWith("content/") || x.path === ".nojekyll")).map(x => [x.path, { sha: x.sha, size: x.size ?? 0 }]));
}

async function connect(repoStr, token) {
  const m = repoStr.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/i, "").match(/^([\w.-]+)\/([\w.-]+)$/);
  if (!m) throw new GhError("The repo should look like owner/name, for example raagassteven6-max/ser.");
  if (token) tokSet(token.trim());
  if (!tokGet()) throw new GhError("Paste your token first.");
  try {
    const r = await gh(`/repos/${m[1]}/${m[2]}`);
    if (!r.permissions?.push) throw new GhError("This token can read the repo but not change it. Give it “Contents: Read and write”.");
    A.repo = { owner: m[1], repo: m[2], branch: r.default_branch };
    await loadTree();
  } catch (e) { if (e.status === 401) tokSet(""); A.repo = null; throw e; }
  lsSet(REPO_KEY, `${m[1]}/${m[2]}`);
  A.pend = new Map(); restoreDrafts();
  const me = APPS.find(a => a.id === "admin"); if (me && me.hidden) { me.hidden = false; paintApps(); }
}

function disconnect() {
  tokSet(""); A.repo = null; A.pend = new Map(); A.tree = new Map(); A.open = "";
  const me = APPS.find(a => a.id === "admin"); if (me) { me.hidden = true; paintApps(); }
}

async function publish(message, onStep) {
  const base = rp(), branch = A.repo.branch;
  onStep("Checking GitHub for newer changes…");
  const ref = await gh(`${base}/git/ref/heads/${branch}`);
  if (ref.object.sha !== A.head) throw new GhError(ghWhy(409));
  const parent = await gh(`${base}/git/commits/${ref.object.sha}`);
  const entries = [], jobs = [...A.pend].filter(([p]) => allowed(p));
  let n = 0;
  for (const [path, c] of jobs) {
    if (c.op === "del") { entries.push({ path, mode: "100644", type: "blob", sha: null }); continue; }
    onStep(`Uploading ${++n} of ${jobs.length}: ${fileName(path)}`);
    let sha = c.sha;
    if (!sha) sha = (await gh(`${base}/git/blobs`, { method: "POST", body: c.text != null ? { content: c.text, encoding: "utf-8" } : { content: c.b64, encoding: "base64" } })).sha;
    entries.push({ path, mode: "100644", type: "blob", sha });
  }
  onStep("Writing the commit…");
  const tree = await gh(`${base}/git/trees`, { method: "POST", body: { base_tree: parent.tree.sha, tree: entries } });
  const commit = await gh(`${base}/git/commits`, { method: "POST", body: { message, tree: tree.sha, parents: [ref.object.sha] } });
  await gh(`${base}/git/refs/heads/${branch}`, { method: "PATCH", body: { sha: commit.sha, force: false } });
  A.pend = new Map(); persist(); lsSet(draftKey(), {});
  await loadTree();
  return commit.sha;
}

function buildBlock(name, vals, body) {
  const spec = BLOCKS[name], out = [`::: ${name}`];
  for (const k of Object.keys(spec.keys)) {
    const v = (vals[k] || "").trim();
    if (!v) continue;
    if (spec.keys[k] === "list") { const items = toArr(v); out.push(`${k}: ${items[0]}`); for (const it of items.slice(1)) out.push(`  ${it}`); }
    else out.push(`${k}: ${v.replace(/\s*\n\s*/g, " ")}`);
  }
  if (body.trim()) out.push("", body.trim());
  out.push(":::");
  return out.join("\n");
}

/* ---- app context for previews ---- */
async function appFor(path) {
  const folder = path.split("/")[1], appPath = `content/${folder}/_app.md`, base = `content/${folder}/`;
  const app = { id: slugOf(folder), name: pretty(folder), layout: "list", sort: "date", base, isApp: false };
  if (folder === "projects") return { ...app, layout: "projects", name: "Projects" };
  if (merged().has(appPath)) {
    const { meta } = parseFront(await readFile(appPath)), layout = String(meta.layout || "list").toLowerCase();
    Object.assign(app, { isApp: true, name: meta.title || pretty(folder), layout: LAYOUTS.includes(layout) ? layout : "list" });
  }
  return app;
}

async function previewHtml(path, text) {
  const app = await appFor(path);
  if (app.layout === "projects" && !/(^|\/)_app\.md$/i.test(path)) return projectHtml(projectOf(makeEntry(PROJECTS, path, text))).replace(/<a class="back"[^>]*>.*?<\/a>/, "");
  if (/(^|\/)_app\.md$/i.test(path)) {
    const { meta, body } = parseFront(text);
    return pgHead(lab(meta.title || app.name), esc(meta.title || app.name), body.trim() ? `<div class="md">${mdx(body, app.base)}</div>` : "") + `<p class="meta">This is the intro that shows above the list of pages. Layout: ${esc(meta.layout || "list")}.</p>`;
  }
  const e = makeEntry(app, path, text);
  if (app.isApp) return entryHtml(app, e).replace(/<a class="back"[^>]*>.*?<\/a>/, "");
  return `<article><header class="article-head"><h1>${esc(e.title)}</h1>${e.date ? `<p class="meta">${dayOf(e.date)}</p>` : ""}</header><div class="md">${md(e.body, e.base)}</div></article>`;
}

function useUnpublished(root) {
  const urls = new Map();
  A.csvKeys.forEach(k => csvCache.delete(k)); A.csvKeys.clear();
  for (const [p, c] of A.pend) {
    if (c.op !== "put") continue;
    const href = new URL(encPath(p), location.href).href;
    if (c.blobUrl) urls.set(href, c.blobUrl);
    if (c.text != null && /\.csv$/i.test(p)) { csvCache.set(href, Promise.resolve(c.text)); A.csvKeys.add(href); }
  }
  root.querySelectorAll("img[src]").forEach(i => { const u = urls.get(new URL(i.getAttribute("src"), location.href).href); if (u) i.src = u; });
  root.querySelectorAll("[data-lb]").forEach(b => { const u = urls.get(b.dataset.lb); if (u) b.dataset.lb = u; });
}

const $a = (s, r = document) => r.querySelector(s);
function ask({ title, html, ok = "OK", danger = false, check, setup }) {
  return new Promise(res => {
    const d = document.createElement("dialog"); d.className = "adm-dlg";
    d.innerHTML = `<form method="dialog" novalidate><h2>${esc(title)}</h2><div class="dlg-body">${html}</div><p class="dlg-err" role="alert" hidden></p><div class="dlg-act"><button type="button" data-x>Cancel</button><button type="submit" class="${danger ? "danger" : "primary"}">${esc(ok)}</button></div></form>`;
    const form = $a("form", d), err = $a(".dlg-err", d), go = $a('[type="submit"]', d);
    const done = v => { try { d.close(); } catch {} d.remove(); res(v); };
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const fd = new FormData(form); go.disabled = true;
      const msg = check ? await check(fd, form) : "";
      go.disabled = false;
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      done(fd);
    });
    $a("[data-x]", d).onclick = () => done(null);
    d.addEventListener("cancel", e => { e.preventDefault(); done(null); });
    document.body.append(d); d.showModal();
    if (setup) setup(form, d);
    (form.querySelector("input:not([type=file]), select, textarea") || go).focus();
  });
}

function paintTree() {

  const m = merged(), top = { dirs: new Map(), files: [] };
  for (const p of [...m.keys()].filter(p => p.startsWith("content/")).sort(byName)) {
    let node = top; const parts = p.slice(8).split("/");
    parts.slice(0, -1).forEach((d, i) => { const key = parts.slice(0, i + 1).join("/"); if (!node.dirs.has(d)) node.dirs.set(d, { key, dirs: new Map(), files: [] }); node = node.dirs.get(d); });
    node.files.push(m.get(p));
  }
  const KIND = { md: "MD", text: "TXT", img: "IMG", file: "FILE" };

function setFront(text, key, value) {
  const m = text.match(/^---[ \t]*\n([\s\S]*?)\n?---[ \t]*(?:\n|$)/), line = value === "" ? [] : [`${key}: ${value}`];
  if (!m) return line.length ? `---\n${line[0]}\n---\n\n${text}` : text;
  const lines = m[1] === "" ? [] : m[1].split("\n"), at = lines.findIndex(l => new RegExp(`^${key}\\s*:`, "i").test(l));
  if (at < 0) lines.push(...line);
  else { let end = at + 1; while (end < lines.length && /^(?: {1,2}-[ \t]|\s+\S)/.test(lines[end])) end++; lines.splice(at, end - at, ...line); }
  return `---\n${lines.join("\n")}${lines.length ? "\n" : ""}---\n` + text.slice(m[0].length);
}

function format(ta, f) {
  const a = ta.selectionStart, b = ta.selectionEnd, sel = ta.value.slice(a, b);
  const wrap = (l, r, ph) => { ta.setRangeText(l + (sel || ph) + r, a, b, "select"); ta.setSelectionRange(a + l.length, a + l.length + (sel || ph).length); };
  const lines = p => { const s = ta.value.lastIndexOf("\n", a - 1) + 1, e = b === a ? ta.value.indexOf("\n", a) : b, end = e < 0 ? ta.value.length : e, chunk = ta.value.slice(s, end); ta.setRangeText(chunk.split("\n").map((l, i) => typeof p === "function" ? p(i) + l : p + l).join("\n"), s, end, "end"); };
  if (f === "bold") wrap("**", "**", "bold");
  else if (f === "italic") wrap("*", "*", "italic");
  else if (f === "link") { wrap("[", "](https://)", "link text"); }
  else if (f === "h2") lines("## ");
  else if (f === "list") lines("- ");
  else if (f === "quote") lines("> ");

}

function insertBlockText(ta, text) {

}

async function uploadFiles(files, dir) {
  const added = [], skipped = [];
  for (const f of files) {
    if (f.size > MAX_UPLOAD) { skipped.push(`${f.name} is over ${sizeText(MAX_UPLOAD)}`); continue; }
    const path = uniquePath(dir, cleanName(f.name));
    if (!allowed(path)) { skipped.push(f.name); continue; }
    const buf = await f.arrayBuffer(), isText = /\.(csv|txt|json|ya?ml)$/i.test(f.name);
    if (isText) { const text = new TextDecoder().decode(buf); stagePut(path, { text, size: f.size }); }
    else stagePut(path, { b64: toB64(buf), size: f.size, blobUrl: URL.createObjectURL(new Blob([buf], { type: f.type || "application/octet-stream" })) });
    added.push(fileName(path));
  }
  paintTree(); paintBar(); paintFiles();
  const bits = [];
  if (added.length) bits.push(`Added ${added.length === 1 ? added[0] : added.length + " files"} to ${dir.replace(/^content\/?/, "") || "content"}. They go live when I publish.`);
  if (skipped.length) bits.push("Skipped: " + skipped.join("; ") + ".");
  if (bits.length) note(bits.join(" "), skipped.length && !added.length ? "err" : "ok");
}

const desk = $("#desk"), win = $("#win"), main = $("#main"), icons = $("#icons"), smenu = $("#smenu"), startBtn = $("#start"), tk = $("#tk");
const wide = matchMedia("(min-width: 48rem)");
const fitText = () => { document.documentElement.style.fontSize = screen.width < 700 && innerWidth >= 700 ? Math.round(Math.min(1.9, innerWidth / 640) * 100) + "%" : ""; };
fitText(); addEventListener("resize", fitText);
const ws = { max: zs.get("win.max", false), placed: false, min: false, forceMax: false };
const appOf = key => APPS.find(a => a.id === key);

const paintApps = () => {
  const shown = APPS.filter(a => !a.hidden);
  icons.innerHTML = shown.map(a => `<a class="icon" href="${a.href}" role="listitem" aria-selected="false" data-app="${a.id}">${iconOf(a)}<span>${esc(a.name)}</span></a>`).join("");
  $("#sitems").innerHTML = shown.map(a => `<a href="${a.href}">${iconOf(a, true)}<span>${esc(a.name)}</span></a>`).join("") + `<hr><a href="#/"><span>Show desktop</span></a>`;
};
paintApps();

let lastPtr = "mouse";
icons.addEventListener("pointerdown", e => { lastPtr = e.pointerType; });
icons.addEventListener("click", e => {
  const a = e.target.closest(".icon"); if (!a) return;
  if (lastPtr === "mouse" && e.detail === 1) e.preventDefault();
  icons.querySelectorAll(".icon").forEach(x => x.setAttribute("aria-selected", x === a));
});
desk.addEventListener("click", e => { if (!e.target.closest(".icon")) icons.querySelectorAll(".icon").forEach(x => x.setAttribute("aria-selected", "false")); });

function placeWin() {
  const W = desk.clientWidth, H = desk.clientHeight, w = win.offsetWidth, h = win.offsetHeight;
  const x = ws.placed ? win.offsetLeft : (W - w) / 2, y = ws.placed ? win.offsetTop : Math.max(8, (H - h) / 2 - 8);
  win.style.left = Math.min(Math.max(-w + 90, x), W - 90) + "px";
  win.style.top = Math.min(Math.max(0, y), H - 34) + "px";
  ws.placed = true;
}

function paintWin() {
  const max = ws.forceMax || ws.max;
  win.toggleAttribute("data-max", max);
  const mb = win.querySelector('[data-act="max"]');
  mb.hidden = ws.forceMax;
  mb.textContent = max ? "❐" : "□";
  mb.setAttribute("aria-label", max ? "Restore window size" : "Maximize window");
  tk.setAttribute("aria-pressed", String(!ws.min));
  win.hidden = ws.min;
  if (zen.ui) zen.ui.hidden = ws.min;
  if (!max && wide.matches) placeWin();
}

win.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "close") location.hash = "#/";
  else if (act === "min") { ws.min = true; paintWin(); startBtn.focus(); }
  else if (act === "max") { ws.max = !ws.max; zs.set("win.max", ws.max); paintWin(); }
});
$("#tbar").addEventListener("dblclick", e => { if (!e.target.closest("button") && !ws.forceMax && wide.matches) { ws.max = !ws.max; zs.set("win.max", ws.max); paintWin(); } });
tk.onclick = () => { ws.min = !ws.min; paintWin(); if (!ws.min) main.focus({ preventScroll: true }); };

(function dragWin() {
  const bar = $("#tbar"); let d = null;
  bar.addEventListener("pointerdown", e => {
    if (e.button > 0 || e.target.closest("button") || win.hasAttribute("data-max") || !wide.matches) return;
    d = { sx: e.clientX, sy: e.clientY, ox: win.offsetLeft, oy: win.offsetTop };
    try { bar.setPointerCapture(e.pointerId); } catch {}
    win.classList.add("busy");
  });
  bar.addEventListener("pointermove", e => {
    if (!d) return;
    const W = desk.clientWidth, H = desk.clientHeight, w = win.offsetWidth;
    win.style.left = Math.min(Math.max(-w + 90, d.ox + e.clientX - d.sx), W - 90) + "px";
    win.style.top = Math.min(Math.max(0, d.oy + e.clientY - d.sy), H - 34) + "px";
  });
  const end = e => { if (!d) return; d = null; win.classList.remove("busy"); try { bar.releasePointerCapture(e.pointerId); } catch {} };
  bar.addEventListener("pointerup", end); bar.addEventListener("pointercancel", end);
})();
addEventListener("resize", () => { if (!win.hidden && !win.hasAttribute("data-max") && wide.matches) placeWin(); });

const closeMenu = () => { smenu.hidden = true; startBtn.setAttribute("aria-expanded", "false"); };
startBtn.onclick = () => { const open = smenu.hidden; smenu.hidden = !open; startBtn.setAttribute("aria-expanded", String(open)); if (open) smenu.querySelector("a").focus(); };
smenu.addEventListener("click", e => { if (e.target.closest("a")) closeMenu(); });
document.addEventListener("pointerdown", e => { if (!smenu.hidden && !e.target.closest("#smenu, #start")) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !smenu.hidden) { closeMenu(); startBtn.focus(); } });

const clock = $("#clock");
const tick = () => { clock.textContent = new Date().toLocaleString("en-PH", { hour: "numeric", minute: "2-digit", month: "short", day: "numeric" }); };
tick(); setInterval(tick, 15000);

const setTitle = t => { $("#ttl").textContent = t; $("#tk-t").textContent = t; };
const setStatus = t => { $("#stat-l").textContent = t || ""; };
const setPath = p => { $("#addr").textContent = "C:\\SER" + (p ? "\\" + p.split("/").join("\\") : ""); };

let RID = 0;
function route() {
  const parts = (location.hash.slice(1) || "/").split("/").filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch { return s; } });
  const [a, b, c] = parts, rest = parts.slice(1).join("/");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  zenLeave();
  const rid = ++RID, stale = () => rid !== RID;

  if (a === "journal") { location.replace("#/blog" + (rest ? "/" + slugHref(rest) : "")); return; }
  if (a === "videos") { location.replace("#/"); return; }

  let v = null;
  if (!a) v = null;
  else if (a === "blog") v = rest ? views.post(rest) : views.blog();
  else if (a === "gallery") v = views.gallery();
  else if (a === "about") v = views.about();
  else if (a === "projects") v = rest ? views.project(rest) : views.projects();
  else if (a === "stuff-in-here") v = views.stuff();
  else if (a === "tools") v = !b ? views.tools() : !c ? views.toolSet(b) : views.tool(b, c);
  else if (a === "chill-zone") v = !b ? views.chill() : b === "game-zone" ? (c ? views.game(c) : views.gameZone()) : b === "zen-corner" ? views.zen() : views.missing();
  else if (a === "admin") v = views.admin();
  else v = views.page(a, rest);

  const key = !a ? "home" : a === "chill-zone" ? (b === "game-zone" ? "game-zone" : b === "zen-corner" ? "zen-corner" : "chill-zone")
    : a === "projects" ? (b ? "projects/" + b : "projects") : ["blog", "gallery", "about", "stuff-in-here", "tools"].includes(a) ? a : "";
  setBackdrop(key);

  const md_ = document.querySelector('meta[name="description"]');
  if (!v) {
    ws.min = false; win.hidden = true; main.innerHTML = ""; tk.hidden = true;
    document.title = site.title;
    if (md_) md_.content = site.desc;
    $("#desk").focus({ preventScroll: true });
    return;
  }

  ws.min = false; ws.forceMax = !!v.max;
  tk.hidden = false;
  const app = appOf(a === "chill-zone" ? "chill-zone" : a === "projects" ? "projects" : a);
  $("#ttl-i").innerHTML = app ? iconOf(app, true) : pix("about", true); $("#tk-i").innerHTML = app ? iconOf(app, true) : pix("about", true);
  setTitle(v.title); setStatus(v.status); setPath(v.path);
  const up = $("#up"); up.href = v.up || "#/";
  main.classList.toggle("flush", !!v.flush);
  main.innerHTML = v.html;
  paintWin();
  document.title = v.title === site.title ? site.title : `${v.title} — ${site.title}`;
  if (md_ && v.desc) md_.content = v.desc;
  if (v.after) v.after(stale);
  main.scrollTop = 0;
  main.focus({ preventScroll: true });
}
$("#skip").onclick = e => { e.preventDefault(); (win.hidden ? icons.querySelector(".icon") : main).focus(); };
addEventListener("hashchange", route);
route();

loadApps().then(({ apps }) => {
  if (!apps.length) return;
  for (const a of apps) if (!APPS.some(x => x.id === a.id)) APPS.push(a);
  paintApps();
});

let hydrating = 0;
new MutationObserver(() => { cancelAnimationFrame(hydrating); hydrating = requestAnimationFrame(() => hydrateBlocks(main)); }).observe(main, { childList: true, subtree: true });
main.addEventListener("click", e => {
  const b = e.target.closest("[data-lb]"); if (!b) return;
  const group = [...(b.closest(".md, .model-card") || main).querySelectorAll("[data-lb]")];
  LB.list = group.map(x => ({ title: x.dataset.t || "Image", url: x.dataset.lb, path: "", md: "" }));
  openLb(group.indexOf(b));
});

/* ---------- boot sequence ---------- */
(function boot() {
  const el = $("#boot"); if (!el) return;
  const seen = (() => { try { return sessionStorage.getItem("ser.booted"); } catch { return null; } })();
  const done = () => { el.remove(); };
  if (seen || location.hash.length > 2) { done(); return; }
  const log = $("#boot-log"), bar = $("#boot-bar"), pct = $("#boot-pct"), msg = $("#boot-msg");
  const SEG = 28; bar.innerHTML = "<i></i>".repeat(SEG);
  const segs = [...bar.children];
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let shown = 0, target = 0, over = false;
  const line = (t, kind = "ok", tag = "OK") => {
    const li = document.createElement("li"); li.className = kind;
    li.innerHTML = `${esc(t)} ${tag ? `<b>[${tag}]</b>` : ""}`;
    log.append(li); while (log.children.length > 8) log.firstChild.remove();
  };
  const paint = () => {
    const n = Math.round(shown / 100 * SEG);
    segs.forEach((s, i) => { s.classList.toggle("on", i < n); s.style.setProperty("--k", i); });
    pct.textContent = Math.round(shown) + "%";
  };
  const finish = () => {
    if (over) return; over = true;
    try { sessionStorage.setItem("ser.booted", "1"); } catch {}
    shown = 100; paint(); msg.textContent = "Ready";
    el.classList.add("out"); setTimeout(done, calm ? 280 : 580);
  };
  el.addEventListener("pointerdown", finish);
  addEventListener("keydown", finish, { once: true });
  setTimeout(finish, 4500);

  const step = (to, text, kind, tag) => { target = to; msg.textContent = text; if (text) line(text, kind, tag); };
  const wait = ms => new Promise(r => setTimeout(r, calm ? ms / 3 : ms));
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  (async () => {
    const t0 = performance.now();
    line("S.E.R. OS 0.1 · boot loader", "dim", "");
    await wait(200); step(14, "Mounting virtual desktop");
    await withTimeout(document.fonts ? document.fonts.ready : null, 1400);
    step(34, "Loading pixel fonts");
    await wait(160);
    let found = null;
    try { found = await withTimeout(contentFiles(), 2200); } catch {}
    if (found && found.ok) {
      const md = found.paths.filter(p => /^content\/.*\.md$/i.test(p) && !p.split("/").some(s => s.startsWith("_"))).length;
      step(66, `Reading content folder · ${md} file${md === 1 ? "" : "s"}`);
    } else { step(66, "Content folder not reachable, using what's here", "warn", "SKIP"); }
    await wait(180); step(84, "Painting wallpaper");
    await wait(160); step(96, "Starting desktop");
    const rest = 1500 - (performance.now() - t0);
    if (rest > 0) await wait(rest);
    finish();
  })().catch(finish);

  (function loop() {
    if (over) return;
    shown += (target - shown) * (calm ? 1 : .09) + .08;
    shown = Math.min(shown, 99); paint(); requestAnimationFrame(loop);
  })();
})();

</script>
</body>
</html>
