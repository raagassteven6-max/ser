<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steven Edward Raagas</title>
<meta name="description" content="My little corner of the internet. Writing, photos, videos and projects.">
<meta property="og:title" content="Steven Edward Raagas">
<meta property="og:description" content="My little corner of the internet. Writing, photos, videos and projects.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#10121F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2310121F'/%3E%3Cpath fill='%23FF8A3D' d='M2 1h4v2H3v1h3v3H2V5h3V4H2z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
@layer reset, tokens, base, layout, components, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ul { padding: 0; list-style: none; }
}

@layer tokens {
  :root {
    --midnight: #10121F;
    --paper: #F4EBDD;
    --orange: #FF8A3D;
    --cyan: #58D7E8;
    --purple: #8B6CFF;
    --pink: #F15BB5;
    --lime: #B7E36B;

    --sans: "Space Grotesk", system-ui, sans-serif;
    --pixel: "Press Start 2P", monospace;
    --mono: "JetBrains Mono", ui-monospace, monospace;

    --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2.5rem; --s7: 4rem; --s8: 6rem;
    --gutter: clamp(1rem, 4vw, 2.5rem);
    --wrap: 72rem;
  }

  [data-tone="ink"] {
    --bg: var(--midnight); --fg: var(--paper); --muted: #BDB9CF; --line: #3b4070;
    --card: #191c31; --shadow: var(--purple); --link: var(--cyan);
  }
  [data-tone="paper"] {
    --bg: var(--paper); --fg: var(--midnight); --muted: #4a4660; --line: var(--midnight);
    --card: #FFFAF0; --shadow: var(--orange); --link: #5B3FD6;
  }
  [data-tone="float"] {
    --bg: transparent; --fg: var(--paper); --muted: #CFCBDD; --line: rgba(244,235,221,.35);
    --card: #FFFAF0; --shadow: var(--orange); --link: var(--cyan);
  }
  [data-tone="violet"] {
    --bg: var(--purple); --fg: var(--midnight); --muted: #1d1a3a; --line: var(--midnight);
    --card: var(--paper); --shadow: var(--midnight); --link: var(--midnight);
  }
}

@layer base {
  html { scroll-padding-top: 5rem; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--midnight); color: var(--paper);
    font: 400 clamp(1rem, .95rem + .25vw, 1.125rem)/1.6 var(--sans);
    overflow-x: clip;
  }
  h1, h2, h3 { line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
  p { text-wrap: pretty; }
  a { color: var(--link, var(--cyan)); text-underline-offset: .2em; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  main:focus { outline: none; }
  [data-tone] { background: var(--bg); color: var(--fg); }
}

@layer layout {
  .wrap { width: min(100% - 2 * var(--gutter), var(--wrap)); margin-inline: auto; }
  .sec { padding-block: clamp(3rem, 8vw, var(--s8)); }
  .grid-bg {
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
  }
  .cols { display: grid; gap: var(--s5); grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .stack > * + * { margin-block-start: var(--s4); }
}

@layer components {
  .skip { position: absolute; inset-inline-start: var(--s3); inset-block-start: -4rem; z-index: 100; background: var(--orange); color: var(--midnight); padding: var(--s2) var(--s4); font-weight: 700; }
  .skip:focus { inset-block-start: var(--s3); }

  /* header */
  .top { position: sticky; inset-block-start: 0; z-index: 20; background: var(--midnight); border-block-end: 2px dotted #3b4070; }
  .top-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); min-height: 4rem; }
  .brand { display: flex; align-items: center; gap: var(--s3); text-decoration: none; color: var(--paper); }
  .logo { font: 14px/1 var(--pixel); background: var(--orange); color: var(--midnight); padding: .65rem .55rem .55rem .7rem; border: 2px solid var(--paper); box-shadow: 3px 3px 0 var(--cyan); letter-spacing: .05em; }
  .brand-name { font: 500 .8rem var(--mono); display: none; letter-spacing: .02em; }
  .menu-btn { font: 500 .8rem var(--mono); text-transform: uppercase; border: 2px solid var(--paper); padding: .6rem .9rem; min-height: 44px; }
  .nav { display: none; position: absolute; inset-inline: 0; inset-block-start: 100%; background: var(--midnight); border-block-end: 2px solid #3b4070; padding: var(--s3) var(--gutter) var(--s5); }
  .top[data-open] .nav { display: block; }
  .nav a { display: block; padding: .85rem 0; color: var(--paper); text-decoration: none; font: 500 1rem var(--mono); text-transform: uppercase; letter-spacing: .06em; border-block-end: 1px dotted #3b4070; }
  .nav a[aria-current="page"] { color: var(--orange); }
  .nav a[aria-current="page"]::before { content: "> "; }
  @media (min-width: 48rem) {
    .brand-name { display: block; }
    .menu-btn { display: none; }
    .nav { display: block; position: static; background: none; border: 0; padding: 0; }
    .nav ul { display: flex; gap: var(--s5); }
    .nav a { border: 0; padding: .5rem 0; font-size: .8rem; }
    .nav a:hover { color: var(--cyan); }
  }

  /* bits */
  .label { font: 10px/1.6 var(--pixel); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .meta { font: 400 .78rem/1.4 var(--mono); color: var(--muted); letter-spacing: .02em; }
  .dots { height: 0; border: 0; border-block-start: 2px dotted var(--line); margin-block: var(--s5); }
  .chip { display: inline-block; font: 500 .72rem var(--mono); border: 1px solid var(--line); padding: .15rem .5rem; color: var(--fg); }
  .status { display: inline-block; font: 9px/1 var(--pixel); padding: .45rem .5rem .4rem; background: var(--orange); color: var(--midnight); text-transform: uppercase; }
  .status[data-s="Concept"] { background: var(--pink); }
  .status[data-s="Prototype"] { background: var(--cyan); }
  .status[data-s="Completed"] { background: var(--lime); }
  .live { display: inline-flex; align-items: center; gap: .5rem; font: 500 .75rem var(--mono); }
  .live::before { content: ""; width: .55rem; height: .55rem; background: var(--lime); }

  .btn { display: inline-block; font: 700 .95rem var(--sans); text-decoration: none; padding: .8rem 1.2rem; min-height: 44px; background: var(--orange); color: var(--midnight); border: 2px solid var(--midnight); box-shadow: 4px 4px 0 var(--paper); transition: transform .12s steps(2); }
  .btn:hover { transform: translate(-2px, -2px); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--paper); }
  .btn.alt { background: transparent; color: var(--fg); border-color: currentColor; box-shadow: 4px 4px 0 var(--cyan); }
  .btn-row { display: flex; flex-wrap: wrap; gap: var(--s4); }

  .sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--s3) var(--s5); margin-block-end: var(--s6); }
  .sec-head h2 { font-size: clamp(1.8rem, 1.2rem + 2.5vw, 3rem); }
  .sec-head .label { display: block; margin-block-end: var(--s3); }
  .more { font: 500 .85rem var(--mono); }

  /* art */
  .art { display: block; position: relative; overflow: hidden; background: var(--midnight); }
  .art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .plat { display: inline-flex; align-items: center; gap: var(--s2); min-block-size: 44px; padding: .4rem .8rem; border: 2px solid var(--line); color: var(--fg); text-decoration: none; font: 500 .8rem var(--mono); }
  .plat:hover { border-color: var(--cyan); }
  .plat img { inline-size: 1.5rem; block-size: 1.5rem; }
  .cred { display: grid; gap: var(--s4); padding: var(--s5); background: var(--card); color: var(--fg); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); }
  .cred h3 { font-size: 1.4rem; margin: 0; }
  .cred p { color: var(--muted); margin: 0; }
  .cred .who { display: flex; align-items: center; gap: var(--s4); }
  .cred .who img { inline-size: 4.5rem; block-size: 4.5rem; flex: none; border: 2px solid var(--line); image-rendering: pixelated; }
  .code { font: 500 .85rem var(--mono); color: var(--link); overflow-wrap: anywhere; }
  .cred-list { display: grid; gap: var(--s5); }
  @media (min-width: 52rem) { .cred-list.two { grid-template-columns: 1fr 1fr; } }
  .visit { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4); margin-block-start: 2.5rem; padding: var(--s4); background: var(--card); color: var(--fg); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); }
  .visit > img, .visit > svg { inline-size: 3rem; block-size: 3rem; flex: none; image-rendering: pixelated; }
  .visit p { flex: 1 1 14rem; margin: 0; }
  .art svg { width: 100%; height: 100%; }

  /* page backgrounds (images from /backgrounds/<page>/) */
  .backdrop { position: fixed; inset: 0; z-index: -1; background-color: var(--midnight);
    background-image: linear-gradient(#1b1f38 1px, transparent 1px), linear-gradient(90deg, #1b1f38 1px, transparent 1px);
    background-size: 32px 32px; }
  .backdrop.on { background-image: linear-gradient(rgba(16,18,31,.74), rgba(16,18,31,.74)), var(--bgimg); background-size: cover; background-position: center; }
  .banner .wrap { width: min(100% - 2 * var(--gutter), var(--w, var(--wrap))); }
  [data-tone="float"] :is(.card, .vid, .shot, .cred, .visit) { --fg: var(--midnight); --muted: #4a4660; --line: var(--midnight); --link: #5B3FD6; }
  .sheet { padding: clamp(1.25rem, 4vw, 3rem); border: 2px solid var(--midnight); box-shadow: 6px 6px 0 var(--orange); max-inline-size: 46rem; }
  .banner .page-head { padding-block: clamp(2.5rem, 7vw, 5rem) clamp(2rem, 5vw, 3.5rem); }

  /* hero */
  .hero { padding-block: clamp(2.5rem, 7vw, 5.5rem) 0; position: relative; }
  .hero-in { display: grid; gap: var(--s6); align-items: center; }
  .hero h1 { font-size: clamp(2.5rem, 1.1rem + 6vw, 5.4rem); line-height: 1; margin-block: var(--s4) var(--s5); }
  .hero h1 em { font-style: normal; color: var(--orange); }
  .hero p.lead { font-size: clamp(1.1rem, 1rem + .6vw, 1.4rem); max-inline-size: 34rem; color: var(--muted); margin-block-end: var(--s5); }
  .cab { width: min(15rem, 62%); margin-inline: auto; position: relative; }
  .cab svg { width: 100%; height: auto; shape-rendering: crispEdges; filter: drop-shadow(8px 8px 0 #2a2650); }
  .cab .screen-glow { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(16,18,31,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  .blink { animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  @media (min-width: 52rem) { .hero-in { grid-template-columns: minmax(0, 1.35fr) minmax(0, .65fr); } .cab { width: min(19rem, 100%); transform: rotate(2deg); } }
  .shortcuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-block-start: clamp(2.5rem, 6vw, 4.5rem); border-block-start: 2px dotted #3b4070; }
  .shortcuts a { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s4) var(--s3); text-decoration: none; color: var(--paper); border-block-end: 1px dotted #3b4070; }
  .shortcuts a:hover b { color: var(--orange); }
  .shortcuts b { font: 400 clamp(1.4rem, 1rem + 2vw, 2.2rem)/1 var(--pixel); color: var(--cyan); }
  @media (min-width: 40rem) { .shortcuts { grid-template-columns: repeat(4, minmax(0, 1fr)); } .shortcuts a { border-block-end: 0; border-inline-start: 1px dotted #3b4070; } .shortcuts a:first-child { border-inline-start: 0; } }

  /* cards */
  .card { display: grid; background: var(--card); color: var(--fg); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); text-decoration: none; transition: transform .15s steps(3); height: 100%; }
  a.card:hover { transform: translate(-3px, -3px); }
  .card .art { aspect-ratio: 16 / 10; border-block-end: 2px solid var(--line); }
  .card-body { padding: var(--s4) var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s2); }
  .card h3 { font-size: 1.3rem; }
  .card p { color: var(--muted); }
  .item { container-type: inline-size; }
  @container (min-width: 36rem) {
    .card { grid-template-columns: minmax(0, 14rem) 1fr; }
    .card .art { aspect-ratio: auto; height: 100%; min-height: 10rem; border-block-end: 0; border-inline-end: 2px solid var(--line); }
    .card-body { padding: var(--s5); justify-content: center; }
  }
  .list { display: grid; gap: var(--s5); }

  /* projects */
  .story { display: grid; gap: var(--s5); align-items: center; }
  .story + .story { margin-block-start: clamp(2.5rem, 6vw, 4.5rem); }
  .story .art { aspect-ratio: 16 / 10; border: 2px solid var(--line); box-shadow: 6px 6px 0 var(--shadow); }
  .story h2, .story h3 { font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.4rem); margin-block: var(--s3); }
  .story p { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
  @media (min-width: 52rem) { .story { grid-template-columns: 1.1fr .9fr; gap: var(--s7); } .story:nth-child(even) .art { order: 2; } }
  a.plain { text-decoration: none; color: inherit; }
  a.plain:hover h2, a.plain:hover h3 { text-decoration: underline; text-decoration-color: var(--orange); text-decoration-thickness: 3px; }

  /* gallery */
  .filters { display: flex; flex-wrap: wrap; gap: var(--s2); margin-block-end: var(--s5); }
  .filters button { font: 500 .8rem var(--mono); padding: .55rem .9rem; min-height: 44px; border: 2px solid var(--line); color: var(--fg); }
  .filters button[aria-pressed="true"] { background: var(--orange); color: var(--midnight); border-color: var(--orange); }
  .masonry { columns: 2 10rem; column-gap: var(--s4); }
  @media (min-width: 52rem) { .masonry { columns: 3; } }
  .shot { display: block; width: 100%; margin-block-end: var(--s4); break-inside: avoid; border: 2px solid var(--line); background: var(--card); text-align: start; transition: transform .15s steps(3); }
  .shot:hover { transform: translate(-2px, -2px); }
  .shot .art { width: 100%; }
  .shot span.cap { display: block; padding: var(--s2) var(--s3) var(--s3); font: 400 .78rem/1.4 var(--mono); color: var(--muted); }
  .strip { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 9rem), 1fr)); }
  .strip a { border: 2px solid var(--line); }
  .strip .art { aspect-ratio: 1; }

  dialog.lb { border: 0; padding: 0; background: transparent; width: 100%; height: 100%; max-width: 100vw; max-height: 100dvh; color: var(--paper); }
  dialog.lb::backdrop { background: rgba(10,11,20,.94); }
  .lb-in { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: var(--s3); gap: var(--s3); touch-action: pan-y; }
  .lb-bar { display: flex; justify-content: space-between; align-items: center; }
  .lb-stage { display: grid; place-items: center; min-height: 0; }
  .lb-stage .art { width: min(100%, calc((100dvh - 11rem) * var(--r))); border: 2px solid var(--paper); }
  .lb-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .lb-foot p { flex: 1; text-align: center; font-size: .95rem; }
  .lb button { min-width: 44px; min-height: 44px; border: 2px solid var(--paper); font: 500 .85rem var(--mono); padding-inline: var(--s3); }
  .lb button:hover { background: var(--orange); color: var(--midnight); border-color: var(--orange); }

  /* videos */
  .vid { background: var(--card); color: var(--fg); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); }
  .vid-body { padding: var(--s4) var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s2); }
  .vid-body p { color: var(--muted); }
  .player { position: relative; aspect-ratio: 16 / 9; background: var(--midnight); border-block-end: 2px solid var(--line); }
  .player iframe, .player > img, .player > .art { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; width: 100%; }
  .play i { width: 4.5rem; height: 4.5rem; background: var(--orange); border: 3px solid var(--midnight); display: grid; place-items: center; box-shadow: 4px 4px 0 var(--midnight); }
  .play i::after { content: ""; width: 1.5rem; height: 1.7rem; background: var(--midnight); clip-path: polygon(0 0, 100% 50%, 0 100%); margin-inline-start: .25rem; }
  .play:hover i { background: var(--cyan); }
  .feature { margin-block-end: var(--s7); }
  @media (min-width: 52rem) { .feature { display: grid; grid-template-columns: 1.4fr 1fr; align-items: stretch; } .feature .player { border-block-end: 0; border-inline-end: 2px solid var(--line); aspect-ratio: auto; min-height: 16rem; } .feature .vid-body { justify-content: center; padding: var(--s6); } }

  /* article */
  .page-head { padding-block: clamp(2.5rem, 6vw, 4.5rem) clamp(1.5rem, 4vw, 2.5rem); }
  .page-head h1 { font-size: clamp(2.2rem, 1.2rem + 4vw, 4rem); margin-block: var(--s3); }
  .page-head p { max-inline-size: 38rem; color: var(--muted); font-size: 1.15rem; }
  .article { max-inline-size: 42rem; margin-inline: auto; }
  .article h1 { font-size: clamp(2rem, 1.2rem + 3.5vw, 3.4rem); margin-block: var(--s3) var(--s4); }
  .article .art { aspect-ratio: 16 / 8; border: 2px solid var(--line); margin-block: var(--s5) var(--s6); }
  .prose { font-size: 1.15rem; line-height: 1.75; }
  .prose > * + * { margin-block-start: 1.25em; }
  .prose h2 { font-size: 1.6rem; margin-block-start: 2em; }
  .prose ul { list-style: square; padding-inline-start: 1.4em; }
  .prose li + li { margin-block-start: .35em; }
  .prose blockquote { border-inline-start: 5px solid var(--orange); padding-inline-start: var(--s4); font-size: 1.35rem; line-height: 1.4; font-weight: 500; }
  .pn { display: grid; gap: var(--s4); margin-block-start: var(--s7); }
  @media (min-width: 40rem) { .pn { grid-template-columns: 1fr 1fr; } .pn a:last-child { text-align: end; } }
  .pn a { padding: var(--s4); border: 2px dotted var(--line); text-decoration: none; color: var(--fg); }
  .pn a:hover { border-style: solid; }
  .pn .label { display: block; margin-block-end: var(--s2); }
  .back { font: 500 .85rem var(--mono); }
  .shots { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); margin-block-start: var(--s6); }
  .shots .art { aspect-ratio: 16 / 10; border: 2px solid var(--line); }

  /* about */
  .about { display: grid; gap: var(--s6); align-items: start; }
  .about .art { width: min(14rem, 60%); aspect-ratio: 1; border: 2px solid var(--line); box-shadow: 6px 6px 0 var(--shadow); }
  .about h2 { font-size: clamp(1.8rem, 1.2rem + 2.5vw, 3rem); margin-block: var(--s3) var(--s4); }
  .about p { max-inline-size: 38rem; }
  @media (min-width: 48rem) { .about { grid-template-columns: auto 1fr; gap: var(--s7); } }

  /* chill zone */
  .gico { display: inline-block; width: 1.1em; height: .75em; margin-inline-end: .45em; vertical-align: -.05em; fill: currentColor; shape-rendering: crispEdges; }
  .picks { display: grid; gap: var(--s5); grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); }
  .pick { position: relative; display: block; background: var(--card); color: var(--midnight); border: 2px solid var(--midnight); box-shadow: 5px 5px 0 var(--shadow); text-decoration: none; }
  a.pick { transition: transform .15s steps(3); }
  a.pick:hover { transform: translate(-3px, -3px); }
  .pick .art { aspect-ratio: 16 / 9; border-block-end: 2px solid var(--midnight); }
  .pick-body { padding: var(--s4) var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s2); }
  .pick h2 { font-size: 1.6rem; }
  .pick p { color: #4a4660; }
  .pick.soon .art { filter: grayscale(.85) brightness(.8); }
  .pick.soon { box-shadow: 5px 5px 0 #3b4070; }
  .tag { display: inline-block; align-self: start; font: 9px/1 var(--pixel); padding: .45rem .5rem .4rem; text-transform: uppercase; background: var(--lime); color: var(--midnight); }
  .tag.soon { background: var(--pink); }
  .tag.warn { background: var(--orange); }
  .tag.dim { background: transparent; border: 1px solid currentColor; color: #4a4660; }

  .finder { display: grid; gap: var(--s3); grid-template-columns: 1fr; margin-block-end: var(--s6); }

function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  ["#10121F", "#2b2260", "#8B6CFF", "#F15BB5", "#FF8A3D"],
  ["#10121F", "#12394a", "#58D7E8", "#B7E36B", "#F4EBDD"],

function scene(seed, w, h) {
  const r = rng(seed * 7919 + 13), p = SKY[seed % SKY.length];
  const hz = Math.round(h * .62), bh = Math.ceil(hz / 5);
  let s = "";
  const R = (x, y, a, b, f) => { s += `<rect x="${x}" y="${y}" width="${a}" height="${b}" fill="${f}"/>`; };
  p.forEach((c, i) => R(0, i * bh, w, bh + 1, c));
  for (let i = 0; i < w / 4; i++) R(Math.floor(r() * w), Math.floor(r() * bh * 2), 1, 1, "#F4EBDD");
  const rad = Math.max(3, Math.round(Math.min(w, h) / 7)), sx = Math.floor(w * (.25 + r() * .5)), sy = hz - rad - Math.floor(r() * bh * 1.5);
  for (let y = -rad; y <= rad; y++) {
    const half = Math.floor(Math.sqrt(rad * rad - y * y));
    if (sy + y < hz) R(sx - half, sy + y, half * 2 + 1, 1, "#F4EBDD");
  }
  [["#2b2a55", .9], ["#1a1c34", .35], ["#0a0b14", -.45]].forEach(([col, lift]) => {
    let y = hz - bh * lift;
    for (let x = 0; x < w; x++) {
      y = Math.min(h - 2, Math.max(hz - bh * 2, y + (r() - .5) * 2.4));
      const yy = Math.round(y);
      R(x, yy, 1, h - yy, col);
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
}

const providerOf = g => providers.find(p => p.id === g.providerId);

function checkEmbed(g) {
  const pr = providerOf(g);
  if (!pr) return { ok: false, msg: "The provider for this game isn't registered." };
  if (!pr.active) return { ok: false, msg: "This provider is switched off." };
  if (pr.embedMethod !== "iframe") return { ok: false, msg: "This provider doesn't allow embedding here." };
  let u;
  try { u = new URL(g.embedUrl); } catch { return { ok: false, msg: "The embed link isn't a valid URL." }; }
  if (u.protocol !== "https:") return { ok: false, msg: "The embed link isn't HTTPS." };
  if (!pr.allowedOrigins.includes(u.origin)) return { ok: false, msg: "The embed link points to a site I haven't approved." };
  if (!pr.allowedPathPrefixes.some(x => u.pathname.startsWith(x))) return { ok: false, msg: "The embed link has an unexpected path." };
  return { ok: true, url: u.href };
}

function safeLink(url) {
  try { const u = new URL(url); return u.protocol === "https:" ? u.href : ""; } catch { return ""; }
}

function setupLibrary() {
  const box = $("#glib"), q = $("#q"), fp = $("#fp"), fg = $("#fg");
  const draw = () => {
    const term = q.value.trim().toLowerCase(), filtering = term || fp.value || fg.value;
    const hits = liveGames().filter(g => (!term || g.title.toLowerCase().includes(term)) && (!fp.value || g.platform === fp.value) && (!fg.value || g.genre === fg.value));
    const feat = hits.filter(g => g.featured);
    if (!hits.length) { box.innerHTML = `<div class="empty">${liveGames().length ? "Nothing matches that. Try fewer filters." : "I haven't added any games yet."}</div>`; return; }
    const showFeat = !filtering && feat.length, rest = showFeat ? hits.filter(g => !g.featured) : hits;

function setupPlayer(g, pr) {
  const play = $("#play"); if (!play) return;
  const stage = $("#stage"), ui = $("#stage-ui"), fs = $("#fs");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const go = () => {
    const chk = checkEmbed(g);
    if (!chk.ok) { ui.innerHTML = `<p>${esc(chk.msg)}</p>`; return; }
    ui.innerHTML = `<div class="spin" role="status" aria-label="Loading game"></div><p>Loading the game from ${esc(pr.name)}. If nothing shows up, use the Open button below.</p>`;
    const f = document.createElement("iframe");
    f.src = chk.url;
    f.title = g.title;
    f.setAttribute("allow", pr.allow);
    f.setAttribute("allowfullscreen", "");
    f.setAttribute("scrolling", "no");
    f.addEventListener("load", () => ui.remove());
    stage.appendChild(f);
    f.focus();
  };
  play.onclick = go;
  if (fs) fs.onclick = async () => {
    try {
      if (fsEl()) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      await (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
      if (g.orientation === "Landscape" && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
    } catch { fs.textContent = "Fullscreen isn't available here"; }
  };
  document.addEventListener("fullscreenchange", () => { if (fs) fs.textContent = fsEl() ? "Exit fullscreen" : "Fullscreen"; });
}

const lb = $("#lb");
let cur = 0;
function showLb(i) {
  cur = (i + shown.length) % shown.length;
  const g = shown[cur];
  $("#lb-stage").innerHTML = art(g.seed, g.w, g.h, g.alt).replace('style="', `style="--r:${g.w / g.h};`);

$("#lb-close").onclick = () => lb.close();
$("#lb-prev").onclick = () => showLb(cur - 1);
$("#lb-next").onclick = () => showLb(cur + 1);
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") showLb(cur - 1); if (e.key === "ArrowRight") showLb(cur + 1); });
let x0 = null;
lb.addEventListener("touchstart", e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {

  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) showLb(cur + (dx < 0 ? 1 : -1));

const zDisc = {};
const zExists = async (url, kind) => {
  try {
    const r = await fetch(url, { method: "HEAD", cache: "no-cache" });
    if (r.status !== 405 && r.status !== 501) return r.ok;
  } catch {}
  if (kind === "audio") return new Promise(res => {
    const a = new Audio(); a.preload = "metadata";
    a.onloadedmetadata = () => res(true); a.onerror = () => res(false);
    setTimeout(() => res(false), 4000); a.src = url;
  });
  return canLoad(url);
};
async function zFindScenes() {
  const out = []; let miss = 0;
  for (let n = 1; n <= 60 && miss < 2; n++) {
    const src = `zen-corner/scenes/scene-${n}.gif`;
    if (await zExists(src, "img")) { out.push({ n, src }); miss = 0; } else miss++;
  }
  return out;
}
async function zFindTracks(k) {
  const out = [], base = `zen-corner/audio/${k}`;
  if (await zExists(base + ".mp3", "audio")) out.push({ n: 0, src: base + ".mp3" });
  let miss = 0;
  for (let n = 1; n <= 40 && miss < 2; n++) {
    const src = `${base}-${n}.mp3`;
    if (await zExists(src, "audio")) { out.push({ n, src }); miss = 0; } else miss++;
  }
  return out;
}
const zMerge = (auto, manual, rx) => {
  const list = auto.map(x => ({ ...x, ...(manual.find(m => m.src === x.src) || {}) }));
  manual.forEach(m => { if (!list.some(x => x.src === m.src) && !rx.test(m.src)) list.push(m); });
  return list.filter(x => x.published !== false);
};
const zDiscover = () => zDisc.p ??= (async () => {
  const [sc, lo, as] = await Promise.all([zFindScenes(), zFindTracks("lofi"), zFindTracks("asmr")]);
  const scenes = zMerge(sc.map(f => ({ id: "scene-" + f.n, name: "Scene " + f.n, description: "", src: f.src, poster: "", order: f.n, published: true })),
    zenData.scenes, /^zen-corner\/scenes\/scene-\d+\.gif$/).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
  const trk = (k, label, found) => zMerge(found.map((f, i) => ({ id: f.src.split("/").pop().replace(/\.mp3$/, ""), title: label + " track " + (i + 1), artist: "", src: f.src, artwork: "", published: true })),
    zenData.tracks[k], new RegExp("^zen-corner/audio/" + k + "(-\\d+)?\\.mp3$"));
  return { scenes, lofi: trk("lofi", "Lo-fi", lo), asmr: trk("asmr", "ASMR", as) };

function zBuildAudio(k) {
  const label = k === "lofi" ? "Lo-fi" : "ASMR", st = zen.audio.kinds[k];
  const win = zWin(k, label, "audio"), body = win.querySelector(".zw-body");
  if (!st.t) { body.innerHTML = `<p>I haven't added a ${label} track yet.</p>`; return; }
  const a = st.a;
  body.innerHTML = `
    <div class="za">
      <div class="za-top"><span class="za-art" hidden><img alt=""></span><div><strong class="za-title"></strong><span class="meta za-artist"></span></div></div>
      <p class="meta za-err" role="status" hidden></p>
      <div class="za-row"><button class="zbtn za-play">▶ Play</button><input class="za-seek" type="range" min="0" max="1000" value="0" aria-label="Seek ${label}"></div>

    const t = st.t, art = q(".za-art"), im = art.firstChild;

  const win = zReader(), root = win.querySelector(".zr"), view = root.querySelector(".zr-view"), prog = root.querySelector(".zr-prog");
  zCloseBook();

  zs.set("zen.lastbook", b.id);

async function zEpub(b, view, root, prog) {
  await zLoadAll(ZLIB.epub);
  if (!window.ePub) throw new Error("lib");
  view.textContent = "";
  const book = ePub(b.src, { openAs: "epub" });
  const rend = book.renderTo(view, { manager: "continuous", flow: "scrolled", width: "100%", height: "100%" });
  const key = "zen.pos.book." + b.id, themeBtn = root.querySelector('[data-r="theme"]');
  let size = zs.get("zen.rfont", 110), dark = zs.get("zen.rdark", false), ready = false, last = null;
  const rules = (bg, fg, link) => ({ body: { background: bg, color: fg, "line-height": "1.7", "max-width": "42rem", margin: "0 auto", padding: "1rem 1.1rem" }, a: { color: link } });
  rend.themes.register("light", rules("#FFFAF0", "#10121F", "#5B3FD6"));
  rend.themes.register("dark", rules("#10121F", "#F4EBDD", "#58D7E8"));
  const apply = () => {
    rend.themes.select(dark ? "dark" : "light"); rend.themes.fontSize(size + "%");
    root.classList.toggle("dark", dark); themeBtn.setAttribute("aria-pressed", dark);
  };
  const show = loc => {
    last = loc;
    prog.textContent = ready ? Math.round(book.locations.percentageFromCfi(loc.start.cfi) * 100) + "%" : "Section " + (loc.start.index + 1) + " of " + book.spine.length;
  };
  apply();
  rend.on("relocated", loc => { zs.set(key, loc.start.cfi); show(loc); });
  await rend.display(zs.get(key, null) || undefined);
  book.ready.then(() => book.locations.generate(1600)).then(() => { ready = true; if (last) show(last); }).catch(() => {});
  return {
    prev: () => rend.prev(), next: () => rend.next(),
    fup: () => { size = Math.min(200, size + 10); zs.set("zen.rfont", size); apply(); },
    fdn: () => { size = Math.max(70, size - 10); zs.set("zen.rfont", size); apply(); },
    theme: () => { dark = !dark; zs.set("zen.rdark", dark); apply(); },
    destroy: () => { try { rend.destroy(); book.destroy(); } catch {} }
  };
}

async function zPdf(b, view, root, prog) {
  await zLoadAll(ZLIB.pdf);
  const lib = window.pdfjsLib; if (!lib) throw new Error("lib");
  lib.GlobalWorkerOptions.workerSrc = ZLIB.pdfWorker;
  const pdf = await lib.getDocument({ url: b.src }).promise;
  view.textContent = "";
  const key = "zen.pos.book." + b.id, themeBtn = root.querySelector('[data-r="theme"]');
  let page = Math.min(pdf.numPages, Math.max(1, Number(zs.get(key, 1)) || 1)), zoom = zs.get("zen.rzoom", 1), dark = zs.get("zen.rdark", false), tok = 0, task = null, dead = false;

  const render = async () => {
    const my = ++tok;
    if (task) { try { task.cancel(); } catch {} }
    const p = await pdf.getPage(page);
    if (dead || my !== tok) return;
    const fit = Math.max(120, view.clientWidth - 16) / p.getViewport({ scale: 1 }).width, vp = p.getViewport({ scale: fit * zoom });
    const dpr = Math.min(2, window.devicePixelRatio || 1), c = document.createElement("canvas");
    c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
    c.style.width = Math.floor(vp.width) + "px"; c.style.height = Math.floor(vp.height) + "px";
    c.setAttribute("role", "img"); c.setAttribute("aria-label", "Page " + page + " of " + pdf.numPages);
    task = p.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
    try { await task.promise; } catch { return; }

    prev: () => { if (page > 1) { page--; render(); } },
    next: () => { if (page < pdf.numPages) { page++; render(); } },
    zup: () => { zoom = Math.min(3, +(zoom + .25).toFixed(2)); zs.set("zen.rzoom", zoom); render(); },
    zdn: () => { zoom = Math.max(.5, +(zoom - .25).toFixed(2)); zs.set("zen.rzoom", zoom); render(); },
    theme: () => { dark = !dark; zs.set("zen.rdark", dark); root.classList.toggle("dark", dark); themeBtn.setAttribute("aria-pressed", dark); },
    destroy: () => { dead = true; try { if (task) task.cancel(); pdf.destroy(); } catch {} }
  };
}

function zenSetup() {
  zenLeave();
  const ui = document.createElement("div");
  ui.className = "zen-ui"; document.body.appendChild(ui); zen.ui = ui;
  const tok = zen.tok;
  zDiscover().then(found => { if (tok !== zen.tok || !zen.ui) return; zen.lists = found; zenBuild(); });
}

function zenBuild() {
  const ui = zen.ui;
  zAudioInit();

  const stage = $("#zstage"), img = $("#zscene"), msg = $("#zmsg"), nm = $("#zname"), row = $("#zscenes");
  const bar = stage.querySelector(".zen-bar"), fit = () => stage.style.setProperty("--bar", bar.offsetHeight + "px");
  fit(); new ResizeObserver(fit).observe(bar);
  const scenes = zen.lists.scenes;
  if (!scenes.length) { msg.textContent = "I haven't added a scene yet."; }
  else {
    row.innerHTML = scenes.map(x => `<button class="zs" data-id="${esc(x.id)}" aria-pressed="false">${esc(x.name)}</button>`).join("");
    const show = sc => {
      zs.set("zen.scene", sc.id); nm.textContent = sc.name;
      stage.style.backgroundImage = sc.poster ? `url("${sc.poster}")` : "";
      msg.textContent = "Loading the scene…"; msg.hidden = false; img.hidden = false;
      img.alt = sc.name + (sc.description ? ". " + sc.description : "") + " (animated scene)";
      img.src = sc.src;
      [...row.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.id === sc.id));
      const cur = [...row.children].find(b => b.dataset.id === sc.id);
      if (cur) row.scrollLeft += cur.getBoundingClientRect().left - row.getBoundingClientRect().left - 8;
    };
    img.onload = () => { msg.hidden = true; };
    img.onerror = () => { img.hidden = true; msg.textContent = "I can't load this scene right now. Try another one."; msg.hidden = false; };
    row.onclick = e => { const b = e.target.closest("[data-id]"); if (b) show(scenes.find(x => x.id === b.dataset.id)); };
    show(scenes.find(x => x.id === zs.get("zen.scene", "")) || scenes[0]);
  }

  zBuildAudio("lofi"); zBuildAudio("asmr"); zBuildShelf();
  const W = ui.clientWidth;
  zBubble("lofi", "Lo-fi player", "LO-FI", { x: 16, y: 130 });
  zBubble("asmr", "ASMR player", "ASMR", { x: 16, y: 214 });
  zBubble("shelf", "The Shelf", "SHELF", { x: W - 72, y: 84 });
  Object.values(zen.wins).forEach(w => { if (w._sync) w._sync(); });

  const m = zen.audio.master, mr = $("#zmaster"), mb = $("#zmute");
  const paintMaster = () => { mb.textContent = m.muted ? "Unmute" : "Mute"; mb.setAttribute("aria-pressed", m.muted); };
  const applyMaster = () => { zs.set("zen.master", m); Object.values(zen.audio.kinds).forEach(zApplyVol); paintMaster(); };
  mr.value = Math.round(m.vol * 100); paintMaster();
  mr.oninput = () => { m.vol = mr.value / 100; applyMaster(); };
  mb.onclick = () => { m.muted = !m.muted; applyMaster(); };

  zen.onresize = () => { [...ui.children].forEach(el => { if (!el.hidden) zMove(el, el.offsetLeft, el.offsetTop); }); };
  addEventListener("resize", zen.onresize);
}

function zenLeave() {
  zen.tok++;
  if (!zen.ui) return;
  removeEventListener("resize", zen.onresize);
  zCloseBook();
  if (zen.audio) Object.values(zen.audio.kinds).forEach(st => { st.a.pause(); st.a.removeAttribute("src"); st.a.load(); });
  zen.ui.remove();
  zen.ui = null; zen.lists = null; zen.audio = null; zen.wins = {}; zen.bub = {}; zen.reader = null;
}

    <div>
      <a class="brand" href="#/" style="display:inline-flex"><span class="logo">SER</span></a>
      <p class="meta" style="margin-block-start:1rem">${esc(site.footer)}</p>
      <p class="live" style="margin-block-start:.75rem">Online from the Philippines</p>
    </div>
    <nav aria-label="Footer"><ul>
      <li><a href="#/">Home</a></li><li><a href="#/journal">Journal</a></li><li><a href="#/gallery">Gallery</a></li>
      <li><a href="#/videos">Videos</a></li><li><a href="#/projects">Projects</a></li><li><a href="#/chill-zone">Chill Zone</a></li><li><a href="#/stuff-in-here">Stuff in Here</a></li><li><a href="#/about">About</a></li>
      ${site.social.map(s => `<li><a href="${esc(s.url)}" rel="noopener" target="_blank">${esc(s.label)}</a></li>`).join("")}
    </ul></nav>
    <small>© ${new Date().getFullYear()} ${esc(site.title)}</small>
  </div>`;

function route() {
  const parts = (location.hash.slice(1) || "/").split("/").filter(Boolean);
  const [a, b, c] = parts;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  zenLeave();
  let v;
  if (!a || a === "about") v = views.home();
  else if (a === "journal") v = b ? views.article(b) : views.journal();
  else if (a === "gallery") v = views.gallery();
  else if (a === "videos") v = views.videos();
  else if (a === "projects") v = b ? views.project(b) : views.projects();
  else if (a === "stuff-in-here") v = views.stuff();
  else if (a === "chill-zone") v = !b ? views.chill() : b === "game-zone" ? (c ? views.game(c) : views.gameZone()) : b === "zen-corner" ? views.zen() : views.missing();
  else v = views.missing();

  main.innerHTML = v.html;
  const key = (!a || a === "about") ? "home"
    : a === "chill-zone" ? (b === "game-zone" ? "game-zone" : b === "zen-corner" ? "zen-corner" : "chill-zone")
    : a === "projects" ? (b ? "projects/" + b : "projects") : ["journal", "gallery", "videos", "stuff-in-here"].includes(a) ? a : "";
  setBackdrop(key);
  document.title = v.title === site.title ? site.title : `${v.title} — ${site.title}`;
  const md = document.querySelector('meta[name="description"]'); if (md && v.desc) md.content = v.desc;
  if (v.after) v.after();
  hydrateProj();

  document.querySelectorAll(".nav a").forEach(l => {
    const t = l.getAttribute("href").slice(1).split("/").filter(Boolean)[0] || "";
    l.toggleAttribute("aria-current", t === (a === "about" ? "" : a || ""));
    if (l.hasAttribute("aria-current")) l.setAttribute("aria-current", "page");
  });

  topbar.removeAttribute("data-open"); menu.setAttribute("aria-expanded", "false"); menu.textContent = "Menu";
  if (a === "about") $("#about").scrollIntoView(); else window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
